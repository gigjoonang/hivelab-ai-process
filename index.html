3과업)에 해당합니다. 골격이랑 그때까지 정해야 할 항목만 적어놨고 내용은 안 채웠습니다. 빈칸을 추측으로 채우지 마세요.</p>\n  </div>\n\n  <details class=\"fold\"><summary><span class=\"fold-tag\">10월 31일 예정</span>3단계 골격이랑 10/31까지 정할 항목 보기</summary><div class=\"fold-body\"><h2>a · A급·B급 시안 검수</h2>\n  <p>정해진 건 이겁니다. 검수 대상은 고객사에 나가는 모든 시안이고 A급도 포함입니다. 사람이 만든 것도 같은 기준을 받아요. 최소 기준은 품질 기준 문서입니다.</p>\n  <h4>10/31까지 정할 것</h4>\n  <ul>\n    <li>A급이랑 B급에 같은 체크리스트를 쓸지, A급 전용 항목을 더할지</li>\n    <li>검수자가 누구인지. 만든 사람 본인인지, 동료인지, 리드인지</li>\n    <li>불합격 처리 절차. 반려 기준이랑 재검수 시점</li>\n    <li>2-3 컨펌이랑 역할 분담. 중복을 어떻게 줄일지</li>\n  </ul>\n\n  <h2>b · 컴포넌트 정리</h2>\n  <p>정해진 건 정리 대상이 Figma 파일의 컴포넌트 전체라는 것, 명명 규칙은 디자인 시스템 규칙을 따른다는 것입니다.</p>\n  <h4>10/31까지 정할 것</h4>\n  <ul>\n    <li>정리 항목. 미사용 제거, 중복 병합, variant 통합, 이름 정규화, 분리된 인스턴스 복구</li>\n    <li>자동으로 잡히는 것과 사람이 판단할 것의 경계</li>\n    <li>재사용 자산 환원 규칙. 이번에 잘 만든 컴포넌트를 조직 라이브러리로 올리는 기준과 절차</li>\n  </ul>\n\n  <h2>c · 산출물 정리</h2>\n  <h4>10/31까지 정할 것</h4>\n  <ul>\n    <li>고객사 전달 산출물 표준 목록. Figma 링크, 스타일가이드, 에셋 패키지, 개발 인계 문서, 원본</li>\n    <li>폴더 구조랑 파일 명명 규칙</li>\n    <li>개발 인계 범위. 어디까지가 디자인의 일인지</li>\n    <li>보관 정책. 어디에, 얼마나, 누가 접근하는지</li>\n  </ul>\n\n  <h2>d · 스타일가이드 (고객사 납품)</h2>\n  <p>입력은 <code>03-design-tokens.md</code>랑 Figma 컴포넌트입니다. 새로 만드는 게 아니라 이미 확정된 걸 문서 형태로 출력하는 작업이에요.</p>\n  <h4>10/31까지 정할 것</h4>\n  <ul>\n    <li>출력 형식. PDF인지, 웹페이지인지, Figma 페이지인지, 셋 다인지</li>\n    <li>목차 표준안</li>\n    <li>자동으로 뽑을 범위랑 사람이 쓸 범위. 토큰 표는 자동, 사용 원칙 문장은 사람</li>\n    <li>고객사 유형별 분기. 개발팀이 있는 고객사랑 없는 고객사는 필요한 문서가 다릅니다</li>\n  </ul>\n\n  <h2>그동안 해두면 좋은 것</h2>\n  <div class=\"note warn\">\n    <p><strong>1. 2-1-d의 편집 조건 여섯 개 지키기.</strong> 여기서 지켜두면 컴포넌트 정리가 거의 자동으로 끝납니다.</p>\n    <p><strong>2. <code>03-design-tokens.md</code> 성실히 채우기.</strong> 스타일가이드가 이 파일을 출력하는 작업이에요. 이게 부실하면 그때 가서 처음부터 쓰게 됩니다.</p>\n  </div></div></details>","skills":"<div class=\"eyebrow\">TOOLS</div>\n  <h1>스킬 9종</h1>\n  <p class=\"lede\">Claude Code에서 <code>/스킬이름</code>으로 부릅니다. 각 스킬은 앞 단계가 남긴 파일을 읽어서 시작해요. 대화 내용에 기대지 않으니까 며칠 뒤에 다른 사람이 이어받아도 같은 결과가 나옵니다.</p>\n  <p>카드를 누르면 그 스킬이 실제로 뭘 하는지 아래로 내려갑니다.</p>\n  <div class=\"cards\">\n    <div class=\"card\" data-jump=\"sk-intake\"><div class=\"cmd\">/ui-intake</div><div class=\"cd\">프로젝트 폴더 만들고, 기획 문서 받았는지 확인하고, 기본정보랑 NDA 유무 고정</div><div class=\"cf\">0 → 00-brief.md</div></div>\n    <div class=\"card\" data-jump=\"sk-analyze\"><div class=\"cmd\">/ui-analyze</div><div class=\"cd\">기획 문서 읽고 여섯 가지 뽑기. 챙길 것 열 개 체크, 전략 한 줄, 리스크 세 개, 확인 질문 목록</div><div class=\"cf\">1-1 → 00-brief.md</div></div>\n    <div class=\"card\" data-jump=\"sk-structure\"><div class=\"cmd\">/ui-structure</div><div class=\"cd\">사이트 유형 판단, IA 트리, 화면 목록 표, 레이아웃 정석·변주·파격 3안</div><div class=\"cf\">1-2 → 01-ui-structure.md</div></div>\n    <div class=\"card\" data-jump=\"sk-style\"><div class=\"cmd\">/ui-style</div><div class=\"cd\">레퍼런스 6칸 수집, 이미지 갤러리 생성, 스타일 3방향</div><div class=\"cf\">1-3 → 02-design-style.md</div></div>\n    <div class=\"card\" data-jump=\"sk-tokens\"><div class=\"cmd\">/ui-tokens</div><div class=\"cd\">파운데이션 공식과 값 확정, 공통 요소 3종 스펙, 대비 직접 재기, 폰트 라이선스 확인</div><div class=\"cf\">2-0 → 03-design-tokens.md</div></div>\n    <div class=\"card\" data-jump=\"sk-draft\"><div class=\"cmd\">/ui-draft</div><div class=\"cd\">컨셉 → 컴포넌트 설계 → HTML 시안 → Figma 컴포넌트 기반 B급 시안</div><div class=\"cf\">2-1 → 04-draft-log.md</div></div>\n    <div class=\"card\" data-jump=\"sk-assets\"><div class=\"cmd\">/ui-assets</div><div class=\"cd\">힉스필드 연결 확인, 에셋 목록, 확보 경로 결정, 생성 프롬프트, 규격·포맷·용량·alt 정리</div><div class=\"cf\">2-2 → 05-assets.md</div></div>\n    <div class=\"card pend\" data-jump=\"sk-review\"><div class=\"cmd\">/ui-review</div><div class=\"cd\">B급 시안 검수랑 수정 이력 기록. 지금은 품질 기준 수동 적용까지만</div><div class=\"cf\">2-3 → 10월 31일</div></div>\n    <div class=\"card pend\" data-jump=\"sk-handoff\"><div class=\"cmd\">/ui-handoff</div><div class=\"cd\">검수, 컴포넌트 정리, 산출물 정리, 스타일가이드. 지금은 사전 점검 두 가지만</div><div class=\"cf\">3-1 → 10월 31일</div></div>\n  </div>\n\n  <h2>아홉 개가 공통으로 지키는 것</h2>\n  <ul>\n    <li><strong>기준을 스킬 안에 복사하지 않습니다.</strong> 기준은 문서 한 곳에만 있고 스킬은 그걸 가리켜요. 스킬마다 복사해두면 언젠가 서로 충돌합니다.</li>\n    <li><strong>앞 단계 파일이 비어 있으면 멈추고 알립니다.</strong> 추측으로 채우지 않아요. 예를 들어 <code>/ui-tokens</code>는 방향이 확정 안 된 걸 발견하면 \"지금 진행하면 토큰을 다시 잡게 됩니다\"라고 말하고 멈춥니다.</li>\n    <li><strong>끝나면 다음 스킬을 제안합니다.</strong> 동의하면 바로 이어서 실행해요. \"알아서 끝까지\"라고 하면 묻지 않고 넘어갑니다.</li>\n    <li><strong>10/31 스킬 두 개는 부르면 미완성이라고 먼저 말합니다.</strong> 그리고 지금 할 수 있는 범위만 제안해요.</li>\n  </ul>\n\n  <h2>스킬별 상세</h2>\n\n  <article class=\"sk-detail\" id=\"sk-intake\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-intake</span><span class=\"sk-stage\">0 · 착수</span></summary>\n    <div class=\"sk-body\">\n    <p>프로젝트 하나를 이 프로세스 위에 올립니다. 여기서 만든 폴더랑 기본정보를 이후 모든 단계가 입력으로 받아요.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span>사용자 답변, <code>source/</code> 폴더</span></div>\n      <div><b>남기는 것</b><span><code>00-brief.md</code>의 기본정보 표</span></div>\n      <div><b>멈추는 때</b><span>기획 문서가 아직 없을 때</span></div>\n    </div>\n    <h4>하는 일</h4>\n    <ol>\n      <li><code>projects/[프로젝트명]/</code>이 있으면 쓰고, 없으면 <code>new-project.sh</code>로 만듭니다.</li>\n      <li>기획 문서가 <code>source/</code>에 실제로 들어 있는지 확인합니다. 대화에 첨부만 돼 있으면 폴더로 옮기게 해요. 안 그러면 다음 사람이 이어받을 수가 없습니다.</li>\n      <li>문서 형식을 보고 어떤 스킬로 읽을지 정합니다. PDF는 <code>pdf</code>, 워드는 <code>docx</code>, PPT는 <code>pptx</code>. 분량이랑 목차 수준만 파악하고 <strong>내용은 안 읽습니다.</strong> 그건 1-1 일이에요.</li>\n      <li>기본정보 표를 채웁니다. 문서에서 알 수 있는 건 문서에서, 나머지는 한 번에 묶어서 물어봅니다. 고객사, 산업군, NDA 유무, 시안 제출일, 최종 납품일, 결정권자.</li>\n      <li>\"기획서 분석으로 넘어갈까요?\" 하고 <code>/ui-analyze</code>를 제안합니다.</li>\n    </ol>\n    <div class=\"sk-flag\"><b>NDA 유무를 여기서 정합니다.</b> 있으면 이후 전 단계에서 고객사명으로 웹 검색을 안 합니다. 그 사실을 사용자에게도 명시적으로 알려요.</div>\n  </div>\n    </details>\n  </article>\n\n  <article class=\"sk-detail\" id=\"sk-analyze\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-analyze</span><span class=\"sk-stage\">1-1 · 분석</span></summary>\n    <div class=\"sk-body\">\n    <p>기획 문서를 읽고 디자인을 시작해도 되는 상태인지 판단합니다. 요약을 내는 게 목적이 아니라 뭐가 비었는지 찾아내는 게 목적이에요.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span><code>00-brief.md</code> 기본정보, <code>source/</code>의 기획 문서 전문</span></div>\n      <div><b>남기는 것</b><span><code>00-brief.md</code> 전체</span></div>\n      <div><b>멈추는 때</b><span>기본정보 표가 비었으면 <code>/ui-intake</code>부터</span></div>\n    </div>\n    <h4>하는 일</h4>\n    <ol>\n      <li>형식에 맞는 스킬로 문서 <strong>전문</strong>을 읽습니다. 요약본 말고요. 표랑 각주에 제약 조건이 숨어 있는 경우가 많습니다.</li>\n      <li>여섯 가지를 뽑습니다. 비즈니스 목표 / 타겟과 방문 맥락 / 화면·기능 목록 / 제약 / 디자이너가 챙길 것 / 문서에 없는 것.</li>\n      <li>챙길 것은 정해진 열 개 표를 훑습니다. 가변 콘텐츠, 로그인 전후 분리, 관리자 화면, 다국어, 기존 시스템, 접근성, CMS, 개발 프레임워크, 실제 사진 자산, 법적 고지 화면.</li>\n      <li>모든 항목에 <strong>출처</strong>(문서 몇 쪽, 어느 섹션)를 붙입니다. 출처가 없으면 <code>추정</code>으로 표시해요.</li>\n      <li>전략 한 줄이랑 리스크 세 개를 씁니다. 리스크는 \"터지면 무슨 일이 생기나\"랑 대응까지.</li>\n      <li>확인 질문 3~7개. 질문마다 누구에게, 언제까지를 붙입니다.</li>\n      <li>화면에는 전략·리스크·질문 목록만 요약해서 보여주고 <code>/ui-structure</code>를 제안합니다.</li>\n    </ol>\n    <div class=\"sk-flag\">질문이 <b>여덟 개를 넘으면 그 사실을 먼저 말합니다.</b> 기획서가 아직 디자인을 시작할 상태가 아니라는 신호거든요. 그리고 AI 요약을 최종본으로 내지 않습니다. 숫자랑 고유명사는 원문 대조를 거친 것만 확정으로 씁니다.</div>\n  </div>\n    </details>\n  </article>\n\n  <article class=\"sk-detail\" id=\"sk-structure\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-structure</span><span class=\"sk-stage\">1-2 · 구조</span></summary>\n    <div class=\"sk-body\">\n    <p>어떤 유형의 사이트인지 정하고, 화면이 실제로 몇 개 나오는지 계산하고, 레이아웃 세 안을 만듭니다.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span><code>00-brief.md</code></span></div>\n      <div><b>남기는 것</b><span><code>01-ui-structure.md</code></span></div>\n      <div><b>멈추는 때</b><span>전략·화면 후보가 비었으면 <code>/ui-analyze</code>부터</span></div>\n    </div>\n    <h4>하는 일</h4>\n    <ol>\n      <li>여덟 개 유형 중 제일 가까운 걸 고릅니다. 랜딩, 기업소개, 커머스, 대시보드·SaaS, 콘텐츠허브, 커뮤니티, 포트폴리오, 예약·신청. 기획서가 여러 유형을 섞어 요구하면 억지로 끼워 맞추지 않고 하이브리드로 제안해요. <strong>검토했다가 뺀 유형이랑 이유도 적습니다.</strong> 나중에 꼭 질문이 나오거든요.</li>\n      <li>IA 트리를 그립니다. 3뎁스를 넘기지 않아요.</li>\n      <li>화면 목록 표를 만듭니다. <code>상태 변형</code> 칸에 빈 상태, 로딩, 에러, 권한 없음처럼 추가로 그려야 하는 화면을 적습니다.</li>\n      <li>명목 화면 수랑 실제 화면 수를 계산해서 보여줍니다. 보통 1.3~1.6배가 나와요. <strong>이 숫자가 일정의 근거가 된다고 명시적으로 알립니다.</strong></li>\n      <li>레이아웃 3안을 만듭니다. 안마다 존 순서, 그리드 값, 근거 레퍼런스, 장단점. 파격 안은 리스크까지.</li>\n      <li>3안을 나란히 보여주고 <strong>하나를 추천합니다.</strong> 추천 없이 세 개만 늘어놓으면 고르는 시간만 길어져요.</li>\n      <li>사용자가 고르면 확정 표에 날짜랑 결정자를 적고 <code>/ui-style</code>을 제안합니다.</li>\n    </ol>\n    <div class=\"sk-flag\">레이아웃 근거는 <b>실제 운영 중인 사이트에서만</b> 가져옵니다. Dribbble 같은 컨셉 샷은 레이아웃 근거로 안 씁니다. 그리고 여기서 컬러나 폰트는 안 다룹니다. 1-3 일이에요.</div>\n  </div>\n    </details>\n  </article>\n\n  <article class=\"sk-detail\" id=\"sk-style\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-style</span><span class=\"sk-stage\">1-3 · 스타일</span></summary>\n    <div class=\"sk-body\">\n    <p>고객사에 어울리는 스타일 방향 세 개를 만들고, 근거가 되는 레퍼런스를 눈으로 볼 수 있는 갤러리로 만듭니다. 레퍼런스 수집은 이 스킬이 전담해요.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span><code>00-brief.md</code>, <code>01-ui-structure.md</code></span></div>\n      <div><b>남기는 것</b><span><code>02-design-style.md</code>, <code>drafts/reference-gallery.html</code></span></div>\n      <div><b>멈추는 때</b><span>구조 확정 표가 비었으면 <code>/ui-structure</code>부터</span></div>\n    </div>\n    <h4>하는 일</h4>\n    <ol>\n      <li>브랜드 단서를 뽑고 <strong>분위기 형용사 세 개</strong>를 정합니다. 이게 다른 업계 검색의 열쇠예요.</li>\n      <li>NDA가 없으면 고객사 현재 사이트랑 경쟁사 팔레트를 실제로 확인합니다. 업계에 이미 있는 톤이랑 아직 없는 톤을 구분하려고요. 확인한 것과 새로 제안하는 것은 구분해서 표시합니다.</li>\n      <li>여섯 칸을 채웁니다. 정석·변주·파격 × 같은 업계·다른 업계, 총 15장. <strong>다른 업계 칸을 비우지 않아요.</strong> 같은 업계만 보면 결국 업계 평균이 나옵니다.</li>\n      <li>다른 업계는 업계 이름으로 안 나오니까 분위기 형용사를 디자인 언어로 바꿔서 찾습니다. \"신뢰감 있는\" → \"여백이 크고 대비가 낮은\".</li>\n      <li><strong>URL을 전부 직접 열어서 확인합니다.</strong> 안 열리면 그 장은 버려요. 장마다 왜 맞는지, 가져올 것, 버릴 것을 붙이고 셋 중 하나라도 못 쓰면 역시 버립니다.</li>\n      <li>출처 비율을 계산해서 적습니다. 실제 운영 사이트 60% 이상, 컨셉 샷 30% 이하.</li>\n      <li>갤러리 HTML을 만듭니다. 이미지를 다운로드해서 <strong>base64로 직접 넣어요.</strong> 외부 URL로 걸어두면 나중에 열었을 때 깨집니다. 만든 뒤 파일이 실제로 생겼는지 확인하고 절대경로를 알려줍니다.</li>\n      <li>스타일 3방향을 만듭니다. 키워드, 컬러, 타이포, 그래픽, 근거, 맞는 이유, <strong>리스크</strong>까지.</li>\n      <li>비교표로 보여주고 하나를 추천합니다. 저작권 고지를 한 줄 붙이고 <code>/ui-tokens</code>를 제안해요.</li>\n    </ol>\n    <div class=\"sk-flag\">레퍼런스가 안 모인다고 <b>기준을 낮추지 않습니다.</b> 12장을 못 채우면 그 사실이랑 이유를 말해요. 대비 실측은 여기서 안 합니다. 2-0 일이에요.</div>\n  </div>\n    </details>\n  </article>\n\n  <article class=\"sk-detail\" id=\"sk-tokens\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-tokens</span><span class=\"sk-stage\">2-0 · 토큰</span></summary>\n    <div class=\"sk-body\">\n    <p>시안을 그리기 전에 컬러·타이포·간격을 값으로 확정합니다. 이 프로세스에서 기존이랑 순서가 달라지는 건 여기 하나뿐이에요.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span><code>02-design-style.md</code> 확정 방향, <code>01-ui-structure.md</code> 그리드</span></div>\n      <div><b>남기는 것</b><span><code>03-design-tokens.md</code></span></div>\n      <div><b>멈추는 때</b><span>1-4 확정 표가 하나라도 비었을 때</span></div>\n    </div>\n    <h4>하는 일</h4>\n    <ol>\n      <li>고객사에 디자인 시스템이 이미 있는지 봅니다. 있으면 <strong>새로 만들지 않고</strong> 기존 토큰을 그대로 받아 적고, 추가로 필요한 것만 <code>신규</code> 표시로 붙여요. Figma Dev Mode MCP를 쓸 수 있으면 기존 변수를 읽어옵니다.</li>\n      <li><strong>값을 찍기 전에 공식부터 정합니다.</strong> 컬러 명도 단계, 브랜드 상태색 파생(hover·active·disabled), 원색이 대비 미달일 때 쓸 텍스트용 단계, 타입 스케일 배율, 반응형에서 유동·고정 구분, 간격 배수, 반경·그림자 단계. <strong>문장으로</strong> 적어요. 값만 남기면 두 달 뒤에 \"왜 이 값인가\"를 아무도 설명 못 합니다.</li>\n      <li>토큰 표를 전부 채웁니다. 원시값(Neutral 8단)이랑 의미값(<code>text-primary</code>)을 나누고, 화면에서는 의미값만 쓰게 합니다.</li>\n      <li>타이포는 국문 기준으로 정하고 영문을 맞춥니다. 반대로 하면 국문이 깨져요.</li>\n      <li>그리드는 <code>01-ui-structure.md</code> 값을 그대로 옮깁니다. 여기서 새로 정하지 않아요.</li>\n      <li><strong>공통 요소 3종을 여기서 확정합니다.</strong> GNB·헤더, 푸터, 버튼. 전 화면에 반복되는 것들이라 시안마다 달라지면 화면 수만큼 재작업이 나요. 컴포넌트 제작은 2-1이지만 <strong>스펙은 여기서</strong> 정합니다. 버튼은 <strong>최소 높이 44px</strong>를 먼저 잡아요.</li>\n      <li><strong>대비를 직접 잽니다.</strong> 감으로 수치를 쓰지 않고 상대 휘도 공식으로 계산하는 스크립트를 만들어 돌립니다. 미달하면 그 자리에서 값을 고쳐요.</li>\n      <li>폰트 라이선스를 제작사 공식 페이지에서 확인하고 출처랑 확인일을 적습니다. 기억으로 답하지 않아요.</li>\n      <li>토큰 요약이랑 대비 결과, 조정 내역을 보여주고 <code>/ui-draft</code>를 제안합니다.</li>\n    </ol>\n    <div class=\"sk-flag\">방향이 확정 안 됐으면 <b>멈추고 알립니다.</b> \"지금 진행하면 토큰을 다시 잡게 됩니다.\" 그래도 진행하라고 하면 진행하되 파일 상단에 <code>방향 미확정: 재작업 가능성 있음</code>을 적어둡니다.</div>\n  </div>\n    </details>\n  </article>\n\n  <article class=\"sk-detail\" id=\"sk-draft\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-draft</span><span class=\"sk-stage\">2-1 · 시안</span></summary>\n    <div class=\"sk-body\">\n    <p>확정된 구조·스타일·토큰으로 B급 시안을 만듭니다. HTML로 먼저 그리고 그걸 보면서 Figma로 옮겨요. 아홉 개 중 제일 긴 스킬입니다.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span><code>01-ui-structure.md</code>, <code>02-design-style.md</code>, <code>03-design-tokens.md</code></span></div>\n      <div><b>남기는 것</b><span><code>04-draft-log.md</code>, HTML 시안, Figma 프레임</span></div>\n      <div><b>멈추는 때</b><span>확정 표나 토큰이 비었을 때</span></div>\n    </div>\n    <h4>시작 전 확인 네 가지</h4>\n    <ul>\n      <li>1-4 방향이 확정됐나</li>\n      <li><code>03-design-tokens.md</code>가 채워졌나</li>\n      <li>HTML을 PNG로 캡처할 수단이 있나</li>\n      <li>Figma 연결이 되나. 안 되면 플러그인 실행하고 채널 이름을 알려달라고 요청합니다. <strong>연결을 기다리면서 놀지 않고 HTML 시안부터 만들어요.</strong></li>\n    </ul>\n    <h4>하는 일</h4>\n    <ol>\n      <li><strong>a. 컨셉</strong>: <code>[대상]에게 [무엇]을 [어떤 방식]으로 보여주는 화면</code> 한 문장. 형용사가 두 개 이상이면 다시 씁니다. 거기서 디자인 규칙 세 개를 뽑아요.</li>\n      <li><strong>b. 컴포넌트 설계</strong>: 화면 목록에서 두 번 이상 반복되는 요소를 <strong>그리기 전에</strong> 전부 목록으로 만듭니다. 나중에 편집이 편한 시안이 되느냐가 여기서 갈려요.</li>\n      <li><strong>c. HTML 시안</strong>: 토큰을 CSS 변수로 선언하고 그것만 씁니다. 카피는 국문 자리표시 문구로, <code>Lorem ipsum</code>은 안 씁니다. 제일 긴 경우랑 짧은 경우를 확인하고 PNG로 캡처해서 <strong>먼저 보여주고 확인받습니다.</strong></li>\n      <li><strong>d. Figma 이관</strong>: 기존 컴포넌트 확인 후 재사용 → 토큰을 스타일·변수로 올리기 → 컴포넌트 먼저 만들기 → 프레임을 오토레이아웃으로 쌓으며 인스턴스 배치 → 이미지 자리는 규격 표기한 플레이스홀더.</li>\n      <li><strong>e. 점검과 공유</strong>: 품질 기준 A~H를 전부 점검합니다. F 구간(편집 가능성)은 예외 없이 통과해야 해요. Figma 결과랑 HTML 원본을 나란히 보여줍니다.</li>\n      <li><strong>f. 여러 방향</strong>: 방향이 여럿이면 프레임을 옆으로 나란히 배치해서 한 화면에서 비교하게 만듭니다.</li>\n    </ol>\n    <div class=\"sk-flag\"><b>공유할 때 매번 같이 말합니다.</b> 이건 B급 시안이다 / 어느 구조안에 어느 스타일 조합인가 / 폰트가 의도랑 다를 수 있다 / 사진은 색상 플레이스홀더다 / 그라데이션은 단순화됐다. 안 말하면 기대치가 어긋납니다.<br><br>피드백은 전체를 다시 만들지 않고 해당 부분만 고칩니다. 다만 <b>토큰이 문제면 시안에서 고치지 않고 <code>/ui-tokens</code>로 돌아갑니다.</b></div>\n  </div>\n    </details>\n  </article>\n\n  <article class=\"sk-detail\" id=\"sk-assets\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-assets</span><span class=\"sk-stage\">2-2 · 에셋</span></summary>\n    <div class=\"sk-body\">\n    <p>시안에 들어갈 이미지·아이콘·일러스트를 정리하고 만듭니다. 고객사에 보낼 요청 목록도 여기서 나와요.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span><code>03-design-tokens.md</code>, <code>04-draft-log.md</code>의 에셋 요청 목록</span></div>\n      <div><b>남기는 것</b><span><code>05-assets.md</code>, <code>assets/</code> 폴더</span></div>\n      <div><b>멈추는 때</b><span>따로 없음. 시안이 없으면 화면 목록에서 유추하되 <code>추정</code> 표시</span></div>\n    </div>\n    <h4>하는 일</h4>\n    <ol>\n      <li><strong>힉스필드 MCP가 붙어 있는지 먼저 봅니다.</strong> 이름에 <code>higgsfield</code>가 들어간 MCP 툴이 있는지 확인하고, 안 보이면 <code>ToolSearch</code>로 한 번 더 찾아요. 없으면 <a href=\"#\" data-go=\"hf\">힉스필드 연결하기</a>를 안내합니다. <strong>연결 여부를 추측해서 말하지 않습니다.</strong> 붙어 있지도 않은데 \"생성할게요\"라고 하면 파일이 나온 줄 알아요.</li>\n      <li>연결이 없어도 <strong>목록·경로·요청 목록·프롬프트까지는 그대로 만듭니다.</strong> 막히는 건 생성부터예요.</li>\n      <li>시안의 플레이스홀더를 전부 훑어서 표로 만듭니다. <strong>빠뜨리기 쉬운 것들을 매번 확인해요.</strong> OG 이미지, 파비콘, 에러 페이지 일러스트, 빈 상태 일러스트, 로딩 그래픽.</li>\n      <li>어디서 구할지 정합니다. 고객사 제공 → 직접 제작 → 라이선스 스톡 → AI 생성 순서로요.</li>\n      <li>고객사에서 받아야 하는 것만 뽑아서 <strong>그대로 복사해 보낼 수 있는 형태</strong>로 만듭니다. 뭘, 어떤 규격으로, 언제까지. 못 받았을 때 어떻게 할지도 미리 적어둬요. 마감 직전에 정하면 늦습니다.</li>\n      <li>생성 프롬프트를 여섯 단 구조로 씁니다. 피사체 / 구도 / 스타일 / 컬러 / 조명·질감 / 규격. <strong>컬러에 토큰의 실제 HEX 값을 그대로 넣습니다.</strong> \"파란색\"이라고 쓰면 시안이랑 다른 파란색이 나와요. 텍스트가 올라갈 자리도 구도에 지정합니다.</li>\n      <li>만들고 규격을 정리합니다. 파일명 규칙, 2배수 해상도, 포맷, 용량 상한. 넘으면 그 자리에서 압축해요.</li>\n      <li>임시로 만든 건 파일명에 <code>_TEMP</code>를 붙이고 대체물 목록에 올립니다. 전달 전 교체가 필수라고 알려요.</li>\n      <li>AI로 만든 건 도구명, 프롬프트 <strong>전문</strong>, 생성일, 라이선스 확인 결과를 남깁니다. 요약하면 다음에 재현이 안 돼요.</li>\n      <li>모든 이미지에 alt를 씁니다.</li>\n    </ol>\n    <div class=\"sk-flag\"><b>AI로 만들지 않는 것</b>: 사람 얼굴, 실제 제품, 로고, 특정 장소, 텍스트가 들어간 이미지. 고객사가 반드시 알아봅니다.<br><br>에셋이 시안보다 늦게 오면 안 됩니다. 고객사 요청 목록은 시안 제작이랑 동시에 보내세요.</div>\n  </div>\n    </details>\n  </article>\n\n  <article class=\"sk-detail pend\" id=\"sk-review\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-review</span><span class=\"sk-stage\">2-3 · 컨펌 · 10월 31일 작성 예정</span></summary>\n    <div class=\"sk-body\">\n    <p>아직 완성되지 않았습니다. 부르면 <strong>미완성이라는 걸 먼저 말하고</strong> 지금 할 수 있는 범위만 제안해요.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span><code>04-draft-log.md</code></span></div>\n      <div><b>남기는 것</b><span><code>06-review-log.md</code> (형식만 확정)</span></div>\n      <div><b>멈추는 때</b><span>호출 즉시 미완성 고지 후 사용자 동의를 받음</span></div>\n    </div>\n    <h4>지금 되는 것</h4>\n    <ol>\n      <li>시안 정보를 읽고 품질 기준 A~H를 <strong>기계적으로</strong> 적용합니다. 기준을 해석하거나 완화하지 않아요.</li>\n      <li>결과를 <code>06-review-log.md</code>의 기록 표 형식으로 적습니다.</li>\n      <li>불합격 항목은 어느 단계로 돌아가야 하는지 알려줍니다.</li>\n    </ol>\n    <h4>안 하는 것</h4>\n    <ul>\n      <li>자동 재생성. 할지 말지가 10/31에 정할 항목입니다</li>\n      <li>합격·불합격 기준을 임의로 만드는 것</li>\n      <li><code>10/31까지 결정할 것</code> 칸을 추측으로 채우는 것</li>\n    </ul>\n    <div class=\"sk-flag\"><b>바뀌지 않는 원리</b>: 뭘 왜 고쳤는지가 남아야 합니다. 지금까지는 기준 없이 각자 눈대중이었고, 판단 근거가 안 남아서 누가 만들었느냐에 따라 결과가 달랐어요.</div>\n  \n  </div>\n    </details>\n  </article>\n\n  <article class=\"sk-detail pend\" id=\"sk-handoff\">\n    <details class=\"sk-fold\">\n    <summary class=\"sk-head\"><span class=\"sk-cmd\">/ui-handoff</span><span class=\"sk-stage\">3-1 · 정리 · 10월 31일 작성 예정</span></summary>\n    <div class=\"sk-body\">\n    <p>아직 완성되지 않았습니다. 지금은 10/31 작업을 미리 준비하는 점검 두 가지만 할 수 있어요.</p>\n    <div class=\"sk-io\">\n      <div><b>읽는 것</b><span>Figma 파일, <code>04-draft-log.md</code>, <code>03-design-tokens.md</code></span></div>\n      <div><b>남기는 것</b><span><code>07-handoff.md</code> (골격만 확정)</span></div>\n      <div><b>멈추는 때</b><span>호출 즉시 미완성 고지 후 사용자 동의를 받음</span></div>\n    </div>\n    <h4>지금 되는 것</h4>\n    <ol>\n      <li><strong>편집 조건 점검</strong>: Figma 파일을 읽어서 품질 기준 F 구간을 봅니다. 복사 붙여넣기한 그룹, 오토레이아웃 없는 프레임, 직접 입력한 색상, <code>Rectangle 42</code> 같은 이름, 프레임 이름 규칙. 여기서 통과해 두면 컴포넌트 정리가 거의 자동으로 끝납니다.</li>\n      <li><strong>토큰 문서 완성도 점검</strong>: <code>03-design-tokens.md</code>의 빈칸이랑 대비 검사 안 한 항목을 찾아 목록으로 줍니다.</li>\n    </ol>\n    <h4>안 하는 것</h4>\n    <ul>\n      <li>스타일가이드 생성. 출력 형식이랑 목차가 10/31에 정할 항목입니다</li>\n      <li>산출물 폴더 구조를 임의로 만드는 것</li>\n      <li>조직 라이브러리에 컴포넌트를 올리는 것. 기준이랑 절차가 아직 없습니다</li>\n    </ul>\n    <div class=\"sk-flag\"><b>바뀌지 않는 원리</b>: 스타일가이드는 새로 만드는 게 아니라 이미 확정된 걸 문서로 출력하는 작업입니다. 앞 단계를 성실히 했으면 짧게 끝나고, 건너뛰었으면 여기서 프로젝트 전체를 다시 쓰게 돼요.</div>\n  \n  </div>\n    </details>\n  </article>","tpl":"<div class=\"eyebrow\">TOOLS</div>\n  <h1>템플릿 8종</h1>\n  <p class=\"lede\">프로젝트 1건당 복사해서 채웁니다. <code>./bin/new-project.sh 프로젝트명</code>이 전부 복사해 줍니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>파일</th><th>단계</th><th>핵심 칸</th></tr>\n    <tr><td class=\"k\">00-brief.md</td><td><button class=\"jump\" data-stage=\"0\">0</button> · <button class=\"jump\" data-stage=\"1-1\">1-1</button></td><td>기본정보, 전략 한 줄, 리스크 세 개, 확인 질문 목록</td></tr>\n    <tr><td class=\"k\">01-ui-structure.md</td><td><button class=\"jump\" data-stage=\"1-2\">1-2</button></td><td>확정 표, 화면 목록, 레이아웃 3안</td></tr>\n    <tr><td class=\"k\">02-design-style.md</td><td><button class=\"jump\" data-stage=\"1-3\">1-3</button></td><td>확정 표, 레퍼런스 6칸, 스타일 3방향(리스크 포함)</td></tr>\n    <tr><td class=\"k\">03-design-tokens.md</td><td><button class=\"jump\" data-stage=\"2-0\">2-0</button></td><td>파운데이션 공식, 토큰 전체, 공통 요소 3종(GNB·푸터·버튼) 스펙, 대비 실측 결과, 폰트 라이선스</td></tr>\n    <tr><td class=\"k\">04-draft-log.md</td><td><button class=\"jump\" data-stage=\"2-1\">2-1</button></td><td>컨셉, 컴포넌트 목록, 편집 조건 여섯 개, 품질 자체 점검</td></tr>\n    <tr><td class=\"k\">05-assets.md</td><td><button class=\"jump\" data-stage=\"2-2\">2-2</button></td><td>에셋 목록, 고객사 요청 목록, 프롬프트 기록, TEMP 목록</td></tr>\n    <tr><td class=\"k\">06-review-log.md</td><td><button class=\"jump\" data-stage=\"2-3\">2-3</button></td><td>10월 31일 작성 예정</td></tr>\n    <tr><td class=\"k\">07-handoff.md</td><td><button class=\"jump\" data-stage=\"3-1\">3-1</button></td><td>10월 31일 작성 예정</td></tr>\n  </table></div>\n  <h2>전부에 공통으로 들어가는 것</h2>\n  <h3>결정 기록</h3>\n  <pre><code>| 날짜 | 뭘 골랐나 | 왜 | 뭘 버렸나 (이유) |</code></pre>\n  <p>버린 안을 적는 게 특히 중요합니다. 두 달 뒤에 고객이 \"그 방향은 왜 안 했어요?\" 하고 물을 때, 그리고 다음 프로젝트에서 비슷한 상황을 만날 때 씁니다.</p>\n  <p>지금까지 이건 개인의 경험이랑 감이었고, 그 사람이 나가면 같이 사라졌습니다. 조직에 남기는 방법이 이 칸이에요.</p>\n  <h3>변경 이력</h3>\n  <pre><code>| 날짜 | 뭐가 바뀌었나 | 왜 |</code></pre>\n  <p>뒤로 돌아갈 때마다 한 줄 남깁니다.</p>","qb":"<div class=\"eyebrow\">STANDARD</div>\n  <h1>품질 기준</h1>\n  <p class=\"lede\">여기를 다 통과해도 좋은 시안이라는 뜻은 아닙니다. 하나라도 걸리면 내보낼 수 없다는 뜻입니다.</p>\n  <p>지금까지는 기준이 없어서 각자 눈대중으로 봤습니다. 그러다 보니 누가 만들었느냐에 따라 결과가 달랐고요. 이 목록은 그 편차를 줄이려고 만들었습니다.</p>\n  <h2>A · 토큰 준수</h2>\n<p class=\"tight\">불합격이 제일 많이 나오는 구간입니다.</p>\n<ul>\n<li>화면에 쓴 색이 전부 <code>03-design-tokens.md</code>에 있다. 화면에서 색을 뽑아 표와 대조했다</li>\n<li>폰트 크기를 전부 타입 스케일에서 가져왔다. 17px, 23px처럼 어중간한 값을 쓰지 않았다</li>\n<li>간격을 전부 4 또는 8 배수로 맞췄다</li>\n<li>반경과 그림자를 정해둔 단계 안에서 골랐다</li>\n<li>그리드 칼럼·거터·최대폭을 <code>01-ui-structure.md</code> 값 그대로 썼다</li>\n</ul>\n<h2>B · 대비와 접근성</h2>\n<ul>\n<li>본문 텍스트 대비 4.5:1 이상. 계산기로 직접 쟀다</li>\n<li>큰 텍스트(18.66px 이상 Bold 또는 24px 이상) 3:1 이상</li>\n<li>버튼과 입력필드 경계, 아이콘 3:1 이상</li>\n<li>플레이스홀더 텍스트도 본문 대비 기준을 넘긴다</li>\n<li>이미지 위 텍스트에 오버레이나 그림자를 깔았다</li>\n<li>정보를 색으로만 구분한 곳에 아이콘이나 텍스트를 같이 넣었다</li>\n<li>모바일 터치 타겟을 44×44px 이상으로 잡았다</li>\n</ul>\n<h2>C · 상태값</h2>\n<p class=\"tight\">두 번째로 많이 나오는 구간입니다.</p>\n<ul>\n<li>버튼 네 종을 그렸다. default / hover / pressed / disabled</li>\n<li>입력 네 종에 에러 메시지 자리까지 그렸다. default / focus / error / disabled</li>\n<li>링크 세 종을 그렸다. default / hover / visited</li>\n<li>목록 화면의 빈 상태를 그렸다</li>\n<li>로딩 처리 방식을 정했다. 스켈레톤 / 스피너 / 안 씀</li>\n<li>탭과 내비, 체크박스의 선택 상태를 그렸다</li>\n</ul>\n<h2>D · 콘텐츠 현실성</h2>\n<ul>\n<li>카피를 전부 국문으로 채웠다. <code>Lorem ipsum</code>을 쓰지 않았다</li>\n<li>제일 긴 경우를 넣어봤다. 제목 두 줄, 메뉴명 최장, 가격 여덟 자리, 이름 긴 경우</li>\n<li>제일 짧은 경우도 넣어봤다. 항목 하나, 텍스트 한 줄</li>\n<li>목록 항목 수를 실제 예상 범위로 채웠다. 카드 세 장만 놓고 판단하지 않았다</li>\n<li>이미지 자리에 실제 비율과 규격을 적어뒀다</li>\n</ul>\n<h2>E · 구조 일치</h2>\n<ul>\n<li>존 순서를 <code>01-ui-structure.md</code>의 확정 레이아웃 그대로 따랐다</li>\n<li>화면 목록에 있는 화면이고 화면 ID를 붙였다</li>\n<li>내비게이션 항목을 IA 트리와 맞췄다</li>\n<li>데스크톱 말고 브레이크포인트를 최소 하나 더 그렸다</li>\n</ul>\n<h2>F · 편집 가능성</h2>\n<p class=\"tight\">Figma 시안만 해당합니다.</p>\n<ul>\n<li>반복되는 요소를 전부 컴포넌트로 만들어 배치했다. 복사 붙여넣기한 그룹을 남기지 않았다</li>\n<li>모든 프레임에 오토레이아웃을 걸었다</li>\n<li>색을 전부 스타일이나 변수로 연결했다. 직접 입력한 색을 남기지 않았다</li>\n<li>텍스트를 전부 텍스트 스타일로 연결했다</li>\n<li>레이어 이름을 알아볼 수 있게 바꿨다. <code>Rectangle 42</code> 같은 걸 남기지 않았다</li>\n<li>프레임 이름을 <code>화면ID_화면명_등급_방향</code> 형식으로 지었다</li>\n</ul>\n<h2>G · 스타일 방향 일치</h2>\n<ul>\n<li><code>02-design-style.md</code>의 확정 방향대로 만들었다</li>\n<li>세 방향을 만들었다면 서로 확실히 다르다. 색만 바꾼 건 같은 안으로 친다</li>\n<li>2-1-a에서 정한 디자인 규칙 세 개를 지켰다</li>\n</ul>\n<h2>H · 전달 전 고지 사항</h2>\n<ul>\n<li>B급 시안이라고 밝혔다</li>\n<li>폰트가 의도와 다를 수 있다고 알렸다</li>\n<li>사진이 색 플레이스홀더라고 알렸다</li>\n<li>어느 구조안에 어느 스타일 방향 조합인지 밝혔다</li>\n</ul>\n\n<h2>불합격 처리</h2>\n  <div class=\"tblwrap\"><table>\n    <tr><th>구간</th><th>어떻게</th></tr>\n    <tr><td class=\"k\">A 토큰 준수</td><td>다시 만듭니다. 손으로 고치면 또 생겨요. 토큰 자체가 틀렸으면 <button class=\"jump\" data-stage=\"2-0\">2-0</button>으로</td></tr>\n    <tr><td class=\"k\">B 대비와 접근성</td><td><button class=\"jump\" data-stage=\"2-0\">2-0</button>으로 갑니다. 시안에서 색을 바꾸면 다른 화면과 어긋납니다</td></tr>\n    <tr><td class=\"k\">C 상태값</td><td>해당 컴포넌트만 보강</td></tr>\n    <tr><td class=\"k\">D 콘텐츠 현실성</td><td>해당 화면만 다시</td></tr>\n    <tr><td class=\"k\">E 구조 일치</td><td><button class=\"jump\" data-stage=\"1-2\">1-2</button> 확정안을 먼저 봅니다. 시안이 틀린 건지 구조안이 틀린 건지</td></tr>\n    <tr><td class=\"k\">F 편집 가능성</td><td>해당 화면 다시. 예외 없습니다. 여기서 봐주면 3단계 정리를 못 합니다</td></tr>\n    <tr><td class=\"k\">G 스타일 방향 일치</td><td><button class=\"jump\" data-stage=\"1-4\">1-4</button>로 돌아갑니다</td></tr>\n    <tr><td class=\"k\">H 전달 전 고지 사항</td><td>전달 전에 문구 추가</td></tr>\n  </table></div>\n  <div class=\"note warn\"><p>일정이 급하면 시안 개수를 줄이세요. 기준을 낮추지는 마시고요.</p></div>","ref":"<div class=\"eyebrow\">STANDARD</div>\n  <h1>레퍼런스 규칙</h1>\n  <p class=\"lede\">많이 모으는 게 목적이 아닙니다. 이 프로젝트에 왜 맞는지 설명할 수 있는 것만 모읍니다. 근거를 못 대는 레퍼런스는 회의 시간만 늘려요. 그런 건 한 장도 넣지 마세요.</p>\n\n  <h2>레퍼런스 15장 구성</h2>\n  <p>두 가지 기준을 섞어서 여섯 칸을 만듭니다.</p>\n  <ul>\n    <li><strong>얼마나 과감한가</strong>: 정석 / 변주 / 파격, 세 단계</li>\n    <li><strong>어디서 가져왔나</strong>: 같은 업계 / 다른 업계, 두 곳</li>\n  </ul>\n  <div class=\"mx\">\n    <div class=\"hd\"></div><div class=\"hd\">같은 업계에서</div><div class=\"hd\">다른 업계에서</div>\n    <div class=\"rw\">정석<em>무난하게</em></div>\n      <div class=\"cl\"><b>3장</b><em>업계에서 다들 쓰는 방식 안에서 완성도로 승부</em></div>\n      <div class=\"cl\"><b>2장</b><em>다른 업계의 무난하고 탄탄한 구성</em></div>\n    <div class=\"rw\">변주<em>한 군데만 비틀어서</em></div>\n      <div class=\"cl\"><b>3장</b><em>구조는 익숙한데 한 군데가 확 튐</em></div>\n      <div class=\"cl\"><b>2장</b><em>다른 업계에서 빌려온 처리 한 가지</em></div>\n    <div class=\"rw\">파격<em>확 다르게</em></div>\n      <div class=\"cl\"><b>3장</b><em>그 업계에서 아무도 안 쓰는 방식</em></div>\n      <div class=\"cl\"><b>2장</b><em>업종을 못 맞힐 정도로 다른 세계</em></div>\n  </div>\n  <p>총 15장입니다. 최소 12장, 최대 18장. 더 늘리면 고르는 시간만 길어집니다. <strong>여섯 칸 중 하나라도 비우지 마세요.</strong></p>\n\n  <h2>과감한 정도: 세 단계</h2>\n  <h3>정석 · 무난하게</h3>\n  <p class=\"tight\">업계에서 다들 쓰는 방식 안에서 완성도로 승부하는 안입니다. <strong>같은 업계 상위 사이트와 나란히 놔도 어색하지 않으면 정석입니다.</strong> 승인이 빠르고 리스크가 적습니다.</p>\n  <h3>변주 · 한 군데만 비틀어서</h3>\n  <p class=\"tight\">전체 구조는 익숙하게 두고 한 가지 요소만 크게 바꾸는 안입니다. 글꼴이든 컬러든 모션이든 하나만요. <strong>구조는 익숙한데 어느 한 군데가 확 튀면 변주입니다.</strong> 차별화와 안전이 겹치는 자리라 실무에서 제일 많이 채택됩니다.</p>\n  <h3>파격 · 확 다르게</h3>\n  <p class=\"tight\">그 업계에서 아무도 안 쓰는 방식을 가져오는 안입니다. <strong>업계를 모르는 사람에게 보여줬을 때 무슨 업종인지 못 맞히면 파격입니다.</strong> 고객의 기대치를 다시 세팅하는 역할을 합니다. 떨어지더라도 나머지 두 안이 상대적으로 좋아 보이게 만듭니다.</p>\n  <div class=\"note\"><p>세 단계를 A·B·C로 부르지 마세요. A급 시안 / B급 시안과 헷갈려서 회의에서 한 번은 꼭 엉킵니다.</p></div>\n\n  <h2>가져오는 곳: 두 가지</h2>\n  <h3>같은 업계</h3>\n  <p class=\"tight\">고객사와 같은 산업군의 사이트입니다. \"이 업계에서 이미 이렇게 하고 있다\"는 근거가 되기 때문에 고객 설득에 바로 씁니다.</p>\n  <h3>다른 업계</h3>\n  <p class=\"tight\">전혀 상관없는 산업군에서 <strong>디자인 처리만</strong> 빌려옵니다. 업종을 따라오는 게 아니라 만듦새를 따라오는 겁니다.</p>\n  <p class=\"tight\">금융 서비스인데 스포츠 브랜드의 에너지를 가져온다든가, B2B 소프트웨어인데 잡지의 제목 크기 대비를 가져온다든가 하는 식입니다.</p>\n  <div class=\"note warn\"><p><strong>이 칸을 비우지 마세요.</strong> 같은 업계만 들여다보면 결국 그 업계 평균이 나옵니다. \"이런 것도 되는구나\" 싶은 방향은 전부 이 칸에서 나옵니다.</p></div>\n  <h3>다른 업계 찾는 법</h3>\n  <p class=\"tight\">업계 이름으로 검색하면 당연히 같은 업계만 나옵니다. <strong>업계를 빼고 형용사로 찾으세요.</strong></p>\n  <ol>\n    <li>기획서에서 분위기를 나타내는 형용사 세 개를 뽑습니다: 신뢰감 있는 / 빠른 / 전문적인</li>\n    <li>그 형용사를 눈에 보이는 특징으로 바꿉니다: 신뢰감 있는 → 여백이 크고 대비가 낮은, 빠른 → 정보가 빽빽하고 모션이 짧은</li>\n    <li>업계 이름은 빼고 그 특징으로만 검색합니다</li>\n  </ol>\n  <pre><code>minimal high-contrast editorial layout\ndense data-first interface design\noversized typography landing page</code></pre>\n\n  <h2>출처별 우선순위</h2>\n  <div class=\"tblwrap\"><table>\n    <tr><th>순위</th><th>어디</th><th>비율</th><th>무엇에 쓰나</th></tr>\n    <tr><td class=\"k\">1</td><td><strong>실제로 운영 중인 사이트</strong><br>경쟁사 실사이트 · Awwwards · Land-book · SiteInspire · Godly · Mobbin</td><td class=\"k\">60%↑</td><td>전부. 특히 레이아웃과 정보 구조의 근거</td></tr>\n    <tr><td class=\"k\">2</td><td>만들어만 본 컨셉 이미지<br>Dribbble · Behance · Pinterest</td><td class=\"k\">30%↓</td><td>겉모습 아이디어만. 레이아웃 근거로는 쓰지 않음</td></tr>\n    <tr><td class=\"k\">3</td><td>웹이 아닌 시각 자료<br>잡지 편집 · 패키지 · 공간 · 모션</td><td class=\"k\">10%↓</td><td>다른 업계 × 파격 칸에서만</td></tr>\n  </table></div>\n  <div class=\"note\">\n    <div class=\"note-t\">왜 컨셉 이미지를 제한하나</div>\n    <p>Dribbble이나 Behance에 올라온 이미지 상당수는 <strong>실제로 만들어진 적이 없습니다.</strong> 텍스트 세 줄, 카드 네 장 기준으로 예쁘게 짜여 있어서 진짜 콘텐츠를 넣으면 무너져요. 이걸 레이아웃 근거로 쓰면 예쁘긴 한데 실무에서 못 쓰는 시안이 나옵니다.</p>\n    <p>레이아웃이나 정보 밀도, 메뉴 구성은 실제 콘텐츠가 들어갔을 때 안 무너지느냐가 전부이고, 그건 운영 중인 사이트만 증명해 줍니다.</p>\n  </div>\n  <h3>쓰지 않는 것</h3>\n  <ul>\n    <li>원래 어디서 나온 건지 못 찾는 이미지. 핀터레스트에 재업로드된 것 같은 경우</li>\n    <li>AI로 만든 목업. 실제 디자인 결정을 거친 물건이 아닙니다</li>\n    <li>5년 넘은 화면. 고전으로 일부러 인용하는 경우는 예외</li>\n    <li>산업군이나 회사 규모가 두 단계 이상 차이 나는 사례</li>\n  </ul>\n\n  <h2>한 장의 통과 조건</h2>\n  <p>다섯 개를 다 만족해야 합니다. 네 개면 버립니다.</p>\n  <ol>\n    <li><strong>주소가 실제로 열린다.</strong> 추측해서 적지 마세요. 직접 열어보고 확인합니다.</li>\n    <li><strong>이미지가 실제로 보인다.</strong> 링크만 나열하는 건 수집이 아닙니다.</li>\n    <li><strong>왜 이 프로젝트에 맞는지 한 문장으로 말할 수 있다.</strong> 기획서의 어느 대목과 연결되는지 적습니다.</li>\n    <li><strong>가져올 게 하나 특정된다.</strong> \"느낌이 좋다\"는 가져올 게 아니에요. \"히어로에서 본문으로 넘어갈 때 여백이 몇 배로 벌어지는지\" 정도는 돼야 합니다.</li>\n    <li><strong>버릴 게 하나 특정된다.</strong> 통째로 좋은 레퍼런스는 없습니다.</li>\n  </ol>\n  <pre><code>**[정석 · 같은 업계] 사이트명**\n- 주소: https://...  (확인일 2026-09-17)\n- 왜 맞는가: 기획서의 \"신뢰감 있는 전문성\" 요구와 직결. 같은 B2B 서비스 구조.\n- 가져올 것: 헤더 아래 첫 화면을 카피 세 줄로만 채우는 절제\n- 버릴 것: 파란색 계열 팔레트. 경쟁사와 겹침</code></pre>\n\n  <h2>갤러리 만들기</h2>\n  <p>수집 결과는 <strong>이미지가 눈에 보이는 형태</strong>로 넘깁니다. 링크 목록은 산출물이 아닙니다.</p>\n  <ul>\n    <li>파일명은 <code>reference-gallery.html</code>, 프로젝트 폴더 안에 저장</li>\n    <li>이미지는 다운로드해서 HTML 안에 직접 넣습니다. 외부 주소로 걸어두면 나중에 열었을 때 깨집니다</li>\n    <li>여섯 칸 구조 그대로 섹션을 나눕니다. 카드마다 이미지, 출처, 왜 맞는지, 가져올 것, 버릴 것</li>\n    <li>다운로드가 막힌 항목은 억지로 우회하지 말고 링크와 설명으로 대체하고, 갤러리에 그렇게 표시합니다</li>\n  </ul>\n\n  <h2>스타일과 레이아웃 분리</h2>\n  <p>섞으면 논의가 엉킵니다. <strong>스타일</strong>(컬러, 글꼴, 그래픽 처리, 사진 톤)은 <code>02-design-style.md</code>로, <strong>레이아웃</strong>(화면 구성, 섹션 순서, 그리드, 정보 밀도)은 <code>01-ui-structure.md</code>로 갑니다.</p>\n  <p>레이아웃도 정석·변주·파격 세 단계로 뽑습니다. 다만 레이아웃은 <strong>다른 업계 칸이 필수가 아닙니다.</strong> 레이아웃은 업계보다 콘텐츠 종류를 따라가거든요. 상품 목록을 다루는 화면은 업계가 달라도 구성이 비슷합니다. 그래서 업계 대신 <strong>콘텐츠 종류가 같은 곳</strong>에서 찾습니다.</p>\n\n  <h2>검색 방법</h2>\n  <h3>같은 업계</h3>\n  <pre id=\"ref-q1\"><code>site:awwwards.com [산업군]\n[산업군] website 2026 site:land-book.com\n[경쟁사명] 리뉴얼\n[산업군] [best practice / unconventional / experimental] web design</code></pre>\n  <button class=\"copy\" data-copy=\"ref-q1\">검색어 복사</button>\n  <h3>다른 업계</h3>\n  <p>업계 이름으로 검색하면 당연히 같은 업계만 나옵니다. <strong>업계를 빼고 형용사로 찾으세요.</strong></p>\n  <ol>\n    <li>기획서에서 분위기를 나타내는 형용사 세 개를 뽑습니다: 신뢰감 있는 / 빠른 / 전문적인</li>\n    <li>그 형용사를 <strong>눈에 보이는 특징</strong>으로 바꿉니다: 신뢰감 있는 → 여백이 크고 대비가 낮은, 빠른 → 정보가 빽빽하고 모션이 짧은</li>\n    <li>업계 이름은 빼고 그 특징으로만 검색합니다</li>\n  </ol>\n  <pre id=\"ref-q2\"><code>minimal high-contrast editorial layout\ndense data-first interface design\noversized typography landing page</code></pre>\n  <button class=\"copy\" data-copy=\"ref-q2\">검색어 복사</button>\n  <div class=\"note warn\"><p><strong>NDA가 있는 프로젝트는 고객사 이름으로 검색하지 않습니다.</strong> 산업군과 분위기 키워드로만 찾으세요.</p></div>","gl":"<div class=\"eyebrow\">STANDARD</div>\n  <h1>용어집</h1>\n  <p class=\"lede\">프로세스 문서랑 스킬 결과물에서 같은 뜻으로 씁니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>용어</th><th>뜻</th><th>헷갈리기 쉬운 것</th></tr>\n    <tr><td class=\"k\">A급 시안</td><td>고객 제안의 메인 안. 디자이너가 직접 제작</td><td>등급이 아니라 역할 구분입니다</td></tr>\n    <tr><td class=\"k\">B급 시안</td><td>비교용 대안. AI가 만들고 사람이 고르고 손봄</td><td>A급을 대충 만든 게 아닙니다</td></tr>\n    <tr><td class=\"k\">정석·변주·파격</td><td>스타일과 레이아웃이 얼마나 대담한지 세 단계</td><td>A·B·C로 부르지 않습니다</td></tr>\n    <tr><td class=\"k\">같은 업계 / 다른 업계</td><td>레퍼런스를 어디서 가져왔는지. 여섯 칸의 가로축입니다</td><td></td></tr>\n    <tr><td class=\"k\">1-4 방향 확정</td><td>구조랑 스타일을 정하는 지점. 사람이 함</td><td>회의가 아니라 파일에 적는 행위입니다</td></tr>\n    <tr><td class=\"k\">토큰</td><td>컬러, 타이포, 간격 같은 걸 이름 붙여 정해둔 값</td><td>값만이 아니라 이름이 붙어야 토큰입니다</td></tr>\n    <tr><td class=\"k\">원시값 / 의미값</td><td><code>neutral-700</code> / <code>text-primary</code></td><td>화면에서는 의미값만 씁니다</td></tr>\n    <tr><td class=\"k\">variant</td><td>한 컴포넌트가 갖는 속성 조합</td><td>컴포넌트를 복제하는 것과 다릅니다</td></tr>\n    <tr><td class=\"k\">상태값</td><td>hover, focus, disabled, empty, error, loading</td><td>빠뜨리면 개발에서 임의로 만듭니다</td></tr>\n    <tr><td class=\"k\">존 (zone)</td><td>화면을 위에서 아래로 나눈 구역</td><td>섹션이랑 같은 뜻으로 씁니다</td></tr>\n    <tr><td class=\"k\">화면 ID</td><td>화면 목록에서 붙인 고유 식별자</td><td>시안 프레임 이름의 첫 조각</td></tr>\n    <tr><td class=\"k\">상태 변형</td><td>한 화면이 조건에 따라 갖는 다른 모습</td><td>화면 수를 1.3~1.6배로 만드는 요인</td></tr>\n    <tr><td class=\"k\">품질 기준</td><td>B급 시안 체크리스트</td><td>통과했다고 합격은 아닙니다</td></tr>\n    <tr><td class=\"k\">결정 기록</td><td>뭘 골랐고, 왜, 뭘 버렸는지</td><td>템플릿 필수 항목</td></tr>\n    <tr><td class=\"k\">플레이스홀더</td><td>실제 에셋 자리에 놓는 색상 사각형</td><td>규격 표기가 꼭 붙습니다</td></tr>\n    <tr><td class=\"k\">인계 격차</td><td>Figma 자동 조작 한계로 의도랑 달라지는 부분</td><td>폰트, 사진, 그라데이션. 매번 고지</td></tr>\n    <tr><td class=\"k\">AI 레이어</td><td>기존 프로세스 밑에 까는 AI 활용 층</td><td>프로세스를 대체하는 게 아닙니다</td></tr>\n  </table></div>\n  <div class=\"foot\">HIVELAB DESIGN · 디자인 AI 프로세스 v1.0 · 2026.09<br>이 사이트는 저장소의 md 문서를 옮긴 것입니다. 원본은 WORKFLOW.md와 docs/ 입니다.</div>","dsr":"<div class=\"eyebrow\">STANDARD</div>\n  <h1>토큰 · 컴포넌트 명명</h1>\n  <p class=\"lede\">프로젝트마다 이름이 다르면 재사용도 인계도 안 됩니다. 이 규칙은 프로젝트를 안 가려요. 고객사에 기존 시스템이 있으면 그쪽이 우선입니다.</p>\n\n  <h2>토큰 이름</h2>\n  <p><code>범주/역할-단계-상태</code> 형식입니다.</p>\n  <pre id=\"dsr-tokens\"><code>color/primary              color/primary-hover        color/primary-disabled\ncolor/neutral-0 … 900\ncolor/text-primary         color/text-secondary       color/text-disabled\ncolor/bg-default           color/bg-subtle            color/bg-inverse\ncolor/border-default       color/border-strong\ncolor/success-fg           color/success-bg\n\nfont/display  font/h1  font/h2  font/h3\nfont/body-l   font/body  font/body-s  font/caption  font/label\n\nspace/4 … space/128\nradius/s  radius/m  radius/l  radius/full\nshadow/s  shadow/m  shadow/l</code></pre>\n  <button class=\"copy\" data-copy=\"dsr-tokens\">토큰 목록 복사</button>\n\n  <h3>기억할 건 세 가지</h3>\n  <p class=\"tight\"><strong>색 이름에 색상명을 넣지 마세요.</strong> <code>color/blue-500</code> 말고 <code>color/primary</code>입니다. 브랜드 색이 바뀌면 이름이 거짓말이 됩니다.</p>\n  <p class=\"tight\"><strong>원시값과 의미값을 나눕니다.</strong> 의미값(<code>text-primary</code>)이 원시값(<code>neutral-900</code>)을 참조하고, 화면에서는 의미값만 씁니다. 원시값을 직접 쓰기 시작하면 다크모드나 리브랜딩을 못 해요.</p>\n  <p class=\"tight\"><strong>단계는 숫자가 커질수록 진해집니다.</strong></p>\n  <div class=\"note\"><p>실제로 해보면 여기서 제일 많이 걸립니다. 시안에 토큰 밖의 값이 하나 섞이면 티가 안 나는데, 전 화면에 퍼진 다음 디벨롭에서 터져요.</p></div>\n\n  <h2>컴포넌트 이름</h2>\n  <p><code>범주/컴포넌트명</code>으로 쓰고 속성은 variant로 넣습니다.</p>\n  <pre id=\"dsr-comp\"><code>Core/Button        variant: primary·secondary·ghost·danger\n                   size: l·m·s\n                   state: default·hover·pressed·disabled\n                   icon: none·leading·trailing·only\n\nCore/Input         state: default·focus·error·disabled\nCore/Card          variant: default·image-top·horizontal\nCore/Badge         variant: neutral·success·warning·error\nCore/Icon          name: (아이콘 목록)\n\nNav/Header         device: desktop·mobile\nNav/Footer\nNav/Item           state: default·hover·active\n\nFeedback/Modal     size: s·m·l\nFeedback/Toast     variant: info·success·warning·error\n\nSection/Hero       (프로젝트 전용은 Section/ 아래)\nSection/FeatureGrid</code></pre>\n  <button class=\"copy\" data-copy=\"dsr-comp\">컴포넌트 목록 복사</button>\n  <ul>\n    <li>범주는 서너 개, 많아야 다섯 개로 유지합니다. <code>Core</code> / <code>Nav</code> / <code>Feedback</code> / <code>Section</code> / <code>Form</code> 정도면 충분해요.</li>\n    <li><strong>variant를 쓰고 컴포넌트를 복제하지 마세요.</strong> <code>Button-Primary</code>랑 <code>Button-Secondary</code>를 따로 만들면 수정할 때 전부 따로 고쳐야 합니다.</li>\n    <li>variant 조합이 16개를 넘으면 컴포넌트를 쪼갭니다.</li>\n    <li>프로젝트 전용은 <code>Section/</code> 아래에 둡니다. 나중에 조직 라이브러리로 올릴 때 <code>Core/</code>만 골라내면 되니까요.</li>\n  </ul>\n\n  <h2>레이어 이름</h2>\n  <p><code>Rectangle 42</code>, <code>Frame 128</code>, <code>Group 7</code>을 남기지 마세요.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>무엇</th><th>이렇게</th></tr>\n    <tr><td class=\"k\">프레임</td><td><code>HOME_히어로</code></td></tr>\n    <tr><td class=\"k\">텍스트</td><td><code>headline</code> / <code>subcopy</code> / <code>cta-label</code></td></tr>\n    <tr><td class=\"k\">이미지</td><td><code>img_hero-bg</code></td></tr>\n    <tr><td class=\"k\">플레이스홀더</td><td><code>ph_product-thumb_320x240</code></td></tr>\n  </table></div>\n  <p>이름만 보고 뭔지 알 수 있어야 합니다. 며칠 뒤에 다른 사람이 열었을 때 클릭 안 하고도 알아야 해요.</p>\n\n  <h2>프레임 이름</h2>\n  <p><code>화면ID_화면명_등급_방향</code> 형식입니다.</p>\n  <pre id=\"dsr-frame\"><code>HOME_메인_B_변주\nPROD-01_상품목록_B_정석\nHOME_메인_A</code></pre>\n  <button class=\"copy\" data-copy=\"dsr-frame\">예시 복사</button>\n  <p><code>화면ID</code>는 <code>01-ui-structure.md</code>의 화면 목록 ID랑 같아야 합니다. 등급은 A급이면 <code>A</code>, B급이면 <code>B</code>. 방향은 정석·변주·파격이고, <strong>A급은 방향 표기를 생략합니다.</strong></p>\n\n  <h2>오토레이아웃 기본값</h2>\n  <pre id=\"dsr-al\"><code>페이지 최상위   세로, 간격 0, 패딩 0, 자식 폭 채우기\n섹션           세로, 간격 space/48~96, 좌우 패딩은 (뷰포트-최대폭)/2\n콘텐츠 그룹     세로, 간격 space/16~24\n가로 나열       가로, 간격 space/16~24, 정렬 명시\n버튼 내부       가로, 간격 space/8, 패딩 space/12 space/24</code></pre>\n  <button class=\"copy\" data-copy=\"dsr-al\">기본값 복사</button>\n  <div class=\"note warn\"><p><strong>모든 프레임에 오토레이아웃을 겁니다.</strong> 절대 위치로 놓은 요소는 화면 하나 추가할 때마다 사람이 손으로 옮기게 됩니다.</p></div>\n\n  <h2>고객사에 기존 시스템이 있으면</h2>\n  <p>이 문서보다 고객사 규칙이 우선입니다. <code>03-design-tokens.md</code> 상단에 <code>명명 규칙: 고객사 시스템 준수</code>라고 적고 그 아래에 고객사 규칙을 요약해 두세요.</p>\n  <div class=\"note\"><p><strong>두 규칙을 섞지 마세요.</strong> 섞인 파일은 양쪽 어디서도 못 씁니다.</p></div>\n\n  <h2>재사용 자산 환원</h2>\n  <p>프로젝트 끝나면 잘 만든 걸 조직 라이브러리로 올립니다. 이게 없으면 몇 년을 해도 매번 처음부터예요.</p>\n  <p>올리는 건 아래를 다 만족하는 것만.</p>\n  <ul>\n    <li><code>Core/</code> 범주다. 프로젝트 고유가 아니다</li>\n    <li>variant가 정리돼 있다</li>\n    <li>토큰만 쓴다. 하드코딩한 값이 없다</li>\n    <li>다른 프로젝트에서 색만 바꾸면 그대로 쓸 수 있다</li>\n  </ul>\n  <p>절차랑 저장 위치는 <a href=\"#\" data-go=\"s3\">3단계 · 정리</a>에서 정합니다.</p>","asset":"<div class=\"eyebrow\">STANDARD</div>\n  <h1>에셋 만들기</h1>\n  <p class=\"lede\">프롬프트를 잘 쓰는 것보다 프로젝트 토큰을 프롬프트에 넣는 게 훨씬 중요해요. 예쁜 이미지가 필요한 게 아니라 <strong>이 시안에 맞는</strong> 이미지가 필요한 거니까요.</p>\n\n  <div class=\"note\"><p>힉스필드 MCP를 아직 안 붙였다면 <a href=\"#\" data-go=\"hf\">힉스필드 연결</a>을 먼저 보세요. 한 번만 하면 됩니다. <strong>연결이 없어도 이 페이지의 목록·경로·프롬프트까지는 그대로 진행합니다.</strong></p></div>\n\n  <h2>프롬프트 여섯 단</h2>\n  <p>이 순서로 쓰면 다시 만들 때 비슷하게 나옵니다. 앞에 올수록 결과에 크게 반영됩니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>단</th><th>무엇을 쓰나</th></tr>\n    <tr><td class=\"k\">1 피사체</td><td>뭐가 있는가. 명사 중심으로, 형용사는 최소로</td></tr>\n    <tr><td class=\"k\">2 구도</td><td>시점, 배치, 여백. 텍스트 올라갈 자리를 비워둘 건지</td></tr>\n    <tr><td class=\"k\">3 스타일</td><td>사진 / 일러스트 / 3D / 추상. 구체적인 장르명으로</td></tr>\n    <tr><td class=\"k\">4 컬러</td><td><strong>프로젝트 토큰 값을 그대로 넣습니다</strong></td></tr>\n    <tr><td class=\"k\">5 조명·질감</td><td>광원 방향, 대비, 노이즈나 그레인</td></tr>\n    <tr><td class=\"k\">6 규격</td><td>비율, 해상도</td></tr>\n  </table></div>\n\n  <h3>히어로 배경 그래픽</h3>\n  <pre id=\"asset-p1\"><code>abstract flowing gradient mesh, no objects, large empty space on the left half,\nminimal digital art, primary color #1A4FD6 and accent #FF6B2C on deep neutral #0E1116,\nsoft diffused light from top right, subtle film grain,\n16:9 wide composition</code></pre>\n  <button class=\"copy\" data-copy=\"asset-p1\">프롬프트 복사</button>\n  <p>왼쪽 절반을 비운 건 헤드라인이 거기 오기 때문입니다. <strong>텍스트 올라갈 자리를 먼저 지정하세요.</strong> 안 그러면 매번 다시 만들게 됩니다.</p>\n  <p>컬러는 <code>03-design-tokens.md</code>의 실제 값을 씁니다. \"파란색\"이라고 쓰면 시안이랑 다른 파란색이 나와요.</p>\n\n  <h3>섹션 일러스트</h3>\n  <pre id=\"asset-p2\"><code>simple line illustration of [주제], single continuous stroke style,\n2px uniform line weight, no fill, on transparent background,\nline color #1A4FD6 only,\ncentered composition with generous margin, square 1:1</code></pre>\n  <button class=\"copy\" data-copy=\"asset-p2\">프롬프트 복사</button>\n  <p>선 굵기를 숫자로 지정합니다. 아이콘 세트랑 굵기가 달라지면 한 화면에서 바로 티가 납니다.</p>\n\n  <h3>반복 배경 패턴</h3>\n  <pre id=\"asset-p3\"><code>seamless tileable geometric pattern, thin lines forming irregular grid,\nvery low contrast, #0E1116 background with #1A4FD6 lines at 12% opacity,\nflat, no gradient, no shadow, square tile</code></pre>\n  <button class=\"copy\" data-copy=\"asset-p3\">프롬프트 복사</button>\n  <p><code>seamless tileable</code>을 빼면 이어붙일 때 경계가 보입니다.</p>\n\n  <h2>AI로 만들지 않는 것</h2>\n  <div class=\"tblwrap\"><table>\n    <tr><th>대상</th><th>왜</th><th>대신</th></tr>\n    <tr><td class=\"k\">사람 얼굴</td><td>고객사가 알아봅니다. 표정이랑 손가락이 어긋나요</td><td>스톡이나 고객사 제공</td></tr>\n    <tr><td class=\"k\">실제 제품</td><td>형태가 미묘하게 틀립니다</td><td>고객사 제공. 필수</td></tr>\n    <tr><td class=\"k\">로고</td><td>브랜드 자산입니다</td><td>고객사 제공 또는 직접 제작</td></tr>\n    <tr><td class=\"k\">텍스트 들어간 이미지</td><td>글자가 깨집니다. 한글은 특히</td><td>이미지 위에 실제 텍스트 레이어</td></tr>\n    <tr><td class=\"k\">정확한 다이어그램·차트</td><td>구조가 안 맞습니다</td><td>직접 제작</td></tr>\n    <tr><td class=\"k\">특정 장소</td><td>없는 건물이 나옵니다</td><td>스톡이나 촬영</td></tr>\n  </table></div>\n  <div class=\"note warn\"><p><strong>도구가 바뀌어도 이 표는 그대로입니다.</strong> 힉스필드가 붙었다고 쓸 수 있는 범위가 넓어지지 않아요. 확보 경로는 고객사 제공 → 직접 제작 → 라이선스 스톡 → AI 생성 순입니다. AI가 1순위가 되는 경우는 없습니다.</p></div>\n\n  <h2>시안용 임시 대체물</h2>\n  <p>2-1 시안 단계에서 최종 에셋이 아직 없을 때, 플레이스홀더 대신 분위기만 맞는 걸 만들어 쓰면 방향 판단이 훨씬 정확해집니다. 다만:</p>\n  <ul>\n    <li>파일명에 <code>_TEMP</code>를 붙입니다. <code>HOME_hero-bg_TEMP_2880x1620.webp</code></li>\n    <li><code>05-assets.md</code>에 <code>대체물: 최종 교체 필요</code>로 적어둡니다</li>\n    <li>고객사 전달 전에 꼭 교체합니다. 교체 확인은 <a href=\"#\" data-go=\"s3\">3단계 검수</a> 항목이에요</li>\n  </ul>\n\n  <h2>규격</h2>\n  <p><code>03-design-tokens.md</code>나 기획서에 다른 값이 없으면 이걸 씁니다.</p>\n  <h3>해상도</h3>\n  <div class=\"tblwrap\"><table>\n    <tr><th>용도</th><th>1배</th><th>제작 규격</th></tr>\n    <tr><td class=\"k\">풀블리드 히어로 배경</td><td>1920×1080</td><td>2880×1620</td></tr>\n    <tr><td class=\"k\">콘텐츠 폭 이미지</td><td>1200×675</td><td>2400×1350</td></tr>\n    <tr><td class=\"k\">카드 썸네일</td><td>400×300</td><td>800×600</td></tr>\n    <tr><td class=\"k\">아바타</td><td>80×80</td><td>160×160</td></tr>\n    <tr><td class=\"k\">아이콘</td><td>—</td><td>SVG (24×24 기준 그리드)</td></tr>\n  </table></div>\n  <h3>포맷과 용량</h3>\n  <pre id=\"asset-spec\"><code>사진          WebP  (JPEG는 대체 포맷으로만)\n그래픽·아이콘  SVG\n투명 필요     PNG-24\n애니메이션     Lottie(JSON) 또는 WebM. GIF는 안 씁니다\n\n히어로 이미지    300KB\n일반 이미지      150KB\n썸네일           60KB\n아이콘 SVG       10KB</code></pre>\n  <button class=\"copy\" data-copy=\"asset-spec\">규격 복사</button>\n  <p>넘으면 디자인 문제가 아니라 성능 문제가 됩니다. 개발 인계할 때 반드시 지적받아요.</p>\n  <h3>메타 이미지와 비율</h3>\n  <p class=\"tight\"><strong>OG 이미지</strong> 1200×630, 텍스트는 중앙 안전영역 안에. <strong>파비콘</strong> SVG + 32×32 PNG + 180×180(apple-touch-icon).</p>\n  <p class=\"tight\">비율은 <code>16:9</code> 히어로·동영상 / <code>4:3</code> 일반 콘텐츠 / <code>1:1</code> 아바타·아이콘·SNS / <code>3:2</code> 사진 갤러리. <strong>한 화면에서는 두 종류 이내로 씁니다.</strong> 세 종류 넘게 섞이면 정렬이 무너져요.</p>\n\n  <h2>대체 텍스트</h2>\n  <p>모든 이미지에 씁니다. 접근성 요구가 있으면 필수고, 없어도 SEO에 쓰입니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>구분</th><th>이렇게</th></tr>\n    <tr><td class=\"k\">장식용 이미지</td><td><code>alt=\"\"</code> 빈 값입니다. 생략이 아니라 빈 값</td></tr>\n    <tr><td class=\"k\">정보 전달 이미지</td><td>이미지가 없을 때 대신 읽힐 문장</td></tr>\n    <tr><td class=\"k\">링크 안 이미지</td><td>이미지 설명 말고 링크가 어디로 가는지</td></tr>\n  </table></div>\n  <p>\"이미지\", \"사진\", <code>img_hero_01</code>, 파일명 그대로는 쓰지 마세요.</p>\n\n  <h2>기록</h2>\n  <p>AI로 만든 건 <code>05-assets.md</code>에 아래를 남깁니다. 고객사가 나중에 물어보고, 라이선스 조건도 도구마다 다릅니다.</p>\n  <pre id=\"asset-log\"><code>| ID | 도구 | 생성일 | 프롬프트 | 후보정 | 라이선스 확인 |</code></pre>\n  <button class=\"copy\" data-copy=\"asset-log\">표 복사</button>\n  <div class=\"note\"><p><strong>프롬프트는 전문을 남기세요.</strong> 요약하면 다음에 재현이 안 됩니다. 도구명도 어디서 만들었는지까지 적습니다 — <code>Higgsfield (MCP)</code>, <code>Higgsfield (웹)</code>. 나중에 재현할 때 경로가 달라져요.</p></div>","hf":"<div class=\"eyebrow\">CONNECT</div>\n  <h1>힉스필드 연결</h1>\n  <p class=\"lede\">AI 이미지 생성 도구입니다. Claude Code에 MCP로 붙여두면 프롬프트 쓰고, 생성하고, 규격 맞춰 저장하고, 기록까지 한자리에서 끝나요. 한 번만 하면 됩니다.</p>\n  <div class=\"note\"><p><strong>2-2 에셋 단계에서만 씁니다.</strong> 시안까지는 필요 없으니 급하지 않으면 나중에 해도 됩니다. 뭘 만들고 뭘 안 만드는지는 <a href=\"#\" data-go=\"asset\">에셋 만들기</a>에 있어요.</p></div>\n\n  <h2>1 · 등록</h2>\n  <p>터미널에서 한 번만 하면 됩니다.</p>\n  <pre id=\"hf-add\"><code>claude mcp add --transport http higgsfield https://mcp.higgsfield.ai/mcp</code></pre>\n  <button class=\"copy\" data-copy=\"hf-add\">명령 복사</button>\n  <div class=\"tblwrap\"><table>\n    <tr><th>스코프</th><th>붙일 옵션</th><th>언제</th></tr>\n    <tr><td class=\"k\">나만, 이 프로젝트</td><td>없음 (기본값)</td><td>한 번 써보는 중일 때</td></tr>\n    <tr><td class=\"k\">나만, 모든 프로젝트</td><td><code>-s user</code></td><td>개인 계정으로 계속 쓸 때</td></tr>\n    <tr><td class=\"k\">팀 공유</td><td><code>-s project</code></td><td>레포 <code>.mcp.json</code>에 기록됩니다</td></tr>\n  </table></div>\n  <div class=\"note warn\"><p><code>-s project</code>로 붙이면 <code>.mcp.json</code>이 저장소에 올라갑니다. <strong>저장소가 공개라</strong> 커밋 전에 파일 안에 계정 정보가 안 들어갔는지 꼭 보세요.</p></div>\n\n  <h2>2 · 인증</h2>\n  <p><strong>등록만으로는 안 씁니다.</strong> 상태를 먼저 봅니다.</p>\n  <pre id=\"hf-list\"><code>claude mcp list</code></pre>\n  <button class=\"copy\" data-copy=\"hf-list\">명령 복사</button>\n  <p><code>! Needs authentication</code>이 뜨면 인터랙티브 터미널에서 <code>claude</code>를 띄우고 <code>/mcp</code>를 칩니다. 목록에서 <code>higgsfield</code>를 골라 인증을 시작하면 브라우저가 열리고, 거기서 힉스필드 계정으로 로그인합니다.</p>\n  <div class=\"note warn\"><p><strong>계정 정보는 사람이 직접 넣습니다.</strong> Claude가 대신 입력하지 않아요.</p></div>\n  <p>데스크탑 앱 Code 탭에서는 <code>/mcp</code>가 안 열립니다. <strong>터미널에서 하세요.</strong></p>\n\n  <h2>3 · 확인</h2>\n  <p>인증이 끝나면 <code>claude mcp list</code>가 <code>✓ Connected</code>로 바뀝니다. 그 다음 <strong>세션을 다시 시작해야</strong> 툴이 잡혀요.</p>\n  <p>제대로 붙었으면 <code>/ui-assets</code>를 돌렸을 때 이렇게 말합니다.</p>\n  <div class=\"note\"><p>\"힉스필드 MCP 연결 확인했어요. 프롬프트 정리되는 대로 바로 생성 들어갈게요.\"</p></div>\n\n  <h2>연결이 없으면</h2>\n  <p>멈추지 않습니다. 목록 만들기, 확보 경로 정하기, 고객사 요청 목록, 프롬프트 쓰기까지는 연결 없이도 그대로 갑니다. <strong>생성만</strong> 사람이 힉스필드 웹에서 하고, 받은 파일을 <code>projects/[프로젝트명]/assets/</code>에 넣으면 규격 정리랑 기록은 이어서 갑니다.</p>\n\n  <h2>붙었다고 범위가 넓어지지 않습니다</h2>\n  <p>연결 여부와 상관없이 <strong>AI로 만들지 않는 것</strong>은 그대로입니다. 사람 얼굴, 실제 제품, 로고, 특정 장소, 텍스트가 들어간 이미지. 확보 경로도 고객사 제공 → 직접 제작 → 라이선스 스톡 → AI 생성 순 그대로고요.</p>\n  <p>전체 표는 <a href=\"#\" data-go=\"asset\">에셋 만들기</a>에 있습니다.</p>"};
  </script>
  <script>
    const chevronIcon = `
      <svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M5 7.5 10 12.5 15 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    function navIcon(src) {
      return `<img class="icon" src="${src}" alt="" width="18" height="18" />`;
    }

    const COVER_MS = 780;
    const EXPAND_MS = 420;

    const uiNavItems = [
      { label: "설치하기", page: "setup", icon: "assets/icon-install.png" },
      { label: "피그마 연결하기", page: "figma", icon: "assets/icon-connect.png" },
      { label: "힉스필드 연결하기", page: "hf", icon: "assets/icon-connect.png" },
      { label: "시작하기", page: "home", icon: "assets/icon-start.png" },
      {
        label: "단계별 가이드",
        icon: "assets/icon-file.png",
        children: [
          { label: "1단계 · 분석", page: "s1" },

        icon: "assets/icon-stage.png",
        children: [
          { label: "품질 기준", page: "qb" },
          { label: "레퍼런스 규칙", page: "ref" },
          { label: "토큰 · 컴포넌트 명명", page: "dsr" },

      { label: "에셋 만들기", page: "asset", icon: "assets/icon-stage.png" },

    const navData = [
      { cat: "UI Design", items: uiNavItems },

      { cat: "글로벌 대응", disabled: true, items: uiNavItems },
      { cat: "광고 마케팅", disabled: true, items: uiNavItems },
      { cat: "프로모션 페이지", disabled: true, items: uiNavItems },
    ];

    const STAGE_TO_PAGE = {
      "0": ["s1", "st-0"],
      "1-1": ["s1", "st-1-1"],
      "1-2": ["s1", "st-1-2"],
      "1-3": ["s1", "st-1-3"],
      "1-4": ["s1", "st-1-4"],
      "2-0": ["s2", "st-2-0"],
      "2-1": ["s2", "st-2-1"],
      "2-2": ["s2", "st-2-2"],
      "2-3": ["s2", "st-2-3"],
      "2-4": ["s2", "st-2-4"],
      "2-5": ["s2", "st-2-5"],
      "3-1": ["s3", null],
    };

    const panel = document.getElementById("main-panel");
    const toc = document.getElementById("page-toc");
    const mapLayout = document.querySelector(".map-layout");
    const pages = window.GUIDE_PAGES || {};
    const pendingHtml = `<div class="panel-content"><p class="lede">이 직군 가이드는 준비 중입니다.</p></div>`;
    let tocHeads = [];
    let tocLinks = [];

    function headingLabel(el) {
      return (el.textContent || "").replace(/\s+/g, " ").trim();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function ensureHeadingId(el, used) {
      if (el.id) {
        used.add(el.id);
        return el.id;
      }
      let n = used.size + 1;
      let id = "sec-" + n;
      while (used.has(id) || document.getElementById(id)) {
        n += 1;
        id = "sec-" + n;
      }
      used.add(id);
      el.id = id;
      return id;
    }

    function bindPageToc() {
      const content = panel.querySelector(".panel-content");
      const used = new Set();
      const items = (content ? [...content.querySelectorAll("h2, h3")] : [])
        .filter((el) => !el.closest("details.fold"))
        .map((el) => ({
          el,
          id: ensureHeadingId(el, used),
          text: headingLabel(el),
          level: el.tagName === "H3" ? 3 : 2,
        }))
        .filter((item) => item.text);

      tocHeads = items.map((item) => item.el);
      tocLock = null;
      clearTimeout(tocLockTimer);

      if (!items.length) {
        toc.hidden = true;
        toc.innerHTML = "";
        mapLayout.classList.remove("has-toc");
        tocHeads = [];
        tocLinks = [];
        return;
      }

      toc.hidden = false;
      mapLayout.classList.add("has-toc");
      toc.innerHTML =
        `<div class="toc-title">목차</div>` +
        `<div class="toc-list">` +
        items.map((item, i) => {
          const prev = items[i - 1];
          const next = items[i + 1];
          const upper = prev ? prev.level : item.level;
          const lower = next ? next.level : item.level;
          const cls = ["toc-link", "is-h" + item.level];
          if (i === 0) cls.push("is-first");
          if (i === items.length - 1) cls.push("is-last");
          if (item.level !== upper) cls.push("bend-in");
          if (item.level !== lower) cls.push("bend-out");
          const x1 = upper <= 2 ? 0.5 : 10.5;
          const x2 = item.level <= 2 ? 0.5 : 10.5;
          const elbow = item.level !== upper
            ? `<svg class="toc-elbow" viewBox="0 0 16 16" aria-hidden="true"><line x1="${x1}" y1="0" x2="${x2}" y2="12" /></svg>`
            : "";
          return `<a class="${cls.join(" ")}" href="#${item.id}" data-toc-i="${i}">${elbow}<span class="toc-rail"></span>${escapeHtml(item.text)}</a>`;
        }).join("") +
        `</div>`;
      tocLinks = [...toc.querySelectorAll(".toc-link")];
      spyToc();
    }

    let tocLock = null;
    let tocLockTimer = 0;
    let tocProgrammatic = false;

    function setTocActive(idx) {
      tocLinks.forEach((a, i) => a.classList.toggle("is-active", i === idx));
    }

    function spyToc() {
      if (!tocLinks.length || !tocHeads.length) return;
      if (tocLock !== null) {
        setTocActive(tocLock);
        return;
      }
      const maxScroll = panel.scrollHeight - panel.clientHeight;
      if (maxScroll > 2 && panel.scrollTop >= maxScroll - 8) {
        setTocActive(tocHeads.length - 1);
        return;
      }
      const rootTop = panel.getBoundingClientRect().top;
      let idx = 0;
      for (let i = 0; i < tocHeads.length; i++) {
        if (tocHeads[i].getBoundingClientRect().top - rootTop <= 36) idx = i;
        else break;
      }
      setTocActive(idx);
    }

    function lockToc(idx) {
      tocLock = idx;
      tocProgrammatic = true;
      setTocActive(idx);
      clearTimeout(tocLockTimer);
      tocLockTimer = setTimeout(() => {
        tocProgrammatic = false;
      }, 1200);
    }

    function releaseTocLock() {
      if (tocProgrammatic || tocLock === null) return;
      tocLock = null;
    }

    toc.addEventListener("click", (e) => {
      const a = e.target.closest("[data-toc-i]");
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(a.getAttribute("data-toc-i"));
      const el = tocHeads[idx];
      if (!el) return;
      lockToc(idx);
      el.scrollIntoView({ block: "start", behavior: "smooth" });
    });

    const STAGES = [
      ["0", "s1", "st-0", "착수", ""],
      ["1-1", "s1", "st-1-1", "기획 문서 분석", ""],
      ["1-2", "s1", "st-1-2", "구조 · 레이아웃", ""],
      ["1-3", "s1", "st-1-3", "스타일 · 레퍼런스", ""],
      ["1-4", "s1", "st-1-4", "방향 확정", ""],
      ["2-0", "s2", "st-2-0", "디자인 토큰", ""],
      ["2-1", "s2", "st-2-1", "컨셉 · 시안 제작", ""],
      ["2-2", "s2", "st-2-2", "디자인 에셋", ""],
      ["2-3", "s2", "st-2-3", "B급 시안 컨펌", "pd"],
      ["2-4", "s2", "st-2-4", "A급 시안 · 디벨롭", "hm"],
      ["3-1", "s3", null, "정리", "pd"],
    ];
    const STAGE_GAP = { "1-4": 1, "2-4": 1 };
    const pbar = document.getElementById("pbar");
    const pnow = document.getElementById("pnow");
    const psteps = document.getElementById("psteps");
    psteps.innerHTML = STAGES.map((s) =>
      `<button class="pstep ${s[4]}" type="button" data-stage="${s[0]}" title="${s[0]} ${s[3]}">${s[0]}</button>` +
      (STAGE_GAP[s[0]] ? '<span class="pgap"></span>' : "")
    ).join("");
    const pchips = psteps.querySelectorAll(".pstep");

    function syncStageNav(id) {
      document.querySelectorAll("#sidebar .nav-row").forEach((row) => {
        const page = row.dataset.page;
        const group = (row.dataset.pages || "").split(",").filter(Boolean);
        row.classList.toggle("is-current", page === id || group.includes(id));
      });
      // 그룹이 여러 개이므로 전부 순회한다. 판정은 라벨이 아니라 page id 로.
      document.querySelectorAll("#sidebar .submenu").forEach((sub) => {
        sub.querySelectorAll(".sub-item").forEach((el) => {
          el.classList.toggle("is-active", el.dataset.page === id);
        });
        placeSubmenuMark(sub);
      });
    }

    function spyPbar() {
      const onStage = app.classList.contains("is-map") && (currentPage === "s1" || currentPage === "s2" || currentPage === "s3");
      if (!onStage) {
        pbar.hidden = true;
        return;
      }
      const wasHidden = pbar.hidden;
      pbar.hidden = false;
      if (wasHidden) {
        const pbarIn = document.getElementById("pbar-in");
        if (pbarIn && typeof pbarIn.updateLiquidGlass === "function") {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => pbarIn.updateLiquidGlass());
          });
        }
      }
      const top = panel.getBoundingClientRect().top;
      let cur = null;
      STAGES.forEach((s) => {
        if (s[1] !== currentPage) return;
        if (!cur) cur = s;
        const el = s[2] ? panel.querySelector("#" + CSS.escape(s[2])) : null;
        if (el && el.getBoundingClientRect().top - top <= 120) cur = s;
      });
      if (!cur) return;
      pnow.innerHTML = "<i>" + cur[0] + "</i>" + cur[3];
      pchips.forEach((c) => c.setAttribute("data-on", c.dataset.stage === cur[0] ? "1" : "0"));
      const on = psteps.querySelector('.pstep[data-on="1"]');
      if (on && psteps.scrollWidth > psteps.clientWidth) {
        psteps.scrollTo({
          left: on.offsetLeft - psteps.clientWidth / 2 + on.offsetWidth / 2,
          behavior: "smooth",
        });
      }
    }

    pbar.addEventListener("click", (e) => {
      const st = e.target.closest("[data-stage]");
      if (!st) return;
      e.preventDefault();
      showStage(st.getAttribute("data-stage"));
    });

    let pbarTick = false;
    panel.addEventListener("scroll", () => {
      if (pbarTick) return;
      pbarTick = true;
      requestAnimationFrame(() => {
        spyPbar();
        spyToc();
        pbarTick = false;
      });
    }, { passive: true });

    panel.addEventListener("wheel", releaseTocLock, { passive: true });
    panel.addEventListener("touchmove", releaseTocLock, { passive: true });

    let currentPage = "setup";

    function showPage(id, hash) {
      const same = currentPage === id && !!panel.firstElementChild;
      currentPage = id;
      panel.classList.toggle("has-pbar", id === "s1" || id === "s2" || id === "s3");
      if (!same) {
        const html = pages[id];
        panel.innerHTML = html
          ? `<div class="panel-content">${html}</div>`
          : pendingHtml;
        panel.scrollTop = 0;
        bindPageToc();
      }
      if (hash) {
        const el = panel.querySelector("#" + CSS.escape(hash));
        if (el) {
          const idx = tocHeads.indexOf(el);
          if (idx >= 0) lockToc(idx);
          el.scrollIntoView({ block: "start", behavior: same ? "smooth" : "auto" });
        } else if (!same) {
          panel.scrollTop = 0;
        }
      } else if (same) {
        panel.scrollTo({ top: 0, behavior: "smooth" });
      }
      syncStageNav(id);
      requestAnimationFrame(() => {
        spyPbar();
        spyToc();
      });
    }

    function showStage(stage) {
      const mapped = STAGE_TO_PAGE[stage];
      if (!mapped) return;
      showPage(mapped[0], mapped[1]);
    }

    function placeSubmenuMark(sub) {
      if (!sub) return;
      const mark = sub.querySelector(".submenu-mark");
      const active = sub.querySelector(".sub-item.is-active");
      if (!mark) return;
      if (!active || !sub.classList.contains("is-open")) {
        mark.style.opacity = "0";
        return;
      }
      mark.style.top = active.offsetTop + "px";
      mark.style.height = active.offsetHeight + "px";
      mark.style.opacity = "1";
    }

    function syncSubmenuMarks() {
      sidebar.querySelectorAll(".submenu").forEach(placeSubmenuMark);
    }

    function clearNavActive() {
      sidebar.querySelectorAll(".sub-item.is-active").forEach((el) => el.classList.remove("is-active"));
      syncSubmenuMarks();
    }

    const sidebar = document.getElementById("sidebar");
    const sidebarScroll = document.createElement("div");
    sidebarScroll.className = "sidebar-scroll";
    sidebar.appendChild(sidebarScroll);
    navData.forEach((block) => {
      const disabled = !!block.disabled;
      const wrap = document.createElement("div");
      wrap.className = "nav-block" + (disabled ? " is-disabled" : "");
      wrap.innerHTML = `<div class="cat">${block.cat}</div>`;
      if (disabled) {
        const pending = document.createElement("div");
        pending.className = "nav-pending";
        pending.textContent = "준비 중";
        wrap.appendChild(pending);
        sidebarScroll.appendChild(wrap);
        return;
      }
      block.items.forEach((item) => {
        const hasChildren = Array.isArray(item.children);
        const opened = hasChildren;   // 그룹은 항상 펼친 상태로 시작
        const row = document.createElement("button");
        row.type = "button";
        row.className = "nav-row" + (opened ? " is-open" : "");
        if (item.page) row.dataset.page = item.page;
        if (hasChildren) {
          row.dataset.pages = item.children.map((child) => child.page).join(",");
        }
        const showChevron = hasChildren;
        row.innerHTML = `${navIcon(item.icon)}<span>${item.label}</span>${showChevron ? chevronIcon : ""}`;
        wrap.appendChild(row);
        if (hasChildren) {
          const sub = document.createElement("div");
          sub.className = "submenu" + (opened ? " is-open" : "");
          const mark = document.createElement("span");
          mark.className = "submenu-mark";
          const body = document.createElement("div");
          body.className = "submenu-body";
          sub.appendChild(mark);
          sub.appendChild(body);
          item.children.forEach((child, idx) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "sub-item";
            btn.dataset.page = child.page;
            btn.textContent = child.label;
            btn.addEventListener("click", () => {
              showPage(child.page);
            });
            body.appendChild(btn);
          });
          wrap.appendChild(sub);
          row.addEventListener("click", () => {
            const willOpen = !sub.classList.contains("is-open");
            row.classList.toggle("is-open", willOpen);
            sub.classList.toggle("is-open", willOpen);
            if (willOpen && item.children.some((c) => c.page === currentPage)) {
              // 이미 이 그룹 안의 페이지를 보고 있을 때만 위치를 다시 잡는다
            }
            requestAnimationFrame(() => placeSubmenuMark(sub));
          });
        } else {
          row.addEventListener("click", () => {
            showPage(item.page);
          });
        }
      });
      sidebarScroll.appendChild(wrap);
    });


    showPage("setup");
    requestAnimationFrame(syncSubmenuMarks);

    panel.addEventListener("click", (e) => {
      const go = e.target.closest("[data-go]");
      if (go) {
        e.preventDefault();
        showPage(go.getAttribute("data-go"));
        return;
      }
      const stageBtn = e.target.closest("[data-stage]");
      if (stageBtn) {
        e.preventDefault();
        showStage(stageBtn.getAttribute("data-stage"));
        return;
      }
      const jump = e.target.closest("[data-jump]");
      if (jump) {
        e.preventDefault();
        const target = panel.querySelector("#" + CSS.escape(jump.getAttribute("data-jump")));
        if (target) {
          const fold = target.querySelector("details") || target.closest("details");
          if (fold) fold.open = true;
          target.scrollIntoView({ block: "start", behavior: "smooth" });
        }
        return;
      }
      const copyBtn = e.target.closest("[data-copy]");
      if (copyBtn) {
        e.preventDefault();
        const src = panel.querySelector("#" + CSS.escape(copyBtn.getAttribute("data-copy")));
        if (!src || !navigator.clipboard) return;
        const prev = copyBtn.textContent;
        navigator.clipboard.writeText(src.innerText).then(() => {
          copyBtn.textContent = "복사됨";
          setTimeout(() => { copyBtn.textContent = prev; }, 1400);
        }).catch(() => {});
      }
    });

    const ROLES = [
      { name: "UI 디자이너", enabled: true },
      { name: "모션 디자이너", enabled: false },
      { name: "게임 디자이너", enabled: false },
      { name: "브랜딩 디자이너", enabled: false },
    ];

    const app = document.getElementById("app");
    const form = document.getElementById("gnb");
    const input = document.getElementById("job-input");
    const chipsInner = document.getElementById("role-chips-inner");
    const roleLabel = document.getElementById("role-label");

    let navLock = false;
    let glassMoveRaf = 0;

    function watchGlassDuringMove(ms = COVER_MS) {
      const start = performance.now();
      cancelAnimationFrame(glassMoveRaf);
      const tick = (now) => {
        form.dispatchEvent(new Event("liquid-glass-resize"));
        const pbarHost = document.getElementById("pbar-in");
        if (pbarHost) pbarHost.dispatchEvent(new Event("liquid-glass-resize"));
        if (now - start < ms) glassMoveRaf = requestAnimationFrame(tick);
      };
      glassMoveRaf = requestAnimationFrame(tick);
    }

    function normalize(str) {
      return str.replace(/\s+/g, "").toLowerCase();
    }

    function renderChips() {
      chipsInner.innerHTML = "";
      ROLES.forEach((role) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "role-chip";
        btn.textContent = role.name;
        btn.dataset.role = role.name;
        if (!role.enabled) btn.disabled = true;
        chipsInner.appendChild(btn);
      });
    }

    function openRoles() {
      if (app.classList.contains("is-map")) return;
      if (!form.classList.contains("is-expanded")) {
        form.classList.add("is-expanded");
        watchGlassDuringMove(EXPAND_MS);
      }
    }

    function closeRoles() {
      if (!form.classList.contains("is-expanded")) return;
      form.classList.remove("is-expanded");
      if (!app.classList.contains("is-map")) watchGlassDuringMove(EXPAND_MS);
    }

    function goToMap(role) {
      if (navLock) return;
      const resolved = ROLES.find((item) => normalize(item.name) === normalize(role || ""));
      if (!resolved || !resolved.enabled) {
        openRoles();
        return;
      }
      navLock = true;
      roleLabel.textContent = resolved.name;
      closeRoles();
      app.classList.add("is-map");
      showPage("setup");
      watchGlassDuringMove(COVER_MS);
      requestAnimationFrame(spyPbar);
      setTimeout(() => { navLock = false; }, COVER_MS);
    }

    function goHome() {
      if (navLock) return;
      navLock = true;
      app.classList.remove("is-map");
      input.value = "";
      closeRoles();
      watchGlassDuringMove(COVER_MS);
      spyPbar();
      setTimeout(() => { navLock = false; }, COVER_MS);
    }

    renderChips();

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) {
        openRoles();
        input.focus();
        return;
      }
      goToMap(value);
    });

    form.addEventListener("click", (e) => {
      if (e.target.closest("#gnb-logo, #gnb-brand, .gnb-user")) return;
      if (app.classList.contains("is-map")) return;
      openRoles();
    });

    input.addEventListener("focus", openRoles);
    input.addEventListener("input", openRoles);

    chipsInner.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-role]");
      if (!btn || btn.disabled) return;
      input.value = btn.dataset.role;
      goToMap(btn.dataset.role);
    });

    document.addEventListener("click", (e) => {
      if (!form.contains(e.target)) closeRoles();
    });

    document.getElementById("gnb-logo").addEventListener("click", goHome);
    document.getElementById("gnb-brand").addEventListener("click", goHome);
    document.getElementById("gnb-home-btn").addEventListener("click", goHome);

    /* Apple Liquid Glass — kube.io refraction + SVG displacement as backdrop-filter */
    (function initLiquidGlass() {
      const dispNode = document.getElementById("lg-disp");
      if (!dispNode) return;

      const supportsUrlBackdrop = (() => {
        const probe = document.createElement("div");
        probe.style.backdropFilter = "url(#liquid-glass)";
        probe.style.webkitBackdropFilter = "url(#liquid-glass)";
        const parsed = `${probe.style.backdropFilter} ${probe.style.webkitBackdropFilter}`;
        return parsed.includes("url") || !!window.chrome;
      })();

      if (!supportsUrlBackdrop) return;

      const convexSquircle = (x) => Math.pow(1 - Math.pow(1 - x, 4), 1 / 4);

      function calculateDisplacementMap1D(glassThickness, bezelWidth, surfaceFn, refractiveIndex, samples = 128) {
        const eta = 1 / refractiveIndex;
        function refract(normalX, normalY) {
          const dot = normalY;
          const k = 1 - eta * eta * (1 - dot * dot);
          if (k < 0) return null;
          const kSqrt = Math.sqrt(k);
          return [
            -(eta * dot + kSqrt) * normalX,
            eta - (eta * dot + kSqrt) * normalY,
          ];
        }
        const result = [];
        for (let i = 0; i < samples; i++) {
          const x = i / samples;
          const y = surfaceFn(x);
          const dx = x < 1 ? 0.0001 : -0.0001;
          const y2 = surfaceFn(Math.max(0, Math.min(1, x + dx)));
          const derivative = (y2 - y) / dx;
          const magnitude = Math.sqrt(derivative * derivative + 1);
          const normal = [-derivative / magnitude, -1 / magnitude];
          const refracted = refract(normal[0], normal[1]);
          if (!refracted) {
            result.push(0);
          } else {
            const remainingHeight = y * bezelWidth + glassThickness;
            result.push(refracted[0] * (remainingHeight / refracted[1]));
          }
        }
        return result;
      }

      function calculateDisplacementMap2D(width, height, radius, bezelWidth, maximumDisplacement, precomputedMap) {
        const imageData = new ImageData(width, height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          data[i] = 128;
          data[i + 1] = 128;
          data[i + 2] = 0;
          data[i + 3] = 255;
        }
        const radiusSquared = radius * radius;
        const radiusPlusOneSquared = (radius + 1) * (radius + 1);
        const radiusMinusBezelSquared = Math.max(0, (radius - bezelWidth) * (radius - bezelWidth));
        const widthBetweenRadiuses = width - radius * 2;
        const heightBetweenRadiuses = height - radius * 2;
        for (let y1 = 0; y1 < height; y1++) {
          for (let x1 = 0; x1 < width; x1++) {
            const isOnLeftSide = x1 < radius;
            const isOnRightSide = x1 >= width - radius;
            const isOnTopSide = y1 < radius;
            const isOnBottomSide = y1 >= height - radius;
            const x = isOnLeftSide ? x1 - radius : isOnRightSide ? x1 - radius - widthBetweenRadiuses : 0;
            const y = isOnTopSide ? y1 - radius : isOnBottomSide ? y1 - radius - heightBetweenRadiuses : 0;
            const distanceToCenterSquared = x * x + y * y;
            const isInBezel =
              distanceToCenterSquared <= radiusPlusOneSquared &&
              distanceToCenterSquared >= radiusMinusBezelSquared;
            if (!isInBezel) continue;
            const distanceFromCenter = Math.sqrt(distanceToCenterSquared);
            const opacity =
              distanceToCenterSquared < radiusSquared
                ? 1
                : 1 - (distanceFromCenter - Math.sqrt(radiusSquared)) /
                    (Math.sqrt(radiusPlusOneSquared) - Math.sqrt(radiusSquared));
            const distanceFromSide = radius - distanceFromCenter;
            const cos = distanceFromCenter > 0 ? x / distanceFromCenter : 0;
            const sin = distanceFromCenter > 0 ? y / distanceFromCenter : 0;
            const bezelRatio = Math.max(0, Math.min(1, distanceFromSide / bezelWidth));
            const bezelIndex = Math.min(precomputedMap.length - 1, Math.floor(bezelRatio * precomputedMap.length));
            const distance = precomputedMap[bezelIndex] || 0;
            const innerFeather = Math.max(4, bezelWidth * 0.4);
            const fromInner = bezelWidth - distanceFromSide;
            const t = Math.max(0, Math.min(1, fromInner / innerFeather));
            const innerFade = t * t * (3 - 2 * t);
            const dX = maximumDisplacement > 0 ? (-cos * distance) / maximumDisplacement : 0;
            const dY = maximumDisplacement > 0 ? (-sin * distance) / maximumDisplacement : 0;
            const idx = (y1 * width + x1) * 4;
            const strength = opacity * innerFade;
            data[idx] = Math.max(0, Math.min(255, 128 + dX * 127 * strength));
            data[idx + 1] = Math.max(0, Math.min(255, 128 + dY * 127 * strength));
          }
        }
        return imageData;
      }

      function calculateSpecularHighlight(width, height, radius, bezelWidth, specularAngle = Math.PI / 3) {
        const imageData = new ImageData(width, height);
        const data = imageData.data;
        const specularVector = [Math.cos(specularAngle), Math.sin(specularAngle)];
        const radiusSquared = radius * radius;
        const radiusPlusOneSquared = (radius + 1) * (radius + 1);
        const radiusMinusBezelSquared = Math.max(0, (radius - bezelWidth) * (radius - bezelWidth));
        const widthBetweenRadiuses = width - radius * 2;
        const heightBetweenRadiuses = height - radius * 2;
        for (let y1 = 0; y1 < height; y1++) {
          for (let x1 = 0; x1 < width; x1++) {
            const isOnLeftSide = x1 < radius;
            const isOnRightSide = x1 >= width - radius;
            const isOnTopSide = y1 < radius;
            const isOnBottomSide = y1 >= height - radius;
            const x = isOnLeftSide ? x1 - radius : isOnRightSide ? x1 - radius - widthBetweenRadiuses : 0;
            const y = isOnTopSide ? y1 - radius : isOnBottomSide ? y1 - radius - heightBetweenRadiuses : 0;
            const distanceToCenterSquared = x * x + y * y;
            const isInBezel =
              distanceToCenterSquared <= radiusPlusOneSquared &&
              distanceToCenterSquared >= radiusMinusBezelSquared;
            if (!isInBezel) continue;
            const distanceFromCenter = Math.sqrt(distanceToCenterSquared);
            const distanceFromSide = radius - distanceFromCenter;
            const opacity =
              distanceToCenterSquared < radiusSquared
                ? 1
                : 1 - (distanceFromCenter - Math.sqrt(radiusSquared)) /
                    (Math.sqrt(radiusPlusOneSquared) - Math.sqrt(radiusSquared));
            const cos = distanceFromCenter > 0 ? x / distanceFromCenter : 0;
            const sin = distanceFromCenter > 0 ? -y / distanceFromCenter : 0;
            const dotProduct = Math.abs(cos * specularVector[0] + sin * specularVector[1]);
            const coefficient =
              dotProduct * Math.sqrt(Math.max(0, 1 - Math.pow(1 - distanceFromSide / Math.max(bezelWidth, 1), 2)));
            const color = 255 * coefficient;
            const idx = (y1 * width + x1) * 4;
            data[idx] = color;
            data[idx + 1] = color;
            data[idx + 2] = color;
            data[idx + 3] = Math.min(255, color * coefficient * opacity);
          }
        }
        return imageData;
      }

      function imageDataToUrl(imageData) {
        const canvas = document.createElement("canvas");
        canvas.width = imageData.width;
        canvas.height = imageData.height;
        canvas.getContext("2d").putImageData(imageData, 0, 0);
        return canvas.toDataURL();
      }

      function attachGlass(host, glassEl, ids) {
        const disp = document.getElementById(ids.disp);
        const spec = document.getElementById(ids.spec);
        const dmap = document.getElementById(ids.dmap);
        const specA = document.getElementById(ids.specA);
        if (!host || !glassEl || !disp || !spec || !dmap) return () => {};

        let lastKey = "";
        let ticking = false;

        function updateGlass() {
          const width = Math.max(1, Math.round(host.offsetWidth));
          const height = Math.max(1, Math.round(host.offsetHeight));
          if (width < 8 || height < 8) return;
          const radius = Math.max(
            1,
            Math.min(parseFloat(getComputedStyle(host).borderTopLeftRadius) || 16, width / 2, height / 2)
          );
          const key = `${width}x${height}x${radius.toFixed(1)}`;
          if (key === lastKey) return;
          lastKey = key;

          const bezelWidth = Math.max(10, Math.min(radius - 1, Math.round(Math.min(width, height) * 0.3)));
          const glassThickness = 160;
          const refractiveIndex = 1.5;
          const refractionScale = 2.4;
          const precomputed = calculateDisplacementMap1D(glassThickness, bezelWidth, convexSquircle, refractiveIndex);
          const maximumDisplacement = Math.max(...precomputed.map(Math.abs), 1);
          const displacement = calculateDisplacementMap2D(width, height, radius, bezelWidth, maximumDisplacement, precomputed);
          const specular = calculateSpecularHighlight(width, height, radius, 2);
          const dispUrl = imageDataToUrl(displacement);
          const specUrl = imageDataToUrl(specular);

          disp.setAttribute("href", dispUrl);
          disp.setAttributeNS("http://www.w3.org/1999/xlink", "href", dispUrl);
          disp.setAttribute("x", "0");
          disp.setAttribute("y", "0");
          disp.setAttribute("width", String(width));
          disp.setAttribute("height", String(height));
          spec.setAttribute("href", specUrl);
          spec.setAttributeNS("http://www.w3.org/1999/xlink", "href", specUrl);
          spec.setAttribute("x", "0");
          spec.setAttribute("y", "0");
          spec.setAttribute("width", String(width));
          spec.setAttribute("height", String(height));
          dmap.setAttribute("scale", String(maximumDisplacement * refractionScale));
          if (specA) specA.setAttribute("slope", "0");
          glassEl.classList.add("is-liquid");
        }

        function scheduleUpdate() {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            ticking = false;
            lastKey = "";
            updateGlass();
          });
        }

        updateGlass();
        new ResizeObserver(scheduleUpdate).observe(host);
        host.addEventListener("transitionend", scheduleUpdate);
        host.addEventListener("liquid-glass-resize", scheduleUpdate);
        window.addEventListener("resize", scheduleUpdate);
        return scheduleUpdate;
      }

      attachGlass(form, form.querySelector(".gnb-glass"), {
        disp: "lg-disp",
        spec: "lg-spec",
        dmap: "lg-dmap",
        specA: "lg-spec-a",
      });

      const pbarHost = document.getElementById("pbar-in");
      const updatePbarGlass = attachGlass(pbarHost, document.querySelector(".pbar-glass"), {
        disp: "lgp-disp",
        spec: "lgp-spec",
        dmap: "lgp-dmap",
        specA: "lgp-spec-a",
      });
      if (pbarHost) pbarHost.updateLiquidGlass = updatePbarGlass;
    })();
  </script>
</body>
</html>

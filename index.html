<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 사내용 문서. 주소를 아는 사람만 보게 하고 검색엔진에는 안 걸리게 한다 -->
  <meta name="robots" content="noindex, nofollow" />
  <title>HIVELAB Design AI Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --white: #ffffff;
      --page: #111111;
      --panel: #1c1c1c;
      --item: #2a2a2a;
      --item-hover: #333333;
      --muted: rgba(255, 255, 255, 0.62);
      --line: rgba(255, 255, 255, 0.12);
      --pad: clamp(12px, 1.4vw, 20px);
      --header-h: 60px;
      --gnb-pad: 12px;
      --gnb-pad-x: 22px;
      --gnb-pad-right: 28px;
      --gnb-pad-bottom-open: 22px;
      --gnb-w: min(771px, calc(100% - 32px));
      --sidebar: clamp(200px, 22vw, 260px);
      --toc: 184px;
      --layout-max: 1280px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --cover: 0.78s var(--ease);
      --expand: 0.42s var(--ease);
      --fast: 0.22s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    * {
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    html, body, #app {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
      font-size: 13px;
      color: var(--white);
    }

    #app {
      position: relative;
      height: 100dvh;
    }

    .page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #page-01 { z-index: 1; }

    #page-03 {
      z-index: 2;
      background: var(--page);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(var(--pad) * 2 + var(--header-h)) var(--pad) var(--pad);
      transform: translate3d(0, 100%, 0);
      transition: transform var(--cover);
      pointer-events: none;
      will-change: transform;
    }

    #app.is-map #page-03 {
      transform: translate3d(0, 0, 0);
      pointer-events: auto;
    }

    .map-layout {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: var(--pad);
      width: min(100%, var(--layout-max));
      flex: 1;
      min-height: 0;
      min-width: 0;
    }

    .map-layout.has-toc {
      grid-template-columns: var(--sidebar) minmax(0, 1fr) var(--toc);
    }

    .hero,
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hero img {
      object-fit: cover;
      object-position: center 28%;
      pointer-events: none;
    }

    .hero-character { object-position: center 22%; }

    /* ===== SHARED GNB ===== */
    .gnb-layer {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    .gnb {
      --chips-h: 0px;
      pointer-events: auto;
      position: absolute;
      top: calc(100% - var(--header-h) - var(--chips-h) - 32px);
      bottom: auto;
      left: 50%;
      width: var(--gnb-w);
      height: auto;
      min-height: var(--header-h);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: var(--gnb-pad) var(--gnb-pad-right) var(--gnb-pad) var(--gnb-pad-x);
      gap: 0;
      border-radius: 16px;
      overflow: visible;
      transition:
        top var(--cover),
        left var(--cover),
        width var(--cover),
        transform var(--cover),
        border-radius var(--cover),
        padding var(--expand),
        gap var(--expand);
      will-change: top, left, width, transform;
    }

    .gnb.is-expanded {
      --chips-h: 42px;
      width: min(860px, calc(100% - 32px));
      min-height: 0;
      padding: var(--gnb-pad) var(--gnb-pad-right) var(--gnb-pad-bottom-open) var(--gnb-pad-x);
      gap: var(--gnb-pad);
      transition:
        top var(--expand),
        width var(--expand),
        padding var(--expand),
        gap var(--expand),
        left var(--cover),
        transform var(--cover),
        border-radius var(--cover);
    }

    #app.is-map .gnb,
    #app.is-map .gnb.is-expanded {
      --chips-h: 0px;
      top: var(--pad);
      bottom: auto;
      left: 50%;
      width: min(var(--layout-max), calc(100% - var(--pad) * 2));
      transform: translateX(-50%);
      border-radius: 12px;
      padding: var(--gnb-pad) var(--gnb-pad-x);
      gap: 0;
      transition:
        top var(--cover),
        left var(--cover),
        width var(--cover),
        transform var(--cover),
        border-radius var(--cover),
        padding var(--cover),
        gap var(--cover);
    }

    #liquid-glass-svg {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      pointer-events: none;
    }

    .gnb-glass {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background: rgba(0, 0, 0, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
    }

    .gnb-glass.is-liquid {
      backdrop-filter: url(#liquid-glass);
      -webkit-backdrop-filter: url(#liquid-glass);
    }

    .pbar-glass.gnb-glass.is-liquid {
      backdrop-filter: url(#liquid-glass-pbar);
      -webkit-backdrop-filter: url(#liquid-glass-pbar);
    }

    .gnb > *:not(.gnb-glass) { position: relative; z-index: 1; }

    .gnb-main {
      display: flex;
      align-items: center;
      min-height: 36px;
      padding: 0;
      gap: 12px;
      transition: min-height var(--expand), padding var(--expand);
    }

    .gnb.is-expanded .gnb-main {
      min-height: 36px;
      padding: 0;
    }

    .gnb .logo {
      width: 86px;
      height: 14px;
      flex: 0 0 86px;
      display: block;
      cursor: pointer;
    }

    .gnb .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      cursor: pointer;
    }

    .gnb-end {
      margin-left: auto;
      margin-right: calc(var(--gnb-pad-x) * -1);
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
      justify-content: flex-end;
      gap: 12px;
      transition: margin-right var(--cover);
    }

    #app.is-map .gnb-end {
      margin-right: 0;
    }

    .gnb-search {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      min-width: 0;
      flex: 1;
      opacity: 1;
      transition: opacity var(--cover);
    }

    #app.is-map .gnb-search {
      opacity: 0;
      pointer-events: none;
      width: 0;
      flex: 0;
      overflow: hidden;
    }

    .gnb-search input {
      min-width: 0;
      width: 100%;
      max-width: 280px;
      height: 36px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--white);
      font: inherit;
      font-size: 13px;
      text-align: right;
      caret-color: transparent;
      cursor: pointer;
      user-select: none;
    }

    .search-bar input::placeholder,
    .gnb-search input::placeholder { color: rgba(255, 255, 255, 0.65); }

    .go-btn {
      width: 32px;
      height: 32px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      flex: 0 0 32px;
      transition: transform var(--fast);
    }

    .go-btn:active {
      transform: scale(0.92);
    }

    .go-btn img {
      width: 32px;
      height: 32px;
      display: block;
    }

    .gnb-user {
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      max-width: 0;
      overflow: hidden;
      transition: opacity var(--cover) 0.08s, max-width var(--cover);
    }

    #app.is-map .gnb-user {
      opacity: 1;
      pointer-events: auto;
      max-width: 240px;
    }

    .gnb-user .role {
      font-size: 13px;
      white-space: nowrap;
    }

    .role-chips {
      display: grid;
      grid-template-rows: minmax(0, 0fr);
      overflow: hidden;
      transition: grid-template-rows var(--expand);
    }

    .gnb.is-expanded .role-chips {
      grid-template-rows: minmax(0, 1fr);
    }

    #app.is-map .role-chips {
      display: none;
    }

    .role-chips-inner {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-flow: row wrap;
      align-items: center;
      gap: 6px;
      padding: 0;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 2px 8px;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.02em;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color var(--fast), opacity var(--fast);
    }

    .role-chip:hover:not(:disabled) {
      background: #ebebeb;
    }

    .role-chip:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    /* ===== PAGE 03 ===== */
    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding-bottom: 40px;
    }

    .nav-block .cat {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      height: 20px;
      margin-bottom: 10px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      background: none;
      border: 0;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: color var(--fast);
    }

    .nav-row .icon {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      flex: 0 0 18px;
      object-fit: contain;
      display: block;
      opacity: 0.5;
      transition: opacity var(--fast);
    }

    .nav-row .chev {
      margin-left: auto;
      width: 16px;
      height: 16px;
      opacity: 0.75;
      transition: transform var(--expand), opacity var(--fast);
    }

    .nav-row.is-open .chev { transform: rotate(180deg); }

    .nav-row:hover,
    .nav-row.is-current {
      color: var(--white);
    }

    .nav-row:hover .icon,
    .nav-row.is-current .icon {
      opacity: 1;
    }

    .nav-row:hover .chev,
    .nav-row.is-current .chev {
      opacity: 1;
    }

    .nav-block.is-disabled .cat {
      color: rgba(255, 255, 255, 0.28);
      margin-bottom: 8px;
    }

    .nav-pending {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.28);
      pointer-events: none;
    }

    .side-note {
      flex: none;
      padding: 0 0 4px;
      background: var(--page);
      font-size: 12px;
      line-height: 1.65;
      color: var(--muted);
    }

    .nav-row:disabled,
    .nav-block.is-disabled .nav-row {
      color: rgba(255, 255, 255, 0.28);
      -webkit-text-fill-color: rgba(255, 255, 255, 0.28);
      cursor: not-allowed;
      opacity: 1;
    }

    .nav-block.is-disabled .nav-row .icon,
    .nav-block.is-disabled .nav-row .chev {
      opacity: 0.32;
    }

    .submenu {
      position: relative;
      margin: 0 0 0 19px;
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--expand), margin var(--expand);
    }

    .submenu.is-open {
      grid-template-rows: 1fr;
      margin: 4px 0 16px 19px;
    }

    .submenu-body {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .submenu::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--line);
    }

    .submenu-mark {
      position: absolute;
      left: -10px;
      top: 0;
      width: 1px;
      height: 34px;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: top var(--expand), height var(--expand), opacity var(--fast);
    }

    .sub-item {
      height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      font: inherit;
      font-size: 13px;
      text-align: left;
      padding: 0 12px;
      cursor: pointer;
      transition: color var(--fast), background-color var(--fast);
    }

    .sub-item:hover,
    .sub-item.is-active {
      background: var(--item-hover);
      color: var(--white);
    }

    .main-panel {
      border-radius: 12px;
      background: var(--panel);
      min-height: 0;
      min-width: 0;
      overflow: auto;
      scroll-behavior: smooth;
    }

    .main-panel.has-pbar .panel-content {
      padding-bottom: 96px;
    }

    .pbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      display: flex;
      justify-content: center;
      padding: 0 12px calc(16px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 12px, 0);
      visibility: hidden;
      transition: opacity var(--expand), transform var(--expand), visibility var(--expand);
    }

    #app.is-map .pbar:not([hidden]) {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      visibility: visible;
    }
    .pbar[hidden] {
      display: flex !important;
    }

    .pbar-in {
      pointer-events: none;
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: min(100%, 920px);
      padding: 12px 22px;
      border-radius: 16px;
      overflow: visible;
      background: none;
      border: 0;
    }

    #app.is-map .pbar:not([hidden]) .pbar-in {
      pointer-events: auto;
    }

    .pbar-in > *:not(.pbar-glass) { position: relative; z-index: 1; }

    .pbar-now {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--white);
      white-space: nowrap;
      letter-spacing: -0.01em;
      flex: none;
    }

    .pbar-now i {
      font-style: normal;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      margin-right: 6px;
      font-weight: 600;
    }

    .pbar-sep {
      width: 1px;
      height: 17px;
      background: rgba(255, 255, 255, 0.17);
      flex: none;
    }

    .pbar-steps {
      display: flex;
      align-items: center;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .pbar-steps::-webkit-scrollbar { display: none; }

    .pstep {
      flex: none;
      font: inherit;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      background: none;
      border: 0;
      border-radius: 999px;
      padding: 6px 8px;
      cursor: pointer;
      line-height: 1;
      white-space: nowrap;
      transition: color var(--fast), background-color var(--fast);
    }

    .pstep:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
    }

    .pstep.pd { color: rgba(255, 255, 255, 0.5); }
    .pstep.hm { color: var(--muted); }
    .pstep[data-on="1"] {
      background: #fff;
      color: #111;
      font-weight: 600;
    }
    .pstep.pd[data-on="1"],
    .pstep.hm[data-on="1"] {
      background: #fff;
      color: #111;
    }

    .pgap {
      flex: none;
      width: 1px;
      height: 13px;
      background: rgba(255, 255, 255, 0.17);
      margin: 0 4px;
    }

    .panel-content {
      --accent: #f5b7ff;
      --accent-wash: rgba(245, 183, 255, 0.11);
      --accent-ink: rgba(255, 255, 255, 0.86);
      --pending: #67c0ff;
      --pending-wash: rgba(103, 192, 255, 0.10);
      --human: #f2f2f2;
      --human-ink: #111;
      --ink: #ffffff;
      --ink-2: rgba(255, 255, 255, 0.80);
      --muted: rgba(255, 255, 255, 0.54);
      --faint: rgba(255, 255, 255, 0.62);
      --faint-pend: rgba(255, 255, 255, 0.34);
      --surface: var(--item);
      --surface-2: #333;
      padding: 28px 32px 64px;
      width: 100%;
      max-width: none;
      color: var(--ink);
      line-height: 1.65;
      animation: rise-in 0.4s var(--ease);
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translate3d(0, 8px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    .panel-content .eyebrow {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .panel-content h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }

    .panel-content .lede {
      margin-top: 12px;
      font-size: 15px;
      color: var(--ink-2);
    }

    .panel-content h2 {
      font-size: 18px;
      font-weight: 600;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      scroll-margin-top: 16px;
    }

    .panel-content h3 {
      font-size: 15px;
      font-weight: 600;
      margin-top: 24px;
      scroll-margin-top: 16px;
    }

    .page-toc {
      position: relative;
      z-index: 26;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 28px 0 24px 4px;
      align-self: stretch;
      pointer-events: auto;
    }

    .page-toc[hidden] {
      display: none;
    }

    .toc-title {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .toc-list {
      position: relative;
      display: flex;
      flex-direction: column;
      padding-top: 6px;
    }

    .toc-link {
      position: relative;
      display: block;
      width: 100%;
      padding: 6px 0 6px 14px;
      border: 0;
      background: none;
      color: rgba(255, 255, 255, 0.62);
      font: inherit;
      font-size: 12px;
      line-height: 1.45;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      word-break: keep-all;
      transition: color var(--fast);
    }

    .toc-link.is-first { padding-top: 0; }
    .toc-link.is-last { padding-bottom: 0; }

    .toc-link.is-h3 {
      padding-left: 26px;
      color: rgba(255, 255, 255, 0.5);
    }

    .toc-rail {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 1px;
      background: var(--line);
      pointer-events: none;
    }

    .toc-link.is-h3 .toc-rail {
      left: 10px;
    }

    .toc-link.bend-in .toc-rail {
      top: 6px;
    }

    .toc-link.bend-out .toc-rail {
      bottom: 6px;
    }

    .toc-elbow {
      position: absolute;
      top: -6px;
      left: 0;
      width: 16px;
      height: 16px;
      overflow: visible;
      pointer-events: none;
    }

    .toc-elbow line {
      stroke: var(--line);
      stroke-width: 1;
    }

    .toc-link:hover,
    .toc-link.is-active {
      color: var(--white);
    }

    .toc-link.is-active .toc-rail {
      background: var(--white);
    }

    .toc-link.is-active .toc-elbow line {
      stroke: var(--white);
    }

    .panel-content h4 {
      font-size: 13px;
      font-weight: 600;
      margin-top: 18px;
      color: var(--faint);
    }

    .panel-content p {
      margin-top: 12px;
      color: var(--ink-2);
    }

    .panel-content p.tight { margin-top: 8px; }

    .panel-content strong { color: var(--ink); font-weight: 600; }

    .panel-content ul,
    .panel-content ol {
      margin: 12px 0 0;
      padding-left: 20px;
      color: var(--ink-2);
    }

    .panel-content li { margin-top: 6px; }

    .panel-content a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .panel-content h2 code {
      background: var(--accent-wash);
      color: var(--accent);
      vertical-align: middle;
    }

    .panel-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
      background: var(--item);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--white);
    }

    .panel-content .note {
      margin-top: 18px;
      padding: 14px 16px;
      background: var(--item);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .panel-content .note.warn {
      background: var(--accent-wash);
      border-color: rgba(245, 183, 255, 0.30);
    }

    .panel-content .note.pend {
      background: var(--pending-wash);
      border-color: rgba(103, 192, 255, 0.18);
    }

    .panel-content .note p { margin-top: 0; }
    .panel-content .note p + p { margin-top: 8px; }
    .panel-content .note-t {
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .panel-content .note.warn .note-t { color: var(--accent); }
    .panel-content .note.pend .note-t { color: var(--pending); }

    .panel-content .tblwrap {
      overflow-x: auto;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--item);
    }

    .panel-content table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      min-width: 480px;
    }

    .panel-content th {
      text-align: left;
      font-weight: 600;
      color: var(--faint);
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .panel-content td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--ink-2);
      vertical-align: top;
    }

    .panel-content tr:last-child td { border-bottom: 0; }
    .panel-content td.k { color: var(--accent); white-space: nowrap; }

    .panel-content pre {
      margin-top: 16px;
      background: var(--item);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.7;
      color: var(--ink-2);
      white-space: pre-wrap;
    }

    .panel-content pre code {
      background: none;
      padding: 0;
      font-size: inherit;
    }

    .panel-content .map {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 22px;
      align-items: start;
    }

    .panel-content .col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-content .col-h {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .panel-content .stage {
      display: block;
      width: 100%;
      text-align: left;
      font: inherit;
      cursor: pointer;
      background: var(--item);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 13px;
      color: inherit;
    }

    .panel-content .stage .no {
      font-size: 11px;
      color: var(--accent);
    }

    .panel-content .stage .nm {
      font-size: 13px;
      font-weight: 600;
      color: var(--white);
      margin-top: 3px;
    }

    .panel-content .stage .sk {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .panel-content .stage.pend {
      background: var(--pending-wash);
      border-style: dashed;
      border-color: rgba(103, 192, 255, 0.4);
    }
    .panel-content .stage.pend .no,
    .panel-content .stage.pend .sk { color: var(--pending); }
    .panel-content .stage.human {
      background: var(--human);
      border-color: var(--human);
    }
    .panel-content .stage.human .no,
    .panel-content .stage.human .sk { color: var(--human-ink); opacity: 0.62; }
    .panel-content .stage.human .nm { color: var(--human-ink); }
    .panel-content .stage.gate {
      background: var(--accent-wash);
      border-color: rgba(245, 183, 255, 0.45);
    }

    .panel-content .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }

    .panel-content .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-content .sw {
      width: 18px;
      height: 3px;
      border-radius: 2px;
      flex: none;
    }

    .panel-content .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .panel-content .card {
      background: var(--item);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 15px;
      cursor: pointer;
    }

    .panel-content .card.pend {
      background: var(--pending-wash);
      border-style: dashed;
      border-color: rgba(103, 192, 255, 0.4);
    }
    .panel-content .card .cmd {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }
    .panel-content .card.pend .cmd { color: var(--pending); }
    .panel-content .card .cd {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.55;
    }
    .panel-content .card .cf {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .panel-content .ckgrp { margin-top: 20px; }
    .panel-content .ckgrp h3 { margin-top: 22px; }
    .panel-content .ckgrp h3:first-child { margin-top: 0; }

    .panel-content .mx {
      display: grid;
      grid-template-columns: 72px 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .panel-content .mx > div {
      padding: 12px 13px;
      border-radius: 8px;
      font-size: 13px;
    }

    .panel-content .mx .hd {
      font-size: 11px;
      color: var(--muted);
      background: none;
      padding: 6px 13px;
      display: flex;
      align-items: flex-end;
    }

    .panel-content .mx .rw {
      font-size: 12px;
      font-weight: 600;
      color: var(--white);
      background: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 12px 0 12px 2px;
      line-height: 1.3;
    }

    .panel-content .mx .rw em {
      font-style: normal;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 4px;
    }

    .panel-content .mx .cl {
      background: var(--item);
      border: 1px solid var(--line);
      color: var(--ink-2);
    }

    .panel-content .mx .cl b {
      display: block;
      font-size: 14px;
      color: var(--white);
    }

    .panel-content .mx .cl em {
      display: block;
      font-style: normal;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .panel-content .jump {
      font: inherit;
      font-size: 12px;
      color: var(--accent);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: opacity var(--fast);
    }

    .panel-content .jump:hover {
      opacity: 0.72;
    }

    .panel-content .copy {
      display: inline-flex;
      align-items: center;
      font: inherit;
      font-size: 12px;
      background: var(--item);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      transition: color var(--fast), background-color var(--fast);
    }

    .panel-content .copy:hover {
      color: var(--white);
    }

    .panel-content .sk-detail {
      margin-top: 14px;
      padding: 18px 20px;
      background: var(--item);
      border: 1px solid var(--line);
      border-radius: 10px;
      scroll-margin-top: 16px;
    }

    .panel-content .sk-detail.pend {
      background: var(--pending-wash);
      border-style: dashed;
      border-color: rgba(103, 192, 255, 0.4);
    }
    .panel-content .sk-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 12px;
    }

    /* 스킬별 상세 · 기본은 접힌 상태 */
    .panel-content summary.sk-head {
      cursor: pointer;
      list-style: none;
      user-select: none;
      margin: -18px -20px;
      padding: 18px 20px;
      border-radius: 10px;
    }
    .panel-content summary.sk-head::-webkit-details-marker { display: none; }
    .panel-content summary.sk-head:hover { background: rgba(255, 255, 255, 0.04); }
    .panel-content summary.sk-head::after {
      content: "";
      margin-left: auto;
      align-self: center;
      flex: none;
      width: 16px;
      height: 16px;
      background: currentColor;
      color: var(--muted);
      opacity: 0.75;
      -webkit-mask: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27 fill=%27none%27%3E%3Cpath d=%27M5 7.5 10 12.5 15 7.5%27 stroke=%27black%27 stroke-width=%271.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center / 16px 16px no-repeat;
      mask: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27 fill=%27none%27%3E%3Cpath d=%27M5 7.5 10 12.5 15 7.5%27 stroke=%27black%27 stroke-width=%271.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center / 16px 16px no-repeat;
      transition: transform var(--expand), opacity var(--fast);
    }
    .panel-content summary.sk-head:hover::after { opacity: 1; }
    .panel-content .sk-fold[open] > summary.sk-head::after { transform: rotate(180deg); opacity: 1; }
    .panel-content .sk-fold[open] > summary.sk-head {
      margin-bottom: 0;
      border-radius: 10px 10px 0 0;
    }
    .panel-content .sk-cmd {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
    }
    .panel-content .sk-detail.pend .sk-cmd { color: var(--pending); }
    .panel-content .sk-stage {
      font-size: 12px;
      color: var(--faint);
    }
    .panel-content .sk-io {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }
    .panel-content .sk-io > div {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      font-size: 13px;
      color: var(--ink-2);
    }
    .panel-content .sk-io.pd > div,
    .panel-content .sk-detail.pend .sk-io > div {
      background: rgba(103, 192, 255, 0.06);
    }
    .panel-content .sk-io b { color: var(--faint); font-weight: 600; }

    /* 준비 중(10월 31일) 영역은 희미하게 그대로 둔다 */
    .panel-content .sk-detail.pend .sk-stage,
    .panel-content .pend h4,
    .panel-content .pend th,
    .panel-content .pend .sk-io b,
    .panel-content .fold h4,
    .panel-content .fold th,
    .panel-content .fold .sk-io b {
      color: var(--faint-pend);
    }
    .panel-content .sk-flag {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--accent-wash);
      border: 1px solid transparent;
      color: var(--ink-2);
    }
    .panel-content .sk-detail.pend .sk-flag {
      background: rgba(255, 255, 255, 0.05);
    }
    .panel-content .foot {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .page-toc { display: none; }
      .map-layout.has-toc {
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
      }
    }

    @media (max-width: 900px) {
      :root { --sidebar: 200px; }
      .gnb-main { gap: 8px; }
      .gnb .logo { width: 72px; height: 12px; flex-basis: 72px; }
      .gnb-user .role { font-size: 13px; }
      .panel-content { padding: 22px 18px 48px; }
      .panel-content .map { grid-template-columns: 1fr; }
      .panel-content .mx { grid-template-columns: 1fr; }
      .panel-content .mx .hd { display: none; }
      .panel-content h1 { font-size: 24px; }
    }

    @media (max-width: 640px) {
      .map-layout,
      .map-layout.has-toc { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .pbar-now, .pbar-sep { display: none; }
      .pbar-in { padding: 10px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --cover: 0.01s linear;
        --expand: 0.01s linear;
        --fast: 0.01s linear;
      }
      .panel-content { animation: none; }
    }
    /* 10월 31일 제출 영역 · 접어둠 */
    .fold {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      margin: 20px 0 28px;
      overflow: hidden;
    }
    .fold > summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      user-select: none;
    }
    .fold > summary::-webkit-details-marker { display: none; }
    .fold > summary:hover { background: var(--item-hover); }
    .fold > summary .fold-tag {
      flex: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
    }
    .fold > summary::after {
      content: "";
      margin-left: auto;
      align-self: center;
      flex: none;
      width: 16px;
      height: 16px;
      background: currentColor;
      opacity: 0.75;
      -webkit-mask: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27 fill=%27none%27%3E%3Cpath d=%27M5 7.5 10 12.5 15 7.5%27 stroke=%27black%27 stroke-width=%271.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center / 16px 16px no-repeat;
      mask: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27 fill=%27none%27%3E%3Cpath d=%27M5 7.5 10 12.5 15 7.5%27 stroke=%27black%27 stroke-width=%271.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center / 16px 16px no-repeat;
      transition: transform var(--expand), opacity var(--fast);
    }
    .fold > summary:hover::after { opacity: 1; }
    .fold[open] > summary::after { transform: rotate(180deg); opacity: 1; }
    .fold[open] > summary { border-bottom: 1px solid var(--line); }
    .fold-body { padding: 4px 18px 18px; }
    .fold-body > h2:first-child,
    .fold-body > h3:first-child,
    .fold-body > h4:first-child { margin-top: 14px; }
  </style>
</head>
<body>
  <svg id="liquid-glass-svg" aria-hidden="true" focusable="false">
    <defs>
      <filter id="liquid-glass" x="-12%" y="-30%" width="124%" height="160%" color-interpolation-filters="sRGB">
        <feColorMatrix in="SourceGraphic" type="matrix" values="0.86 0 0 0 -0.26  0 0.86 0 0 -0.26  0 0 0.86 0 -0.26  0 0 0 1 0" result="tinted" />
        <feGaussianBlur id="lg-blur" in="tinted" stdDeviation="0.6" result="blurred" />
        <feImage id="lg-disp" result="displacement_map" preserveAspectRatio="none" />
        <feDisplacementMap id="lg-dmap" in="blurred" in2="displacement_map" scale="40" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        <feColorMatrix in="displaced" type="saturate" values="2.2" result="displaced_sat" />
        <feImage id="lg-spec" result="specular_layer" preserveAspectRatio="none" />
        <feComponentTransfer in="specular_layer" result="specular_faded">
          <feFuncA id="lg-spec-a" type="linear" slope="0" />
        </feComponentTransfer>
        <feBlend in="specular_faded" in2="displaced_sat" mode="screen" />
      </filter>
      <filter id="liquid-glass-pbar" x="-12%" y="-30%" width="124%" height="160%" color-interpolation-filters="sRGB">
        <feColorMatrix in="SourceGraphic" type="matrix" values="0.86 0 0 0 -0.26  0 0.86 0 0 -0.26  0 0 0.86 0 -0.26  0 0 0 1 0" result="tinted" />
        <feGaussianBlur in="tinted" stdDeviation="0.6" result="blurred" />
        <feImage id="lgp-disp" result="displacement_map" preserveAspectRatio="none" />
        <feDisplacementMap id="lgp-dmap" in="blurred" in2="displacement_map" scale="40" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        <feColorMatrix in="displaced" type="saturate" values="2.2" result="displaced_sat" />
        <feImage id="lgp-spec" result="specular_layer" preserveAspectRatio="none" />
        <feComponentTransfer in="specular_layer" result="specular_faded">
          <feFuncA id="lgp-spec-a" type="linear" slope="0" />
        </feComponentTransfer>
        <feBlend in="specular_faded" in2="displaced_sat" mode="screen" />
      </filter>
    </defs>
  </svg>

  <div id="app">
    <section class="page" id="page-01" aria-label="메인">
      <div class="hero">
        <img class="hero-bg" src="assets/bg-01.png" alt="" />
        <img class="hero-character" src="assets/character-01.png" alt="" />
      </div>
    </section>

    <section class="page" id="page-03" aria-label="Design AI Map">
      <div class="map-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-panel" id="main-panel"></div>
        <nav class="page-toc" id="page-toc" hidden aria-label="이 페이지 목차"></nav>
      </div>
    </section>

    <div class="gnb-layer">
      <form class="gnb" id="gnb" autocomplete="off">
        <div class="gnb-glass"></div>
        <div class="gnb-main">
          <img class="logo" src="assets/logo.svg" alt="HIVELAB" id="gnb-logo" />
          <span class="brand" id="gnb-brand">Design AI Map</span>
          <div class="gnb-end">
            <div class="gnb-search">
              <input id="job-input" type="text" readonly placeholder="자신이 속한 직군을 선택해주세요" />
              <button class="go-btn" type="submit" aria-label="직군 선택">
                <img src="assets/go-icon.png" alt="" width="32" height="32" />
              </button>
            </div>
            <div class="gnb-user">
              <span class="role" id="role-label">UI 디자이너</span>
              <button class="go-btn" type="button" id="gnb-home-btn" aria-label="홈으로">
                <img src="assets/go-icon.png" alt="" width="32" height="32" />
              </button>
            </div>
          </div>

        <div class="role-chips" id="role-chips">
          <div class="role-chips-inner" id="role-chips-inner"></div>

    <div class="pbar" id="pbar" hidden>
      <div class="pbar-in" id="pbar-in">
        <div class="gnb-glass pbar-glass"></div>
        <div class="pbar-now" id="pnow"></div>
        <div class="pbar-sep"></div>
        <div class="pbar-steps" id="psteps"></div>
      </div>
    </div>

  <!-- 가이드 본문 · 원래 guide-content.js 였던 것을 index.html 안으로 합침 (2026-09-18)
       이제 이 파일 하나만 배포하면 됩니다. 내용을 고칠 땐 아래 GUIDE_PAGES 를 고치세요. -->
  <script>
window.GUIDE_PAGES = {"setup":"<div class=\"eyebrow\">INSTALL</div>\n  <h1>설치하기</h1>\n  <p class=\"lede\">Claude Code를 열고 저장소를 받는 것까지입니다. 10분이면 끝나고, 한 번만 하면 됩니다.</p>\n\n  <h2>준비물</h2>\n  <div class=\"tblwrap\"><table>\n    <tr><th>무엇</th><th>왜 필요한가</th></tr>\n    <tr><td class=\"k\">Claude 데스크톱 앱</td><td>스킬을 실행하는 도구입니다</td></tr>\n    <tr><td class=\"k\">GitHub 계정</td><td>받기만 할 거면 없어도 됩니다. 문서를 고쳐서 올릴 때만 필요해요</td></tr>\n  </table></div>\n  <p>연결이 필요한 도구가 둘 더 있는데, 둘 다 나중에 쓰니까 따로 다룹니다. <a href=\"#\" data-go=\"figma\">Figma 연결</a>은 시안(2-1)에서, <a href=\"#\" data-go=\"hf\">힉스필드 연결</a>은 에셋(2-2)에서 씁니다. <strong>먼저 여기부터 끝내세요.</strong></p>\n  <p>디자인 도구를 새로 배우는 게 아닙니다. Figma는 쓰던 대로 쓰고, Claude가 옆에서 문서를 읽고 시안을 옮겨주는 구조입니다.</p>\n\n  <h2>1 · Claude Code 열기</h2>\n  <p>Claude 데스크톱 앱을 설치하고 <strong>Code 탭</strong>을 엽니다. 브라우저로 쓰려면 <code>claude.ai/code</code>로 들어가도 됩니다.</p>\n  <p>여기서 말하는 Claude Code는 채팅창이 아니라 <strong>내 컴퓨터의 폴더를 열어서 파일을 읽고 쓰는 모드</strong>입니다. 이게 있어야 스킬이 돌아갑니다.</p>\n\n  <h2>2 · 저장소 받기</h2>\n  <p><strong>저장소는 공개입니다.</strong> 로그인도 초대도 필요 없어요. 아래 주소로 바로 들어가서 받으면 됩니다.</p>\n  <pre id=\"repo-url\"><code>https://github.com/gigjoonang/hivelab-ai-process</code></pre>\n  <button class=\"copy\" data-copy=\"repo-url\">주소 복사</button>\n  <h3>받는 방법 두 가지</h3>\n  <p class=\"tight\"><strong>ZIP으로 받기</strong>: 저장소 페이지에서 초록색 <code>Code</code> 버튼 ▸ <code>Download ZIP</code>. 압축을 풀면 끝입니다.</p>\n  <p class=\"tight\"><strong>git으로 받기</strong>: 터미널이 익숙하면 이쪽이 낫습니다. 나중에 문서가 바뀌면 <code>git pull</code> 한 번으로 최신으로 맞출 수 있습니다.</p>\n  <pre id=\"clone-cmd\"><code>git clone https://github.com/gigjoonang/hivelab-ai-process.git\ncd hivelab-ai-process</code></pre>\n  <button class=\"copy\" data-copy=\"clone-cmd\">명령 복사</button>\n  <div class=\"note warn\"><p>저장소가 공개라 <strong><code>projects/</code> 폴더는 절대 올리지 않습니다.</strong> 고객사 기획서와 시안이 들어가는 곳이에요. <code>.gitignore</code>에 이미 걸려 있지만, 커밋 전에 <code>git status</code>로 한 번 더 보세요.</p></div>\n  <div class=\"note\"><p>폴더는 어디에 둬도 됩니다. 다만 <strong>경로에 한글이나 공백이 없는 곳</strong>을 권합니다. <code>~/work/hivelab-ai-process</code> 정도가 무난합니다.</p></div>\n\n  <h2>3 · 폴더 열고 확인하기</h2>\n  <p>Claude Code에서 방금 받은 폴더를 엽니다. 열면 <code>CLAUDE.md</code>를 자동으로 읽어서 이 프로세스의 규칙이 적용됩니다. 따로 설정할 건 없습니다.</p>\n  <h3>제대로 됐는지 확인</h3>\n  <p class=\"tight\">입력창에 <code>/</code> 를 쳐보세요. 아래 아홉 개가 목록에 보이면 성공입니다.</p>\n  <pre><code>/ui-intake     /ui-analyze    /ui-structure\n/ui-style      /ui-tokens     /ui-draft\n/ui-assets     /ui-review     /ui-handoff</code></pre>\n  <div class=\"note warn\">\n    <div class=\"note-t\">안 보이면</div>\n    <p>폴더를 한 단계 위나 아래로 잘못 연 경우가 대부분입니다. 연 폴더 바로 안에 <code>CLAUDE.md</code>와 <code>.claude</code> 폴더가 같이 보여야 합니다. <code>.claude</code>는 점으로 시작해서 Finder에서 숨겨져 있을 수 있습니다.</p>\n  </div>\n\n  <h2>4 · 첫 프로젝트 돌려보기</h2>\n  <p>여기까지 됐으면 실제로 한 번 돌려보세요. 끝난 프로젝트의 기획서로 해보는 게 제일 빠릅니다. 결과를 아는 상태에서 보면 스킬이 뭘 잘하고 뭘 못하는지 바로 보입니다.</p>\n  <pre id=\"first-run\"><code># 1. 프로젝트 폴더 만들기\n./bin/new-project.sh 고객사명-프로젝트명\n\n# 2. 기획 문서를 넣기\n#    projects/고객사명-프로젝트명/source/ 안에\n#    PDF든 워드든 PPT든 상관없습니다\n\n# 3. Claude Code에서 실행\n/ui-intake</code></pre>\n  <button class=\"copy\" data-copy=\"first-run\">복사</button>\n  <p>이후로는 각 스킬이 끝날 때마다 다음 단계를 먼저 물어봅니다. 동의하면 이어서 진행합니다. 전체 순서는 <a href=\"#\" data-go=\"home\">시작하기</a>에 있습니다.</p>\n  <div class=\"note warn\"><p>처음 돌릴 때는 <strong>1-4 방향 확정</strong>에서 한 번 멈춥니다. 고장난 게 아니라 사람이 골라야 하는 지점입니다. 구조 하나, 스타일 하나를 고르면 이어서 갑니다.</p></div>\n  <p><code>/ui-draft</code>로 시안을 Figma에 옮기려면 연결이 하나 더 필요합니다. → <a href=\"#\" data-go=\"figma\">Figma 연결</a></p>\n\n  <h2>파일별 쓰임새</h2>\n  <p>폴더를 열면 파일이 많아 보이는데, 처음부터 다 읽을 필요 없습니다. 필요할 때 여는 것만 표시했습니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>파일</th><th>언제 여나</th></tr>\n    <tr><td class=\"k\">README.md</td><td>제일 먼저. 저장소가 뭔지와 시작 방법</td></tr>\n    <tr><td class=\"k\">WORKFLOW.md</td><td>지금 내가 어느 단계인지 확인할 때. 제일 자주 봅니다</td></tr>\n    <tr><td class=\"k\">CLAUDE.md</td><td>사람이 읽는 문서가 아닙니다. Claude가 자동으로 읽는 규칙</td></tr>\n    <tr><td class=\"k\">docs/00-principles.md</td><td>A급/B급이 뭔지, 저작권·보안 기준이 궁금할 때</td></tr>\n    <tr><td class=\"k\">docs/01~03-stage-*.md</td><td>그 단계를 실제로 할 때. 스킬이 알아서 읽습니다</td></tr>\n    <tr><td class=\"k\">docs/quality-bar.md</td><td>시안이 나갈 만한지 판단할 때</td></tr>\n    <tr><td class=\"k\">docs/reference-rules.md</td><td>레퍼런스를 어디서 몇 장 모으는지</td></tr>\n    <tr><td class=\"k\">templates/</td><td>직접 열지 않습니다. 프로젝트 만들 때 자동으로 복사됩니다</td></tr>\n    <tr><td class=\"k\">projects/</td><td>내 작업물이 쌓이는 곳. 고객사 자료가 들어갑니다</td></tr>\n    <tr><td class=\"k\">.claude/skills/</td><td>스킬 본체. 고칠 일 있을 때만 엽니다</td></tr>\n  </table></div>\n  <div class=\"note warn\"><p><code>projects/</code> 폴더에는 고객사 기획서와 브랜드 자산이 들어갑니다. <strong>GitHub에 올라가지 않도록 이미 막아뒀습니다.</strong> 이 폴더를 통째로 다른 곳에 복사하거나 공유할 때는 한 번 더 확인하세요.</p></div>\n\n  <h2>문제 해결</h2>\n  <div class=\"tblwrap\"><table>\n    <tr><th>증상</th><th>보통 이 이유입니다</th></tr>\n    <tr><td>스킬 목록에 <code>/ui-*</code>가 안 보인다</td><td>폴더를 잘못 열었습니다. <code>CLAUDE.md</code>가 보이는 위치인지 확인하세요</td></tr>\n    <tr><td>\"앞 단계 파일이 비었다\"며 멈춘다</td><td>고장이 아닙니다. 순서를 건너뛴 겁니다. 안내하는 스킬부터 돌리세요</td></tr>\n    <tr><td>Figma 관련 문제</td><td><a href=\"#\" data-go=\"figma\">Figma 연결</a>의 안 될 때 항목을 보세요</td></tr>\n    <tr><td>문서랑 이 사이트 내용이 다르다</td><td><strong>문서가 맞습니다.</strong> 이 사이트는 문서를 옮겨둔 것입니다</td></tr>\n  </table></div>\n  <p>그 외에는 Claude에게 그냥 물어보세요. 이 폴더를 열어둔 상태면 문서를 읽고 답합니다.</p>\n\n  <h2>문서 고치기</h2>\n  <p>기준이 현실과 안 맞으면 고쳐야 합니다. 다만 두 가지만 지켜주세요.</p>\n  <ul>\n    <li><strong>어떤 프로젝트에서 무슨 문제가 있었는지 근거를 남깁니다.</strong> 근거 없이 바뀐 기준은 다음 사람이 또 바꿉니다</li>\n    <li><strong>기준은 문서 한 곳에만 둡니다.</strong> 스킬 파일로 복사하지 마세요. 복사본은 원본보다 먼저 낡습니다</li>\n  </ul>\n  <p>고쳤으면 <code>git push</code>로 올리고 팀에 알려주세요. git이 익숙하지 않으면 담당자에게 어디를 어떻게 고쳤는지 전달해도 됩니다.</p>","figma":"<div class=\"eyebrow\">INSTALL</div>\n  <h1>Figma 연결</h1>\n  <p class=\"lede\">Claude가 Figma 파일에 직접 프레임과 컴포넌트를 그릴 수 있게 잇는 설정입니다. <code>/ui-draft</code>로 B급 시안을 옮길 때만 필요하고, 나머지 스킬 여덟 개는 연결 없이도 다 돌아갑니다.</p>\n  <div class=\"note\"><p><a href=\"#\" data-go=\"setup\">설치하기</a>를 먼저 끝내고 오세요. 저장소를 받아둔 상태라고 보고 설명합니다.</p></div>\n\n  <h2>빠른 설치</h2>\n  <p>터미널이 익숙하면 이 네 줄이면 됩니다. 처음이면 아래 <strong>설치</strong> 항목을 그대로 따라가세요.</p>\n  <pre id=\"fq\"><code>curl -fsSL https://bun.sh/install | bash\n\ngit clone https://github.com/grab/cursor-talk-to-figma-mcp.git\ncd cursor-talk-to-figma-mcp && bun install && bun socket</code></pre>\n  <button class=\"copy\" data-copy=\"fq\">복사</button>\n  <p class=\"tight\">여기에 더해 <strong>MCP 서버 등록</strong>과 <strong>Figma 플러그인 추가</strong>가 각각 한 번씩 필요합니다.</p>\n\n  <h2>연결 구조</h2>\n  <p>설정이 네 조각이라 처음엔 복잡해 보이는데, 각각이 뭘 하는지 알면 문제 생겼을 때 어디를 볼지 바로 압니다.</p>\n  <pre><code>Claude  ──①──▶  TalkToFigma MCP  ──②──▶  연결 서버  ──③──▶  Figma 플러그인\n                                        (localhost:3055)\n\n①  MCP 서버 등록      Claude가 Figma 관련 명령을 쓸 수 있게 됩니다\n②  Bun               MCP 서버와 연결 서버를 돌리는 런타임입니다\n③  Figma 플러그인      실제로 화면을 그리는 쪽. Figma 안에서 돕니다</code></pre>\n  <p>①은 Claude 설정 파일, ②는 터미널, ③은 Figma 앱. 세 군데를 건드립니다.</p>\n\n  <h2>설치</h2>\n\n  <h3>a. Bun 설치</h3>\n  <p class=\"tight\">MCP 서버와 연결 서버를 돌리는 런타임입니다. 이미 있으면 건너뛰세요.</p>\n  <pre id=\"f-bun\"><code>curl -fsSL https://bun.sh/install | bash</code></pre>\n  <button class=\"copy\" data-copy=\"f-bun\">명령 복사</button>\n  <p class=\"tight\">설치 후 터미널을 새로 열고 <code>bun --version</code>으로 확인합니다.</p>\n\n  <h3>b. MCP 서버 등록</h3>\n  <p class=\"tight\">Claude 설정 파일에 아래 블록을 넣습니다. 파일 위치는 이렇습니다.</p>\n  <pre><code>~/Library/Application Support/Claude/claude_desktop_config.json</code></pre>\n  <pre id=\"f-mcp\"><code>{\n  \"mcpServers\": {\n    \"TalkToFigma\": {\n      \"command\": \"bunx\",\n      \"args\": [\"cursor-talk-to-figma-mcp@latest\"]\n    }\n  }\n}</code></pre>\n  <button class=\"copy\" data-copy=\"f-mcp\">설정 복사</button>\n  <div class=\"note\"><p>이미 <code>mcpServers</code> 항목이 있으면 <strong>그 안에 <code>TalkToFigma</code>만 추가</strong>하세요. 통째로 덮어쓰면 쓰던 다른 MCP가 사라집니다. 넣고 나서 Claude를 껐다 켭니다.</p></div>\n\n  <h3>c. 연결 서버 받아서 실행</h3>\n  <p class=\"tight\">Claude와 Figma 플러그인 사이에서 메시지를 주고받는 작은 서버입니다. <strong>Figma로 작업하는 동안 계속 켜둬야 합니다.</strong></p>\n  <pre id=\"f-sock\"><code>git clone https://github.com/grab/cursor-talk-to-figma-mcp.git\ncd cursor-talk-to-figma-mcp\nbun install\nbun socket</code></pre>\n  <button class=\"copy\" data-copy=\"f-sock\">명령 복사</button>\n  <p class=\"tight\">터미널에 포트 <code>3055</code>로 떴다는 메시지가 나오면 됩니다. <strong>이 창은 닫지 마세요.</strong> 닫으면 연결이 끊깁니다.</p>\n\n  <h3>d. Figma 플러그인 추가</h3>\n  <p class=\"tight\">Figma <strong>데스크톱 앱</strong>에서만 됩니다. 브라우저 버전에서는 안 됩니다.</p>\n  <pre><code>Plugins ▸ Development ▸ Import plugin from manifest…</code></pre>\n  <p class=\"tight\">방금 받은 폴더에서 아래 파일을 고릅니다.</p>\n  <pre><code>cursor-talk-to-figma-mcp/src/cursor_mcp_plugin/manifest.json</code></pre>\n  <p class=\"tight\">플러그인 이름은 <strong>Cursor MCP Plugin</strong>으로 뜹니다. 이름에 Cursor가 붙어 있지만 Claude에서도 그대로 씁니다.</p>\n\n  <h2>연결하기</h2>\n  <p>설치가 끝나면 이후로는 매번 이 다섯 단계만 하면 됩니다.</p>\n  <ol>\n    <li>터미널에서 연결 서버가 켜져 있는지 확인합니다: <code>bun socket</code></li>\n    <li>Figma에서 시안을 넣을 파일을 엽니다</li>\n    <li><code>Plugins</code> ▸ <code>Development</code> ▸ <code>Cursor MCP Plugin</code> 실행</li>\n    <li>플러그인 창에 <strong>채널 이름</strong>이 뜹니다. 여덟 자리쯤 되는 문자열입니다</li>\n    <li>Claude에 그대로 말합니다</li>\n  </ol>\n  <pre id=\"f-join\"><code>1825bhra 피그마 채널에 연결해줘</code></pre>\n  <button class=\"copy\" data-copy=\"f-join\">문장 복사</button>\n  <p>연결되면 Claude가 현재 열린 파일의 페이지와 프레임 목록을 읽어서 알려줍니다. 거기까지 나오면 <code>/ui-draft</code>를 쓸 수 있습니다.</p>\n  <div class=\"note\"><p><strong>채널 이름은 플러그인을 다시 열 때마다 바뀝니다.</strong> 어제 쓰던 이름을 그대로 쓰면 연결되지 않습니다. 매번 플러그인 창에서 확인하세요.</p></div>\n\n  <h2>연결하면 할 수 있는 일</h2>\n  <p>Claude가 쓸 수 있게 되는 기능입니다. 직접 외울 필요는 없고, <code>/ui-draft</code>가 알아서 씁니다. 다만 <strong>여기 없는 건 안 된다</strong>는 것만 알아두면 기대치가 맞습니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>구분</th><th>할 수 있는 것</th></tr>\n    <tr><td class=\"k\">읽기</td><td>문서·페이지 구조 파악, 선택한 레이어 정보, 기존 컴포넌트와 텍스트 스타일 목록, 텍스트 전체 스캔</td></tr>\n    <tr><td class=\"k\">만들기</td><td>프레임, 사각형, 텍스트, 기존 컴포넌트의 인스턴스 배치</td></tr>\n    <tr><td class=\"k\">꾸미기</td><td>채우기 색, 선 색, 모서리 반경, 텍스트 내용 일괄 변경</td></tr>\n    <tr><td class=\"k\">정렬</td><td>오토레이아웃 적용, 항목 간격, 패딩, 정렬 기준, 크기 조절 방식</td></tr>\n    <tr><td class=\"k\">편집</td><td>이동, 크기 변경, 복제, 삭제, 인스턴스 오버라이드 복사</td></tr>\n    <tr><td class=\"k\">내보내기</td><td>레이어를 PNG로 캡처</td></tr>\n  </table></div>\n\n  <h3>안 되는 것</h3>\n  <div class=\"tblwrap\"><table>\n    <tr><th>한계</th><th>실제로 일어나는 일</th><th>어떻게 하나</th></tr>\n    <tr><td class=\"k\">폰트 지정</td><td>서체를 직접 못 고릅니다. HTML 시안의 웹폰트가 그대로 안 들어갑니다</td><td>파일에 이미 있는 텍스트 스타일 중 제일 가까운 걸 고릅니다</td></tr>\n    <tr><td class=\"k\">사진 삽입</td><td>이미지를 넣을 수 없어 색 사각형으로 대체됩니다</td><td>규격을 이름에 적어두고 <code>/ui-assets</code>에서 교체합니다</td></tr>\n    <tr><td class=\"k\">그라데이션·그림자</td><td>단색으로 단순화됩니다</td><td>HTML 시안 이미지를 같이 전달해 의도를 남깁니다</td></tr>\n  </table></div>\n  <p>이 세 가지는 도구의 한계라 고칠 수 없습니다. 그래서 <code>/ui-draft</code>는 <strong>Figma에 바로 그리지 않고 HTML로 먼저 만든 뒤 그 이미지를 보면서 옮깁니다.</strong> 결과를 공유할 때도 이 한계를 매번 같이 알립니다. 자세한 건 <a href=\"#\" data-go=\"s2\">2단계 · 작업</a>을 보세요.</p>\n\n  <h2>문제 해결</h2>\n  <div class=\"tblwrap\"><table>\n    <tr><th>증상</th><th>보통 이 이유입니다</th></tr>\n    <tr><td>Claude가 Figma 도구가 없다고 한다</td><td>MCP 등록(b)이 안 됐거나 Claude를 껐다 켜지 않았습니다</td></tr>\n    <tr><td>채널에 연결이 안 된다</td><td>연결 서버(c)가 꺼졌습니다. 터미널 창을 확인하세요</td></tr>\n    <tr><td>어제 쓰던 채널 이름이 안 먹는다</td><td>정상입니다. 플러그인을 다시 열면 새 이름이 나옵니다</td></tr>\n    <tr><td>플러그인 메뉴에 안 보인다</td><td>Figma 브라우저 버전입니다. 데스크톱 앱에서 열어야 합니다</td></tr>\n    <tr><td>연결은 됐는데 엉뚱한 파일에 그린다</td><td>플러그인을 실행한 그 파일에 그립니다. 원하는 파일을 먼저 열고 플러그인을 실행하세요</td></tr>\n    <tr><td><code>bun: command not found</code></td><td>Bun 설치 후 터미널을 새로 열지 않았습니다</td></tr>\n  </table></div>\n  <p>그래도 안 되면 연결 서버를 껐다 켜고(<code>bun socket</code>), Figma 플러그인을 다시 실행한 다음, 새 채널 이름으로 다시 연결해보세요. 대부분 여기서 풀립니다.</p>","home":"<div class=\"eyebrow\">HIVELAB DESIGN</div>\n  <h1>지금 어느 단계인가요?</h1>\n  <p class=\"lede\">단계를 고르면 거기서 뭘 하고, 어떤 스킬을 쓰고, 뭘 남겨야 하는지 나옵니다. 프로세스는 그대로예요. 각 단계 밑에 AI가 할 수 있는 일이 붙었습니다.</p>\n\n  <div class=\"map\">\n    <div class=\"col\">\n      <div class=\"col-h\">1 · 분석</div>\n      <button class=\"stage\" data-stage=\"0\"><div class=\"no\">0</div><div class=\"nm\">착수</div><div class=\"sk\">/ui-intake</div></button>\n      <button class=\"stage\" data-stage=\"1-1\"><div class=\"no\">1-1</div><div class=\"nm\">기획 문서 분석</div><div class=\"sk\">/ui-analyze</div></button>\n      <button class=\"stage\" data-stage=\"1-2\"><div class=\"no\">1-2</div><div class=\"nm\">구조 · 레이아웃</div><div class=\"sk\">/ui-structure</div></button>\n      <button class=\"stage\" data-stage=\"1-3\"><div class=\"no\">1-3</div><div class=\"nm\">스타일 · 레퍼런스</div><div class=\"sk\">/ui-style</div></button>\n      <button class=\"stage gate\" data-stage=\"1-4\"><div class=\"no\">1-4</div><div class=\"nm\">방향 확정</div><div class=\"sk\">사람이 고릅니다</div></button>\n    </div>\n    <div class=\"col\">\n      <div class=\"col-h\">2 · 작업</div>\n      <button class=\"stage\" data-stage=\"2-0\"><div class=\"no\">2-0</div><div class=\"nm\">디자인 토큰</div><div class=\"sk\">/ui-tokens</div></button>\n      <button class=\"stage\" data-stage=\"2-1\"><div class=\"no\">2-1</div><div class=\"nm\">컨셉 · 시안 제작</div><div class=\"sk\">/ui-draft</div></button>\n      <button class=\"stage\" data-stage=\"2-2\"><div class=\"no\">2-2</div><div class=\"nm\">디자인 에셋</div><div class=\"sk\">/ui-assets</div></button>\n      <button class=\"stage pend\" data-stage=\"2-3\"><div class=\"no\">2-3</div><div class=\"nm\">B급 시안 컨펌</div><div class=\"sk\">10월 31일</div></button>\n      <button class=\"stage human\" data-stage=\"2-4\"><div class=\"no\">2-4 · 2-5</div><div class=\"nm\">A급 시안 · 디벨롭</div><div class=\"sk\">사람이 직접</div></button>\n    </div>\n    <div class=\"col\">\n      <div class=\"col-h\">3 · 정리</div>\n      <button class=\"stage pend\" data-stage=\"3-1\"><div class=\"no\">3-1</div><div class=\"nm\">검수 · 컴포넌트 정리<br>산출물 · 스타일가이드</div><div class=\"sk\">10월 31일</div></button>\n    </div>\n  </div>\n  <div class=\"legend\">\n    <span><i class=\"sw\" style=\"background:var(--accent)\"></i>AI가 붙은 구간</span>\n    <span><i class=\"sw\" style=\"background:var(--pending)\"></i>10월 31일 예정</span>\n    <span><i class=\"sw\" style=\"background:var(--human);height:11px;width:11px;border-radius:3px\"></i>사람이 직접</span>\n  </div>\n\n  <h2>3분 안에 시작하기</h2>\n  <p>들어 있는 건 두 가지입니다. 문서하고 스킬. 문서는 뭘 언제 어떤 기준으로 하는지 정해둔 쪽이고, 스킬은 그 자리에서 실제로 일을 하는 쪽이에요. 문서 없이 스킬만 쓰면 사람마다 결과가 다르게 나오고, 문서만 있고 스킬을 안 쓰면 빨라지는 게 없습니다.</p>\n  <pre><code># 1. 프로젝트 폴더랑 템플릿 만들기\n./bin/new-project.sh 고객사-프로젝트명\n\n# 2. 기획 문서를 projects/고객사-프로젝트명/source/ 에 넣기\n\n# 3. Claude Code에서 순서대로 실행</code></pre>\n  <pre id=\"cmds\"><code>/ui-intake      0    프로젝트 등록, 기획 문서 수령\n/ui-analyze     1-1  기획 문서 분석, 전략 잡기\n/ui-structure   1-2  IA, 화면 목록, 레이아웃 3안\n/ui-style       1-3  레퍼런스 수집, 스타일 3방향\n────────────── 1-4 방향 확정 · 사람이 고릅니다 ──────────────\n/ui-tokens      2-0  디자인 토큰 확정\n/ui-draft       2-1  컨셉 → 컴포넌트 → Figma B급 시안\n/ui-assets      2-2  디자인 에셋, 생성 프롬프트\n/ui-review      2-3  B급 시안 컨펌         [10/31]\n/ui-handoff     3-1  검수, 정리, 스타일가이드 [10/31]</code></pre>\n  <button class=\"copy\" data-copy=\"cmds\">실행 순서 복사</button>\n\n  <h2>자주 무너지는 세 가지</h2>\n  <div class=\"note warn\">\n    <div class=\"note-t\">방향 확정을 건너뛰는 경우</div>\n    <p>구조랑 스타일을 안 정하고 시안부터 만들면 시안 개수만 늘고 아무것도 확정이 안 됩니다. 1-4를 넣은 이유가 그겁니다. 형식 때문이 아니라 여기서 비용이 정해져서요.</p>\n  </div>\n  <div class=\"note warn\">\n    <div class=\"note-t\">파일 안 채우고 대화로만 진행하는 경우</div>\n    <p>대화는 세션 끝나면 사라집니다. 다음 사람은 처음부터 다시 하게 되고요. 이 프로세스가 조직에 남기려는 게 그 파일입니다.</p>\n  </div>\n  <div class=\"note warn\">\n    <div class=\"note-t\">B급 시안을 그대로 고객사에 보내는 경우</div>\n    <p>한 번만 이래도 \"AI로 대충 만드는 회사\" 소리 듣습니다. B급은 내부에서 비교하려고 만드는 거예요.</p>\n  </div>","rules":"<div class=\"eyebrow\">PRINCIPLES</div>\n  <h1>원칙: AI 사용 범위</h1>\n  <p class=\"lede\">프로젝트 사정 따라 바뀌지 않는 것들입니다. 여기랑 다른 얘기가 다른 데 적혀 있으면 이걸 따릅니다.</p>\n\n  <h2>대전제</h2>\n  <p>프로세스를 바꾸지 않습니다. 기존 프로세스 밑에 AI 레이어를 깝니다. 디자이너가 일하는 순서, 산출물 종류, 고객 커뮤니케이션 방식은 그대로고 단계마다 드는 원가랑 시간만 바뀝니다.</p>\n  <p>이건 양쪽으로 적용됩니다. AI가 빨라졌다고 단계를 건너뛰지 않고, AI가 못 하는 구간을 억지로 맡기지도 않습니다.</p>\n\n  <h2>A급 시안과 B급 시안</h2>\n  <div class=\"tblwrap\"><table>\n    <tr><th></th><th>A급 시안</th><th>B급 시안</th></tr>\n    <tr><td class=\"k\">목적</td><td>고객 제안의 메인 안</td><td>비교해 보라고 같이 내는 안</td></tr>\n    <tr><td class=\"k\">들어가는 것</td><td>브랜드 해석, 차별화 포인트</td><td>다른 선택지의 형태</td></tr>\n    <tr><td class=\"k\">만드는 사람</td><td>디자이너가 직접</td><td>AI가 만들고 사람이 고르고 손봄</td></tr>\n    <tr><td class=\"k\">AI의 역할</td><td>에셋 생성 보조만</td><td>제작 전체</td></tr>\n    <tr><td class=\"k\">고객 전달</td><td>그대로 나감</td><td>그대로 나가지 않음</td></tr>\n    <tr><td class=\"k\">품질 책임</td><td>디자이너</td><td>디자이너 (고르고 손본 결과에 대해)</td></tr>\n  </table></div>\n  <div class=\"note\">\n    <div class=\"note-t\">흔한 오해</div>\n    <p>B급이 A급을 대충 만든 버전은 아닙니다. 원래 시간이 없어서 못 만들고 버렸던 안이에요.</p>\n    <p>지금까지는 3안 제안하면 제작비가 3배였습니다. 그래서 대부분 1안만 제대로 만들고 나머지는 구색이거나 아예 안 만들었죠. A급/B급을 나누면 그 등식이 깨집니다. 품질을 낮추자는 게 아니라 볼 수 있는 선택지를 늘리자는 쪽입니다.</p>\n  </div>\n\n  <h2>고객에게 보여줄 때의 규칙</h2>\n  <p>B급 시안이 고객사에 나갈 때 지키는 순서입니다.</p>\n  <ol>\n    <li><a href=\"#\" data-go=\"qb\">품질 기준</a>을 통과한 것만</li>\n    <li><strong>사람이 손본 다음에</strong></li>\n    <li>A급이랑 나란히 놓고, <strong>어느 쪽이 메인 제안인지 밝히고</strong></li>\n    <li>AI로 만들었다는 걸 숨기지 않되 먼저 꺼내지도 않습니다. 물어보면 사실대로 답해요.</li>\n  </ol>\n  <div class=\"note\"><p>4번이 미묘합니다. <strong>도구 얘기가 나오는 순간 디자인 얘기가 사라지거든요.</strong> 먼저 꺼낼 이유가 없고, 물었을 때 숨길 이유도 없습니다.</p></div>\n\n  <h2>AI가 아직 못 들어간 구간</h2>\n  <p>숨기면 나중에 기대치가 어긋나니까 그냥 적어둡니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>구간</th><th>왜 사람이 하나</th></tr>\n    <tr><td class=\"k\">2-4 A급 시안 제작</td><td>브랜드 해석과 차별화는 아직 사람 영역입니다. <strong>일부러 남겨둔 구간</strong>이에요</td></tr>\n    <tr><td class=\"k\">2-5 디자인 디벨롭</td><td>확정안으로 전 화면 만드는 구간인데, 전체 일정에서 제일 큰 덩어리인데도 아직 손을 못 댔습니다. 다음 과제입니다</td></tr>\n  </table></div>\n  <div class=\"note warn\"><p>이 두 군데에 AI를 억지로 밀어 넣지 마세요. <strong>지금 도구 수준으로는 검수하는 시간이 그냥 만드는 시간보다 깁니다.</strong></p></div>\n\n  <h2>꼭 지킬 것 네 가지</h2>\n  <ol>\n    <li><strong>고객에게 나가는 완성도는 사람이 책임집니다.</strong> AI가 만든 건 검수하고 손보기 전엔 고객사로 안 나갑니다.</li>\n    <li><strong>앞 단계 파일이 비어 있으면 다음으로 안 넘어갑니다.</strong> 앞이 비면 뒤 단계 AI가 알아서 추측으로 채웁니다.</li>\n    <li><strong>왜 골랐는지 적어둡니다.</strong> 안 적어두면 두 달 뒤에 아무도 기억 못 해요.</li>\n    <li><strong>고객사 자료는 저장소랑 승인된 도구 밖으로 안 나갑니다.</strong></li>\n  </ol>\n\n  <h2>사람이 하는 판단</h2>\n  <p>이건 AI한테 안 넘깁니다. 넘기면 프로세스를 돌리는 의미가 없어집니다.</p>\n  <ul>\n    <li><strong>방향 결정</strong>: 3안 중 뭘로 갈지 (1-4)</li>\n    <li><strong>고객에게 나갈 것 고르기</strong>: 어느 시안을, 어느 완성도로</li>\n    <li><strong>브랜드 해석</strong>: 이 브랜드가 뭐여야 하는지</li>\n    <li><strong>품질 합격 판정</strong>: 체크리스트는 최소한만 걸러줍니다</li>\n    <li><strong>저작권·보안 판단</strong>: 이 자료를 써도 되는지, 밖으로 내보내도 되는지</li>\n  </ul>\n\n  <h2>AI 말을 그대로 믿으면 안 되는 것</h2>\n  <p>아래 항목들은 AI가 자신 있게 틀립니다. 매번 사람이 확인하세요.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>항목</th><th>왜 틀리나</th><th>확인 방법</th></tr>\n    <tr><td class=\"k\">고객사 브랜드 컬러</td><td>검색 결과랑 실제가 다를 수 있음</td><td>제공 자료 원본 대조</td></tr>\n    <tr><td class=\"k\">레퍼런스 URL</td><td>없는 주소를 그럴듯하게 만들어냄</td><td>전부 직접 열어보기</td></tr>\n    <tr><td class=\"k\">색상 대비 수치</td><td>계산 안 하고 감으로 말함</td><td>대비 계산기로 실측</td></tr>\n    <tr><td class=\"k\">폰트 라이선스</td><td>조건을 낙관적으로 기억함</td><td>제작사 공식 페이지 확인</td></tr>\n    <tr><td class=\"k\">기획서에 없는 요구</td><td>업계 관행을 문서 내용인 것처럼 말함</td><td>문서 원문 다시 보기</td></tr>\n  </table></div>\n  <p>스킬 결과물에 <code>문서에 없음: 추정</code>이 붙어 있으면 아직 가설입니다. 고객 확인 전엔 확정하지 마세요.</p>\n\n  <h2>기록</h2>\n  <p>왜 그걸 골랐는지 안 적어두면 두 달 뒤에 아무도 기억 못 합니다. 각 템플릿에 <code>결정 기록</code> 칸이 있어요. <strong>세 가지</strong>를 씁니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>무엇</th><th>어떻게</th></tr>\n    <tr><td class=\"k\">뭘 골랐나</td><td>선택한 안</td></tr>\n    <tr><td class=\"k\">왜 골랐나</td><td>근거 하나 이상</td></tr>\n    <tr><td class=\"k\">뭘 버렸나</td><td>버린 안과 버린 이유</td></tr>\n  </table></div>\n  <p><strong>버린 안을 적는 게 특히 중요합니다.</strong> 두 달 뒤에 고객이 \"그 방향은 왜 안 했어요?\" 하고 물을 때, 그리고 다음 프로젝트에서 비슷한 상황을 만날 때 씁니다.</p>\n  <p>지금까지 이건 개인의 경험이랑 감이었고, 그 사람이 나가면 같이 사라졌습니다. 조직에 남기는 방법이 이 칸이에요.</p>\n\n  <h2>저작권과 보안</h2>\n  <ul>\n    <li>레퍼런스 갤러리는 팀 내부에서 방향 잡을 때 보는 용도입니다. 수집한 이미지를 고객사 제안서나 최종 산출물에 그대로 넣지 않습니다.</li>\n    <li>레퍼런스에서 가져오는 건 구성 방식이나 여백 운용 같은 원리지, 그 화면 자체가 아닙니다.</li>\n    <li>AI로 만든 이미지는 프롬프트랑 도구명을 적어둡니다. 라이선스 조건이 도구마다 달라요.</li>\n    <li>NDA 있는 프로젝트는 고객사명으로 웹 검색을 하지 않습니다. 산업군이랑 톤 키워드로만 찾으세요.</li>\n    <li>폰트 라이선스는 꼭 확인하세요. 웹 전용인지, 앱까지 포함인지, 임베딩이 되는지가 계약마다 다릅니다.</li>\n  </ul>\n\n  <h2>이 문서를 고칠 때</h2>\n  <p>고정이긴 한데 영구불변은 아닙니다. 고칠 땐 이렇게 해요.</p>\n  <ol>\n    <li>어떤 프로젝트에서 무슨 문제가 있었는지 <strong>근거를 남기고</strong></li>\n    <li>관련 <code>SKILL.md</code>도 같이 봅니다. 단, <strong>기준을 스킬로 복사하지 말고</strong> 이 문서를 가리키게 둡니다</li>\n    <li>고쳤으면 팀에 알립니다</li>\n  </ol>\n  <div class=\"note warn\"><p>기준이 스킬마다 복사돼 있으면 언젠가 서로 충돌합니다. <strong>기준은 여기 한 곳에만 둡니다.</strong></p></div>","s1":"<div class=\"eyebrow\">STAGE 1</div>\n  <h1>분석</h1>\n  <p class=\"lede\">디자인을 시작해도 되는 상태를 만드는 단계입니다. 정보를 모으는 게 아니라 뭐가 비었는지 확정하는 쪽에 가깝습니다.</p>\n\n  <h2 id=\"st-0\">0 · 착수 <code>/ui-intake</code></h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span>고객사명, 프로젝트명, 마감일, 기획 문서</span></div><div><b>남기는 것</b><span><code>00-brief.md</code>의 기본정보 표</span></div><div><b>끝난 기준</b><span>기본정보 표에 빈칸 없음. NDA 유무 확정</span></div></div>\n  <p>프로젝트 폴더 만들고, 기획 문서 받았는지 확인하고, 기본정보를 고정합니다. 여기서 디자인 얘기를 시작하지는 않습니다. 착수는 사실 확인이에요.</p>\n  <p class=\"tight\">모르는 항목은 공란으로 두지 말고 <code>미정: 누구에게 언제 확인</code>처럼 적어두세요. 공란은 나중에 아무도 안 채웁니다.</p>\n  <div class=\"note\"><p>NDA 유무를 여기서 정합니다. 있으면 이후 전 단계에서 고객사명으로 웹 검색을 안 합니다.</p></div>\n\n  <h2 id=\"st-1-1\">1-1 · 기획 문서 분석 <code>/ui-analyze</code></h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span><code>00-brief.md</code> 기본정보 + 기획 문서 전문</span></div><div><b>남기는 것</b><span><code>00-brief.md</code> 전체</span></div><div><b>끝난 기준</b><span>전략 한 줄 + 리스크 세 개 + 확인 질문 3~7개</span></div></div>\n  <p>기획서를 통독하고 화면 리스트를 손으로 정리하던 일이, 요약본 받아서 검증하는 일로 바뀝니다. 읽기가 검증으로 바뀌는 거지 안 읽어도 된다는 뜻은 아닙니다. AI 요약만 믿고 넘어가면 여기서 프로젝트가 틀어져요.</p>\n  <h3>뽑아내는 여섯 가지</h3>\n  <ol>\n    <li><strong>비즈니스 목표</strong>: 이 사이트가 잘됐다는 게 뭘 말하는지. 문서에 여러 개 적혀 있으면 순위를 매기고, 순위가 없으면 그게 첫 번째 확인 질문이 됩니다.</li>\n    <li><strong>타겟 사용자와 방문 맥락</strong>: 모바일 비중이랑 첫 방문/재방문 비중은 레이아웃을 결정하니까 꼭 확인하세요.</li>\n    <li><strong>화면·기능·콘텐츠 목록</strong>: 이 개수가 곧 일정입니다.</li>\n    <li><strong>제약</strong>: 플랫폼, 반응형, 다국어, 접근성, 연동, 브라우저, 일정, CMS.</li>\n    <li><strong>디자이너가 챙겨야 할 것</strong>: 아래 표.</li>\n    <li><strong>문서에 없는 것</strong>: 이 단계에서 제일 값나가는 산출물.</li>\n  </ol>\n  <h3>매번 훑는 열 개</h3>\n  <div class=\"tblwrap\"><table>\n    <tr><th>체크</th><th>놓치면</th></tr>\n    <tr><td>콘텐츠 분량이 가변인 영역</td><td>시안은 예쁜데 실제 데이터 넣으면 무너짐</td></tr>\n    <tr><td>로그인 전/후 화면 분리</td><td>화면 수가 1.5배로 늘어남</td></tr>\n    <tr><td>관리자 화면이 범위에 있나</td><td>견적 밖의 일이 견적 안으로 들어옴</td></tr>\n    <tr><td>다국어</td><td>한글 기준으로 잡은 타이포가 영문에서 깨짐</td></tr>\n    <tr><td>기존 디자인 시스템이나 브랜드 가이드</td><td>토큰 새로 만들었는데 못 씀</td></tr>\n    <tr><td>접근성 요구 수준</td><td>대비랑 포커스를 전면 재작업</td></tr>\n    <tr><td>고객사가 콘텐츠를 직접 넣나 (CMS)</td><td>디자이너가 통제 못 하는 조합이 생김</td></tr>\n    <tr><td>개발 프레임워크가 정해져 있나</td><td>구현 못 하는 인터랙션을 제안함</td></tr>\n    <tr><td>실제 사진·영상 자산</td><td>시안은 스톡인데 실물은 다른 사진</td></tr>\n    <tr><td>법적 고지·약관 화면</td><td>마감 직전에 화면이 추가됨</td></tr>\n  </table></div>\n  <div class=\"note warn\"><p>이 단계에서 제일 값나가는 건 요약본이 아니라 질문 목록입니다. 요약은 AI가 알아서 해주니까 시간을 여기 쓰세요. 기획서는 늘 어딘가 비어 있는데 그걸 시안 만들다가 발견하면 이미 늦습니다. 질문이 여덟 개를 넘으면 기획서가 아직 덜 된 거고요.</p></div>\n  \n\n  <h2 id=\"st-1-2\">1-2 · 구조 · 레이아웃 <code>/ui-structure</code></h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span><code>00-brief.md</code></span></div><div><b>남기는 것</b><span><code>01-ui-structure.md</code></span></div><div><b>끝난 기준</b><span>화면 목록 확정 + 레이아웃 3안 중 하나 선택</span></div></div>\n  <p>지금까지는 경험으로 1안 잡고 시작했습니다. 이제는 구조 유형 몇 개를 근거랑 같이 비교하고 고릅니다.</p>\n  <h3>화면 목록 표</h3>\n  <pre><code>| 화면 ID | 화면명 | 뎁스 | 유형 | 반응형 | 상태 변형 | 비고 |</code></pre>\n  <p><code>상태 변형</code>은 빈 상태, 로딩, 에러, 권한 없음처럼 추가로 그려야 하는 화면입니다. 이 칸을 채워야 실제 화면 수가 나와요. 보통 명목 화면 수의 1.3~1.6배가 나옵니다. 이 숫자가 일정의 근거가 됩니다.</p>\n  <h3>레이아웃 3안</h3>\n  <div class=\"tblwrap\"><table>\n    <tr><th>등급</th><th>어떤 건가</th></tr>\n    <tr><td class=\"k\">정석</td><td>그 유형의 표준 존 순서. 헤더 → 히어로 → 핵심가치 → 근거 → CTA → 푸터</td></tr>\n    <tr><td class=\"k\">변주</td><td>존 하나를 크게 재배치. 히어로를 빼고 바로 실제 화면이나 상품을 보여주거나, 좌측 고정 내비</td></tr>\n    <tr><td class=\"k\">파격</td><td>스크롤 문법 자체를 바꿈. 가로 스크롤, 풀스크린 섹션 전환, 단일 캔버스</td></tr>\n  </table></div>\n  <div class=\"note\"><p>A·B·C로 부르지 마세요. A급 시안 / B급 시안이랑 헷갈립니다. 회의에서 한 번은 꼭 엉켜요.</p></div>\n  <h3>기본 그리드</h3>\n  <p class=\"tight\">기획서에 다른 값이 없으면 이걸 씁니다.</p>\n  <div class=\"tblwrap\"><table><tr><th></th><th>폭</th><th>콘텐츠 최대폭</th><th>칼럼</th><th>거터</th></tr><tr><td class=\"k\">데스크톱</td><td>1440</td><td>1200</td><td>12</td><td>24</td></tr><tr><td class=\"k\">태블릿</td><td>768</td><td>·</td><td>8</td><td>·</td></tr><tr><td class=\"k\">모바일</td><td>375</td><td>·</td><td>4</td><td>·</td></tr></table></div>\n\n  <h2 id=\"st-1-3\">1-3 · 스타일 · 레퍼런스 <code>/ui-style</code></h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span><code>00-brief.md</code>, <code>01-ui-structure.md</code></span></div><div><b>남기는 것</b><span><code>02-design-style.md</code> + 레퍼런스 갤러리</span></div><div><b>끝난 기준</b><span>스타일 3방향 중 하나 선택 + 갤러리 파일 실재</span></div></div>\n  <p>지금까지는 직접 수집하고 조판했습니다. 본 양이 곧 쓴 시간이었죠. 이제 탐색량이 시간에서 분리됩니다. 더 많이 보라는 게 아니라 같은 시간에 더 넓게 보고 고를 수 있다는 뜻이에요.</p>\n  <p>레퍼런스는 6칸으로 모읍니다. 자세한 건 <a href=\"#\" data-go=\"ref\">레퍼런스 규칙</a>을 보세요.</p>\n  <h3>한 방향에 들어가는 것</h3>\n  <div class=\"tblwrap\"><table><tr><th>항목</th><th>무엇을 적나</th></tr><tr><td class=\"k\">키워드</td><td>3~5개</td></tr><tr><td class=\"k\">컬러</td><td>Primary / Secondary / Accent / Neutral 4단 / Semantic</td></tr><tr><td class=\"k\">타이포</td><td>헤드라인 서체 성격 + 본문 서체 성격 + 국문·영문 조합</td></tr><tr><td class=\"k\">그래픽</td><td>사진 톤, 일러스트 유무, 아이콘 스타일, 모션 성격</td></tr><tr><td class=\"k\">근거</td><td>갤러리 어느 칸 몇 번</td></tr><tr><td class=\"k\">맞는 이유</td><td>기획서 어느 대목과 연결되나</td></tr><tr><td class=\"k\">리스크</td><td>이 방향이 실패한다면 어떤 이유로</td></tr></table></div>\n  <div class=\"note warn\"><p><code>리스크</code> 칸을 비우지 마세요. 세 방향의 리스크를 나란히 놓으면 고객 결정이 빨라집니다.</p></div>\n  <p>세 방향은 서로 확실히 달라야 합니다. 색만 바꾼 변형 셋은 사실상 한 방향이에요.</p>\n\n  <h2 id=\"st-1-4\">1-4 · 방향 확정</h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span>위 두 파일의 3안·3방향</span></div><div><b>남기는 것</b><span>두 파일의 <code>확정</code> 칸 (날짜 + 결정자)</span></div><div><b>끝난 기준</b><span>구조·레이아웃·스타일 세 문장이 고정됨</span></div></div>\n  <div class=\"note warn\"><p>AI가 아니라 사람이 통과시킵니다.</p></div>\n  <p>세 문장이 정해져야 2단계로 갑니다.</p>\n  <pre><code>구조    : [유형]으로 간다. 화면 [n]개.\n레이아웃: [정석 / 변주 / 파격]으로 간다.\n스타일  : [정석 / 변주 / 파격]으로 간다.</code></pre>\n  <p>정하고 나서 <code>01-ui-structure.md</code>랑 <code>02-design-style.md</code>의 확정 칸에 날짜랑 정한 사람 이름을 적습니다.</p>\n  <h3>컨펌이 늦어지는 경우</h3>\n  <p>멈추지 않습니다. 내부 기준안을 먼저 확정하고 진행하되 파일에 <code>내부 확정: 고객 대기</code>로 표시해 두세요. 나중에 고객이 다른 방향을 고르면 아래 규칙대로 합니다.</p>\n\n    <div class=\"note warn\">\n    <div class=\"note-t\">여기를 건너뛰면</div>\n    <p><strong>시안 개수만 늘어나고 아무것도 확정이 안 됩니다.</strong> 그리고 2단계 전체가 재작업 대상이 돼요. 형식 때문에 만든 단계가 아니라 <strong>여기서 비용이 정해져서</strong> 만든 단계입니다.</p>\n  </div>\n\n<h2 id=\"st-back\">되돌아가는 규칙</h2>\n  <div class=\"tblwrap\"><table>\n    <tr><th>상황</th><th>어디로</th><th>다시 하는 것</th></tr>\n    <tr><td>고객이 스타일 방향을 엎음</td><td class=\"k\"><button class=\"jump\" data-stage=\"1-3\">1-3</button></td><td>스타일, 토큰, 시안. 구조는 그대로</td></tr>\n    <tr><td>고객이 화면을 추가하거나 뺌</td><td class=\"k\"><button class=\"jump\" data-stage=\"1-2\">1-2</button></td><td>구조, 시안. 스타일과 토큰은 그대로</td></tr>\n    <tr><td>기획서가 개정됨</td><td class=\"k\"><button class=\"jump\" data-stage=\"1-1\">1-1</button></td><td>전부. 일부만 바뀌었으면 해당 화면만</td></tr>\n    <tr><td>시안 보니까 토큰이 안 맞음</td><td class=\"k\"><button class=\"jump\" data-stage=\"2-0\">2-0</button></td><td>토큰 고치고 시안 다시</td></tr>\n    <tr><td>B급 시안이 기준 미달</td><td class=\"k\"><button class=\"jump\" data-stage=\"2-1\">2-1</button></td><td>시안만 다시. 기준은 안 낮춤</td></tr>\n  </table></div>\n  <p>돌아갈 때마다 해당 파일의 변경 이력에 한 줄 남깁니다. 날짜, 뭐가 바뀌었는지, 왜.</p>","s2":"<div class=\"eyebrow\">STAGE 2</div>\n  <h1>작업</h1>\n  <p class=\"lede\">1-4에서 확정한 방향을 실제 화면으로 만듭니다. 확정이 안 됐으면 이 단계를 시작하지 마세요.</p>\n\n  <h2 id=\"st-2-0\">2-0 · 디자인 토큰 <code>/ui-tokens</code></h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span><code>02-design-style.md</code>의 확정 방향</span></div><div><b>남기는 것</b><span><code>03-design-tokens.md</code></span></div><div><b>끝난 기준</b><span>토큰 표 완성 + 대비 실측 통과 + 폰트 라이선스 확인</span></div></div>\n  <div class=\"note warn\">\n    <div class=\"note-t\">왜 순서를 바꿨나</div>\n    <p>지금까지는 화면 다 그리고 나서 디자인 시스템을 정리했습니다. 그건 전 화면을 다시 만지는 일이에요. 시안 전에 정해두면 한 번만 정하면 됩니다. 이 프로세스에서 기존이랑 순서가 달라지는 건 여기 하나뿐입니다.</p>\n  </div>\n  <h3>먼저 공식을 정한다</h3>\n  <p>값을 하나씩 찍기 전에, <strong>그 값이 어디서 나왔는지</strong>부터 정합니다. 공식이 없으면 시안 중간에 \"여기만 22px\" 같은 게 생기고, 그걸 막을 근거가 없어요.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>무엇</th><th>공식으로 정할 것</th><th>예시</th></tr>\n    <tr><td class=\"k\">컬러 명도 단계</td><td>원시 단계 개수와 단계 간 명도 간격</td><td>neutral 9단, 밝은 쪽 촘촘 어두운 쪽 성기게</td></tr>\n    <tr><td class=\"k\">브랜드 상태색</td><td>primary에서 hover·active·disabled를 어떻게 파생하나</td><td>hover = 원색 ×0.88 / active = ×0.65 / disabled = 흰색 70% 혼합</td></tr>\n    <tr><td class=\"k\">텍스트용 브랜드색</td><td>원색이 대비 미달일 때 무엇으로 대체하나</td><td>색상은 유지하고 명도만 낮춘 <code>-strong</code> 단계를 따로</td></tr>\n    <tr><td class=\"k\">타입 스케일</td><td>기준 크기와 단계 배율</td><td>본문 17px 기준, 위로 20 → 28 → 40 → 56 → 72</td></tr>\n    <tr><td class=\"k\">반응형 타입</td><td>어느 계열이 유동이고 어느 계열이 고정인가</td><td>제목만 뷰포트 비율로 축소, 본문은 16px 하한 고정</td></tr>\n    <tr><td class=\"k\">간격</td><td>기준 배수와 스텝 배열</td><td>4 배수 · 4·8·12·16·24·32·48·64·96·128</td></tr>\n    <tr><td class=\"k\">반경</td><td>단계 수와 적용 기준</td><td>3단 + full. 작은 요소 s / 카드 m / 모달 l / 필형 버튼 full</td></tr>\n    <tr><td class=\"k\">그림자</td><td>단계 수와 색</td><td>3단. 검정이 아니라 배경 계열 색의 알파</td></tr>\n  </table></div>\n  <div class=\"note\"><p>공식은 <code>03-design-tokens.md</code>에 <strong>문장으로</strong> 적습니다. 표에 값만 남기면 두 달 뒤에 \"왜 이 값인가\"를 아무도 설명 못 해요.</p></div>\n\n  <h3>정하는 것</h3>\n  <div class=\"tblwrap\"><table><tr><th>항목</th><th>정하는 값</th></tr><tr><td class=\"k\">컬러</td><td>원시값 Neutral 8단 + 브랜드 + 의미값 + Semantic</td></tr><tr><td class=\"k\">타이포</td><td>Display / H1 / H2 / H3 / Body-L / Body / Body-S / Caption / Label</td></tr><tr><td class=\"k\">간격</td><td>4 또는 8 배수 하나로. 4·8·12·16·24·32·48·64·96·128</td></tr><tr><td class=\"k\">반경</td><td>3단 이내</td></tr><tr><td class=\"k\">그림자</td><td>3단 이내</td></tr><tr><td class=\"k\">그리드</td><td><code>01-ui-structure.md</code> 값을 그대로 옮김</td></tr></table></div>\n  <ul>\n    <li>값까지 정합니다. \"파란색 계열\"은 토큰이 아니에요.</li>\n    <li>원시값(<code>neutral-700</code>)이랑 의미값(<code>text-primary</code>)을 나눕니다. 화면에서는 의미값만 씁니다. 원시값을 직접 쓰기 시작하면 다크모드나 리브랜딩을 못 해요.</li>\n    <li>Neutral 8단을 줄이지 마세요. 부족하면 시안에서 임의 색이 생깁니다.</li>\n    <li>타이포는 국문 기준으로 정하고 영문을 맞춥니다. 반대로 하면 국문이 깨져요.</li>\n  </ul>\n  <h3>공통 요소 3종은 여기서 확정</h3>\n  <p>GNB, 푸터, 버튼은 <strong>전 화면에 반복됩니다.</strong> 시안마다 다르게 그려지면 화면 수만큼 재작업이 생겨요. 컴포넌트를 만드는 건 2-1이지만 <strong>스펙은 토큰과 같이</strong> 확정합니다.</p>\n  <div class=\"tblwrap\"><table>\n    <tr><th>요소</th><th>토큰 단계에서 확정할 것</th></tr>\n    <tr><td class=\"k\">GNB · 헤더</td><td>높이(PC·MO), 좌우 여백, 메뉴 항목 간격, 폰트 토큰, 기본·호버·현재 페이지 3상태 색, 스크롤 시 배경·그림자, 상단 고정 여부</td></tr>\n    <tr><td class=\"k\">푸터</td><td>배경색, 상하 패딩, 블록 간 간격, 메뉴·약관·SNS 각각의 폰트 토큰, 구분선 색</td></tr>\n    <tr><td class=\"k\">버튼</td><td>variant별 채움·글자·경계 색, 사이즈 3단의 높이·좌우 패딩·폰트 토큰, 반경, 아이콘 크기와 간격, 4상태(기본·호버·눌림·비활성)</td></tr>\n  </table></div>\n  <div class=\"note warn\"><p>버튼은 <strong>최소 높이 44px</strong>를 먼저 잡습니다. 모바일 터치 타겟 기준이고, 나중에 고치면 전 화면의 버튼이 같이 움직여요.</p></div>\n  <p>이 셋이 정해져야 2-1에서 컴포넌트를 바로 만듭니다. 안 정하고 넘어가면 시안에서 즉흥으로 정하게 되고, 그건 컴포넌트가 아니라 복사본이 됩니다.</p>\n\n  <h3>고객사에 기존 시스템이 있으면</h3>\n  <p><strong>새로 만들지 않습니다.</strong> 기존 토큰을 그대로 받아 적고, 이 프로젝트에서 추가로 필요한 것만 <code>신규</code> 표시로 붙여요. 신규 항목은 고객사 시스템 담당자한테 확인받습니다.</p>\n  <p>Figma Dev Mode MCP를 쓸 수 있으면 <code>get_variable_defs</code>로 기존 변수를 읽어옵니다. 그리고 <code>03-design-tokens.md</code> 상단에 <code>명명 규칙: 고객사 시스템 준수</code>라고 적어둡니다.</p>\n  <div class=\"note warn\"><p><strong>두 규칙을 섞지 마세요.</strong> 섞인 파일은 양쪽 어디서도 못 씁니다.</p></div>\n\n  <h3>꼭 하는 대비 검사</h3>\n  <div class=\"tblwrap\"><table>\n    <tr><th>검사</th><th>기준</th></tr>\n    <tr><td>본문 텍스트</td><td class=\"k\">4.5:1 이상</td></tr>\n    <tr><td>큰 텍스트 (18.66px+ Bold 또는 24px+)</td><td class=\"k\">3:1 이상</td></tr>\n    <tr><td>UI 요소 경계, 아이콘</td><td class=\"k\">3:1 이상</td></tr>\n    <tr><td>Primary 위의 흰 텍스트</td><td class=\"k\">4.5:1 이상</td></tr>\n  </table></div>\n  <p>AI가 말한 대비 수치는 믿지 마세요. 계산 없이 감으로 답합니다. 미달하면 그 자리에서 값을 고칩니다. 시안 단계로 미루면 전 화면에 퍼진 다음에 발견돼요.</p>\n\n  <h2 id=\"st-2-1\">2-1 · 컨셉 · 시안 제작 <code>/ui-draft</code></h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span><code>01-ui-structure.md</code>, <code>02-design-style.md</code>, <code>03-design-tokens.md</code></span></div><div><b>남기는 것</b><span><code>04-draft-log.md</code> + HTML 시안 + Figma 프레임</span></div><div><b>끝난 기준</b><span>품질 기준 A~H 통과 + 편집 조건 여섯 개 통과</span></div></div>\n  <h3>a. 디자인 컨셉</h3>\n  <pre><code>[대상]에게 [무엇]을 [어떤 방식]으로 보여주는 화면</code></pre>\n  <p>형용사가 두 개 이상 들어가면 컨셉이 아니라 희망사항이에요. 컨셉에서 디자인 규칙 세 개를 뽑습니다. 시안 만들다 판단이 갈릴 때 쓰는 기준입니다.</p>\n  <h3>b. 컴포넌트 설계</h3>\n  <div class=\"note warn\"><p>나중에 편집이 편한 시안이 되느냐가 여기서 갈립니다. 화면 먼저 그리고 나중에 컴포넌트로 묶으면 안 묶이는 조각이 꼭 남아요.</p></div>\n  <p>화면 목록을 훑어서 두 번 이상 반복되는 요소를 전부 후보로 올립니다.</p>\n  <div class=\"tblwrap\"><table><tr><th>컴포넌트</th><th>속성</th></tr><tr><td class=\"k\">Core/Button</td><td>variant: primary·secondary·ghost / size: l·m·s<br>state: default·hover·pressed·disabled / icon: none·leading·trailing·only</td></tr><tr><td class=\"k\">Core/Input</td><td>state: default·focus·error·disabled / label · helper</td></tr><tr><td class=\"k\">Core/Card</td><td>variant: default·image-top·horizontal</td></tr><tr><td class=\"k\">Core/Badge · Core/Icon</td><td>프로젝트에 맞게</td></tr><tr><td class=\"k\">Nav/Header</td><td>device: desktop·mobile</td></tr><tr><td class=\"k\">Nav/Footer · Nav/Item</td><td>Item state: default·hover·active</td></tr><tr><td class=\"k\">Feedback/Modal · Toast</td><td>size · variant</td></tr><tr><td class=\"k\">Section/*</td><td>프로젝트 전용</td></tr></table></div>\n  <p>variant를 쓰고 컴포넌트를 복제하지 마세요. <code>Button-Primary</code>랑 <code>Button-Secondary</code>를 따로 만들면 수정할 때 전부 따로 고쳐야 합니다.</p>\n  <h3>c. HTML 시안 먼저</h3>\n  <p>Figma에 바로 그리지 않습니다. Figma를 자동으로 조작하는 도구는 사각형, 텍스트, 단색 채우기 정도밖에 못 해요. 말로 된 설명만 보고 좌표를 추측해서 그리면 엉성하게 나옵니다. HTML/CSS로 타이포랑 여백, 대비를 제대로 잡은 화면을 먼저 만들어놓고 그걸 보면서 옮기면 훨씬 정확합니다.</p>\n  <ul>\n    <li>토큰 값을 CSS 변수로 선언하고 그것만 씁니다. 색상 하드코딩 금지.</li>\n    <li>카피는 기획서의 실제 문구 후보를 쓰고, 없으면 무슨 역할인지 알 수 있는 국문 자리표시 문구를 씁니다. <code>Lorem ipsum</code>은 쓰지 마세요. 국문이랑 길이감이 완전히 달라서 레이아웃 판단이 안 됩니다.</li>\n    <li>제일 긴 경우랑 제일 짧은 경우를 한 번씩 확인합니다.</li>\n  </ul>\n  <h3>d. Figma 이관</h3>\n  <p>기존 컴포넌트랑 스타일을 먼저 확인해서 재사용을 우선하고, 토큰을 스타일이나 변수로 올린 다음, 컴포넌트를 먼저 만들고, 프레임을 오토레이아웃으로 쌓으면서 인스턴스를 배치해 채웁니다.</p>\n  <h4>인계 조건</h4>\n  <ul>\n    <li>반복 요소가 전부 컴포넌트 인스턴스. 복사 붙여넣기한 그룹이 없음</li>\n    <li>모든 프레임에 오토레이아웃</li>\n    <li>직접 입력한 색상 없음. 전부 스타일이나 변수 연결</li>\n    <li>텍스트가 텍스트 스타일에 연결</li>\n    <li><code>Rectangle 42</code> 같은 레이어 이름 없음</li>\n    <li>프레임 이름이 <code>화면ID_화면명_등급_방향</code> 형식</li>\n  </ul>\n  <h4>기술적 한계 고지</h4>\n  <div class=\"tblwrap\"><table>\n    <tr><th>한계</th><th>실제로 일어나는 일</th><th>어떻게 하나</th></tr>\n    <tr><td class=\"k\">폰트 지정 불가</td><td>HTML 시안의 웹폰트가 그대로 안 들어감</td><td>제일 가까운 기존 스타일 고르고 다르다고 말함</td></tr>\n    <tr><td class=\"k\">사진 삽입 불가</td><td>사진이 색상 사각형으로 대체됨</td><td>플레이스홀더에 규격 표기, 2-2에서 교체</td></tr>\n    <tr><td class=\"k\">그라데이션·그림자</td><td>단색으로 단순화됨</td><td>HTML 시안 이미지를 같이 전달</td></tr>\n  </table></div>\n\n  <h2 id=\"st-2-2\">2-2 · 디자인 에셋 <code>/ui-assets</code></h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span><code>03-design-tokens.md</code>, <code>04-draft-log.md</code>의 에셋 요청 목록</span></div><div><b>남기는 것</b><span><code>05-assets.md</code> + <code>assets/</code> 폴더</span></div><div><b>끝난 기준</b><span>전 항목 확보 완료 또는 고객사 대기 + 프롬프트 기록</span></div></div>\n  <h3>확보 경로 판단 순서</h3>\n  <div class=\"tblwrap\"><table>\n    <tr><th>순위</th><th>경로</th><th>언제</th></tr>\n    <tr><td class=\"k\">1</td><td>고객사 제공</td><td>실제 제품, 인물, 공간 사진. 대체 불가</td></tr>\n    <tr><td class=\"k\">2</td><td>직접 제작</td><td>브랜드 고유 그래픽, 로고 변형, 다이어그램</td></tr>\n    <tr><td class=\"k\">3</td><td>라이선스 스톡</td><td>일반적인 상황 사진</td></tr>\n    <tr><td class=\"k\">4</td><td>AI 생성</td><td>배경 그래픽, 추상 패턴, 컨셉 이미지, 초안 대체물</td></tr>\n  </table></div>\n  <p>AI로 만들지 않는 것: 사람 얼굴, 실제 제품, 로고, 특정 장소, 텍스트가 들어간 이미지. 고객사가 반드시 알아봅니다.</p>\n  <h3>프롬프트 여섯 단</h3>\n  <div class=\"tblwrap\"><table><tr><th>단</th><th>무엇을 쓰나</th></tr><tr><td class=\"k\">1 피사체</td><td>뭐가 있는가. 명사 중심으로, 형용사는 최소로</td></tr><tr><td class=\"k\">2 구도</td><td>시점, 배치, 여백. 텍스트 올라갈 자리를 비워둘 건지</td></tr><tr><td class=\"k\">3 스타일</td><td>사진 / 일러스트 / 3D / 추상. 구체적인 장르명으로</td></tr><tr><td class=\"k\">4 컬러</td><td>프로젝트 토큰의 실제 HEX 값을 그대로</td></tr><tr><td class=\"k\">5 조명·질감</td><td>광원 방향, 대비, 노이즈나 그레인</td></tr><tr><td class=\"k\">6 규격</td><td>비율, 해상도</td></tr></table></div>\n  <pre id=\"pr6\"><code>[1 피사체]   뭐가 있는가. 명사 중심으로, 형용사는 최소로\n[2 구도]     시점, 배치, 여백. 텍스트 올라갈 자리를 비워둘 건지\n[3 스타일]   사진 / 일러스트 / 3D / 추상. 구체적인 장르명으로\n[4 컬러]     프로젝트 토큰의 실제 HEX 값을 그대로\n[5 조명·질감] 광원 방향, 대비, 노이즈나 그레인\n[6 규격]     비율, 해상도</code></pre>\n  <button class=\"copy\" data-copy=\"pr6\">프롬프트 구조 복사</button>\n  <p>생성 도구(힉스필드) 연결, 프롬프트 예시, 규격·용량 기준, 대체 텍스트 규칙은 <a href=\"#\" data-go=\"asset\">에셋 만들기</a>에 전부 있습니다. 여기서는 흐름만 봅니다.</p>\n  <p>4번 컬러에 토큰의 실제 HEX 값을 넣으세요. \"파란색\"이라고 쓰면 시안이랑 다른 파란색이 나옵니다. 그리고 텍스트가 올라갈 자리를 구도에 지정하세요. 안 하면 매번 다시 만들게 됩니다.</p>\n  <h3>규격</h3>\n  <div class=\"tblwrap\"><table><tr><th>용도</th><th>1배</th><th>제작 규격</th><th>용량</th></tr><tr><td class=\"k\">히어로 배경</td><td>1920×1080</td><td>2880×1620</td><td>300KB 이하</td></tr><tr><td class=\"k\">콘텐츠 이미지</td><td>1200×675</td><td>2400×1350</td><td>150KB 이하</td></tr><tr><td class=\"k\">카드 썸네일</td><td>400×300</td><td>800×600</td><td>60KB 이하</td></tr><tr><td class=\"k\">OG 이미지</td><td>1200×630</td><td>·</td><td>·</td></tr><tr><td class=\"k\">파비콘</td><td>SVG + 32×32 + 180×180</td><td>·</td><td>·</td></tr></table></div><p class=\"tight\">포맷은 사진 WebP, 그래픽 SVG, 투명 PNG-24, 애니메이션 Lottie 또는 WebM. 비율은 한 화면에서 두 종류 이내로 씁니다. 세 종류 넘게 섞이면 정렬이 무너집니다.</p>\n  <p>임시 대체물은 파일명에 <code>_TEMP</code>를 붙이고 목록에 올립니다. 고객사 전달 전에 꼭 교체하세요.</p>\n\n  <h2 id=\"st-2-3\">2-3 · B급 시안 컨펌 <code>/ui-review</code></h2>\n  <details class=\"fold\"><summary><span class=\"fold-tag\">10월 31일 예정</span>이 단계 내용 보기</summary><div class=\"fold-body\">\n  <div class=\"sk-io pd\"><div><b>읽는 것</b><span><code>04-draft-log.md</code></span></div><div><b>남기는 것</b><span><code>06-review-log.md</code></span></div><div><b>끝난 기준</b><span>10월 31일 작성 예정</span></div></div>\n  <div class=\"note pend\">\n    <div class=\"note-t\">10월 31일 작성 예정: 골격만 세워뒀습니다</div>\n    <p>빈칸을 추측으로 채우지 마세요. 채워진 것처럼 보이면 아무도 다시 안 봅니다.</p>\n  </div>\n  <h3>정해진 것</h3>\n  <ul>\n    <li>검수 대상은 <code>/ui-draft</code>가 만든 B급 시안 전체</li>\n    <li>기준은 품질 기준을 기계적으로 적용</li>\n    <li>남기는 건 <code>06-review-log.md</code>. 항목별 합·불, 불합격 사유, 수정 내용, 수정 전후</li>\n  </ul>\n  <h3>바뀌지 않는 원리</h3>\n  <p>뭘 왜 고쳤는지가 남아야 합니다. 지금까지는 기준 없이 각자 눈대중이었고, 판단 근거가 안 남아서 누가 만들었느냐에 따라 결과가 달랐습니다. 그 편차를 줄이는 게 이 단계예요.</p>\n  <h3>10/31까지 정할 것</h3>\n  <ul>\n    <li>불합격이면 자동으로 다시 만들 건지, 지적만 하고 사람이 고칠 건지</li>\n    <li>검수 단위를 화면으로 볼 건지 컴포넌트로 볼 건지</li>\n    <li>합격선을 필수 항목 전부 통과로 할 건지, 가중치 점수제로 할 건지</li>\n    <li>3-1 검수 단계랑 역할 분담</li>\n  </ul>\n\n  </div></details>\n  <h2 id=\"st-2-4\">2-4 · 2-5 · 사람 구간</h2>\n  <div class=\"sk-io\"><div><b>읽는 것</b><span>확정된 방향과 토큰, B급 시안</span></div><div><b>남기는 것</b><span>A급 시안, 전 화면 디벨롭</span></div><div><b>끝난 기준</b><span>디자이너 판단. AI가 들어가지 않는 구간</span></div></div>\n  <div class=\"note\">\n    <div class=\"note-t\">숨기지 않고 적어둡니다</div>\n    <p><strong>A급 시안 제작</strong>: 브랜드 해석과 차별화는 아직 사람 영역입니다. 일부러 남겨둔 구간이에요.</p>\n    <p><strong>디자인 디벨롭</strong>: 전체 일정에서 제일 큰 덩어리인데 아직 손을 못 댔습니다. 다음 과제입니다.</p>\n  </div>\n  <p>다만 앞 단계 산출물은 A급에도 그대로 씁니다. A급도 같은 토큰이랑 같은 컴포넌트를 써요. A급만 다른 색을 쓰면 시스템이 깨집니다. 그리고 B급 시안은 뭘 안 할지 정하는 데 씁니다. B급을 보면 A급의 차별점이 선명해지거든요.</p>\n  <p>디벨롭 구간에서 지금 할 수 있는 건 하나입니다. b단계에서 컴포넌트를 제대로 만들어두면 속도가 올라갑니다.</p>","s3":"<div class=\"eyebrow\">STAGE 3</div>\n  <h1>정리</h1>\n  <div class=\"note pend\">\n    <div class=\"note-t\">10월 31일 작성 예정: 이 단계는 일부러 비워뒀습니다</div>\n    <p>10월 31일 제출 범위(인계·검수
